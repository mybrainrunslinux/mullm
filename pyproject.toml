[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mullm"
version = "0.9.0"
description = "Local-first LLM router. 96.4% cost reduction. Free tier first."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "muLLM Contributors" }]
requires-python = ">=3.11"
keywords = ["llm", "router", "ai", "cost-optimization", "ollama", "local-first"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Web framework
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.32,<1.0",

    # Validation & config
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",

    # Async HTTP
    "httpx>=0.27,<1.0",

    # Multipart form parsing for shipped Studio upload routes
    "python-multipart>=0.0.20,<1.0",

    # Cloud SDKs (optional — graceful degrade if absent)
    "anthropic>=0.50,<1.0",
    "openai>=1.60,<3.0",

    # System stats
    "psutil>=6.0,<7.0",

    # Studio terrain / image utilities
    "numpy>=2.1,<3.0",
    "Pillow>=12.2,<13.0",

    # Terminal output
    "rich>=13.0,<15.0",

    # Structured logging
    "structlog>=24.0,<26.0",

    # Python-dotenv (for .env loading)
    "python-dotenv>=1.0,<2.0",

    # OS credential store integration (macOS Keychain, Windows Credential Manager,
    # Linux Secret Service/KWallet when available)
    "keyring>=25.0,<26.0",

    # TOML config support (built-in tomllib on Python 3.11+; this covers older)
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
gpu = [
    "pynvml>=11.0,<12.0",
]
classifier = [
    "transformers>=4.44,<5.0",
    "torch>=2.3,<3.0",
]
google = [
    "google-generativeai>=0.8,<1.0",
]
auth = [
    "authlib>=1.3,<2.0",
    "itsdangerous>=2.1,<3.0",
]
redis = [
    "redis>=5.0,<6.0",
]
studio = [
    "pillow>=12.0,<13.0",
    "imageio-ffmpeg>=0.5,<1.0",
    "kokoro>=0.9,<1.0",
    "soundfile>=0.12,<1.0",
]
sentence-transformers = [
    "sentence-transformers>=3.0,<4.0",
]
vector-cache = [
    # Optional because PYSEC-2026-311 affects ChromaDB 1.x and no fixed version
    # was reported by pip-audit as of the 1.0 recovery branch. The router
    # gracefully degrades without ChromaDB; users can opt in when they accept
    # the local-only risk or once an upstream fix is available.
    "chromadb>=1.0,<2.0",
]
cuda128 = ["torch==2.7.0", "torchvision", "torchaudio"]
cuda-nightly = []  # user installs manually; just documents the path
tts = [
    "kokoro>=0.9,<1.0",
    "soundfile>=0.12,<1.0",
]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.3,<2.0",
    "pytest-cov>=5.0,<8.0",
    "httpx>=0.27",    # also used for test client
    "playwright>=1.48,<2.0",
    "ruff>=0.8,<1.0",
]
security = [
    "bandit[toml]>=1.8,<2.0",
    "pip-audit>=2.7,<3.0",
]
all = [
    "mullm[gpu,classifier,google,sentence-transformers,vector-cache,studio,dev,security]",
]

[project.urls]
Homepage    = "https://mullm.com"
Repository  = "https://github.com/0101technology/mullm"
"Bug Tracker" = "https://github.com/0101technology/mullm/issues"

[project.scripts]
mullm        = "router.cli:main"
mullm-server = "router.main:serve"
"mullm0.9"        = "router.cli:main_09"
"mullm0.9-server" = "router.main:serve_09"

[tool.setuptools.packages.find]
where = ["."]
include = ["router*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
router = [
    "*.html",
    "code/ready/*",
    "static/*",
    "static/**/*",
    "static/lib/*",
    "groundtruth/*.json",
    "groundtruth/*.yaml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
markers = [
    "spend: tests that make real cloud API calls (run with --grep @spend)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "E402",  # module-import-not-at-top — intentional lazy imports for startup perf
    "E501",  # line-too-long
    "E701",  # multiple-statements-on-one-line — intentional in dispatch tables
    "E741",  # ambiguous-variable-name — `l` in benchmark comprehensions
]

[tool.coverage.run]
branch = true
source = ["router"]
omit = [
    "router/static/*",
    "router/backends/*",
    "router/benchmarks/*",
    "router/cache.py",
    "router/cli.py",
    "router/orchestrator.py",
    "router/review_api.py",
    "router/bench_api.py",
    "router/coverage_api.py",
    "router/plugin_manifest.py",
    "router/main.py",
    "router/realtime.py",
    "router/groundtruth/optional/*",
    "router/groundtruth/live.py",
    "router/groundtruth/loader.py",
    "router/groundtruth/wcag.py",
    "router/provider_catalog.py",
    "router/cloud.py",
    "router/secrets.py",
    "router/tiers.py",
    "router/decomposer.py",
    "router/vram_guard.py",
    "router/scorer.py",
    "router/agents.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 60

[tool.bandit]
exclude_dirs = [
    "oldcode",
    "paper",
    "cache",
    "htmlcov",
    "coverage_html",
    "mullm.egg-info",
    "tests",
]
skips = [
    "B101",
    "B404",
    "B603",
]
