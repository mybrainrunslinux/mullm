name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed release tag (for example v1.0.0)
        required: true
        type: string
      registry:
        description: Package index
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.registry }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify tag and version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os, re, subprocess, tomllib
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+(?:(?:a|b|rc)\d+)?', tag), 'Expected a release tag'
          subprocess.run(['git', 'show-ref', '--verify', 'refs/tags/' + tag], check=True)
          subprocess.run(['git', 'merge-base', '--is-ancestor', 'HEAD', 'origin/main'], check=True)
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert tag == 'v' + version, 'Tag must match package version'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY
      - name: Build and validate distribution
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Audit the installed core wheel without constraints
        run: |
          python -m venv .audit
          .audit/bin/python -m pip install dist/*.whl pip-audit
          .audit/bin/python -m pip check
          .audit/bin/python -m pip freeze --exclude mullm --exclude pip-audit > core-audit.txt
          .audit/bin/python -m pip_audit -r core-audit.txt --disable-pip --no-deps
      - name: Installed server smoke
        env:
          MULLM_RELEASE_SMOKE_DIR: ${{ runner.temp }}/mullm-browser-wheel
          MULLM_RELEASE_SMOKE_KEEP: '1'
        run: bash scripts/release-smoke.sh
      - name: Firefox and Chromium desktop startup (normal certificate checks)
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps firefox chromium
          python scripts/browser-startup-smoke.py --launcher "${{ runner.temp }}/mullm-browser-wheel/run-venv/bin/mullm"
      - uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist
      - name: Install the exact release wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          mullm --version
          mullm --help
          python -c "from importlib.resources import files; assert files('router').joinpath('templates/csv-json/factory.toml').is_file()"

  publish:
    needs: [build, install]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.registry }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist
      - name: Publish tested distributions with provenance
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          repository-url: ${{ inputs.registry == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
