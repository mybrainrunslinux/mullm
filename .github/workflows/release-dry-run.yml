name: Release Dry Run

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel-and-install:
    name: Wheel install smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Install wheel as a PyPI user
        shell: bash
        run: |
          python -m venv .release-venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source .release-venv/Scripts/activate
          else
            source .release-venv/bin/activate
          fi
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -m pip check
          mullm --version
          mullm --help

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error

  packaging-scripts:
    name: Packaging script static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Packaging tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[dev]"
          python -m pytest tests/test_packaging_release.py tests/test_module_catalog.py -q

  installed-server-smoke:
    name: Installed server smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Fresh wheel install and server smoke
        env:
          MULLM_RELEASE_SMOKE_DIR: ${{ runner.temp }}/mullm-browser-wheel
          MULLM_RELEASE_SMOKE_KEEP: '1'
        run: bash scripts/release-smoke.sh

      - name: Firefox and Chromium desktop startup (normal certificate checks)
        run: |
          "${{ runner.temp }}/mullm-browser-wheel/run-venv/bin/python" -m pip install playwright
          "${{ runner.temp }}/mullm-browser-wheel/run-venv/bin/python" -m playwright install --with-deps firefox chromium
          "${{ runner.temp }}/mullm-browser-wheel/run-venv/bin/python" scripts/browser-startup-smoke.py
