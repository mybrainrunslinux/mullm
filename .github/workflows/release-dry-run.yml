name: Release Dry Run

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel-and-install:
    name: Wheel install smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Install wheel with constraints
        shell: bash
        run: |
          python -m venv .release-venv
          source .release-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt dist/*.whl
          mullm --version
          mullm --help

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  packaging-scripts:
    name: Packaging script static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Packaging tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[dev]"
          python -m pytest tests/test_packaging_release.py tests/test_module_catalog.py -q

  installed-server-smoke:
    name: Installed server smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Fresh wheel install and server smoke
        run: bash scripts/release-smoke.sh
