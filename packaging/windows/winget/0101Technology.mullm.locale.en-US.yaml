ShortDescription: Local-first LLM router. 96.4% cost reduction. Free tier first.
Description: |-
  muLLM routes every query to the cheapest capable model: a deterministic
  lookup table, a semantic vector cache, a local 30B model, or a cloud API
  fallback — in that order. 87.5% of queries resolve free. OpenAI-compatible
  API endpoint. Drop-in replacement for cloud-only deployments.
