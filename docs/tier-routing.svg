<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">muLLM four-tier routing architecture</title>
  <desc id="desc">Queries flow through deterministic lookup, semantic cache, local inference, and finally a budget-controlled cloud fallback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#101b35"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#44d7b6"/><stop offset=".52" stop-color="#6ea8fe"/><stop offset="1" stop-color="#b88cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#6ea8fe"/>
    </marker>
    <style>
      .title{font:700 30px system-ui,sans-serif;fill:#f4f7ff}.sub{font:15px system-ui,sans-serif;fill:#9fb0cc}
      .tier{font:700 14px system-ui,sans-serif;letter-spacing:1.8px}.name{font:700 20px system-ui,sans-serif;fill:#f4f7ff}
      .detail{font:13px system-ui,sans-serif;fill:#aebbd0}.metric{font:700 14px system-ui,sans-serif}.label{font:600 12px system-ui,sans-serif;fill:#7183a3}
    </style>
  </defs>
  <rect width="1200" height="500" rx="24" fill="url(#bg)"/>
  <circle cx="1080" cy="35" r="180" fill="#376fc8" opacity=".08"/><circle cx="90" cy="480" r="190" fill="#37d6b0" opacity=".06"/>
  <text x="600" y="55" text-anchor="middle" class="title">One query. Cheapest capable answer.</text>
  <text x="600" y="82" text-anchor="middle" class="sub">Each tier short-circuits the route; cloud is the guarded fallback, not the default.</text>

  <path d="M150 270H1050" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round" opacity=".8" marker-end="url(#arrow)"/>

  <g transform="translate(35 125)" filter="url(#shadow)">
    <rect width="250" height="270" rx="18" fill="#0e2630" stroke="#35d2aa" stroke-width="2"/>
    <rect x="18" y="18" width="72" height="27" rx="13.5" fill="#35d2aa" opacity=".18"/><text x="54" y="37" text-anchor="middle" class="tier" fill="#58e4c0">TIER 0</text>
    <text x="18" y="80" class="name">Groundtruth LUT</text><text x="18" y="108" class="detail">Deterministic patterns</text>
    <text x="18" y="137" class="detail">Arithmetic · dates · HTTP</text><text x="18" y="158" class="detail">units · Big-O · Git</text>
    <text x="18" y="207" class="label">LATENCY / COST</text><text x="18" y="235" class="metric" fill="#58e4c0">&lt;1 ms  ·  $0.00</text>
  </g>
  <g transform="translate(328 125)" filter="url(#shadow)">
    <rect width="250" height="270" rx="18" fill="#10243a" stroke="#51a8f5" stroke-width="2"/>
    <rect x="18" y="18" width="72" height="27" rx="13.5" fill="#51a8f5" opacity=".18"/><text x="54" y="37" text-anchor="middle" class="tier" fill="#75bbff">TIER 1</text>
    <text x="18" y="80" class="name">Semantic Cache</text><text x="18" y="108" class="detail">Best-known answer reuse</text>
    <text x="18" y="137" class="detail">SQLite default</text><text x="18" y="158" class="detail">cosine similarity ≥ 0.98</text>
    <text x="18" y="207" class="label">LATENCY / COST</text><text x="18" y="235" class="metric" fill="#75bbff">~14 ms  ·  $0.00</text>
  </g>
  <g transform="translate(621 125)" filter="url(#shadow)">
    <rect width="250" height="270" rx="18" fill="#171f3d" stroke="#818cf8" stroke-width="2"/>
    <rect x="18" y="18" width="72" height="27" rx="13.5" fill="#818cf8" opacity=".18"/><text x="54" y="37" text-anchor="middle" class="tier" fill="#a5adff">TIER 2</text>
    <text x="18" y="80" class="name">Local Inference</text><text x="18" y="108" class="detail">Private, on-device model</text>
    <text x="18" y="137" class="detail">Ollama · ExLlama</text><text x="18" y="158" class="detail">llama.cpp · MLX</text>
    <text x="18" y="207" class="label">LATENCY / COST</text><text x="18" y="235" class="metric" fill="#a5adff">~5 sec  ·  $0.00</text>
  </g>
  <g transform="translate(914 125)" filter="url(#shadow)">
    <rect width="250" height="270" rx="18" fill="#241c3b" stroke="#b88cff" stroke-width="2"/>
    <rect x="18" y="18" width="72" height="27" rx="13.5" fill="#b88cff" opacity=".18"/><text x="54" y="37" text-anchor="middle" class="tier" fill="#cca9ff">TIER 3</text>
    <text x="18" y="80" class="name">Cloud Fallback</text><text x="18" y="108" class="detail">Quality-gated escalation</text>
    <text x="18" y="137" class="detail">16 providers</text><text x="18" y="158" class="detail">hard budget stop</text>
    <text x="18" y="207" class="label">LATENCY / COST</text><text x="18" y="235" class="metric" fill="#cca9ff">~2 sec  ·  metered</text>
  </g>
  <g fill="#07111f" stroke="#6ea8fe" stroke-width="2">
    <circle cx="306" cy="270" r="15"/><circle cx="599" cy="270" r="15"/><circle cx="892" cy="270" r="15"/>
  </g>
  <g fill="#9fb0cc" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    <text x="306" y="274">MISS</text><text x="599" y="274">MISS</text><text x="892" y="274">GATE</text>
  </g>
  <text x="600" y="448" text-anchor="middle" class="sub">DeBERTa intent + complexity classifier · 44 MB · CPU-only · 23 µs routing overhead</text>
  <text x="600" y="475" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#58e4c0">87.5% of production queries stay on-machine</text>
</svg>
