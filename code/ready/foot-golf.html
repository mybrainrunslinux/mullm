    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 15, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.1;

        // --- Lighting ---
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 20;
        dirLight.shadow.camera.bottom = -20;
        dirLight.shadow.camera.left = -20;
        dirLight.shadow.camera.right = 20;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // --- Ground ---
        const groundGeo = new THREE.PlaneGeometry(100, 100);
        const groundMat = new THREE.MeshStandardMaterial({ 
            color: 0x228B22, 
            roughness: 0.8,
            side: THREE.DoubleSide
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- Course Objects (Colorful obstacles) ---
        const obstacles = [];
        const obstacleGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.5, 8);
        const obstacleMat = new THREE.MeshStandardMaterial({ color: 0xff6600 });
        
        for (let i = 0; i < 15; i++) {
            const mesh = new THREE.Mesh(obstacleGeo, obstacleMat.clone());
            mesh.position.set(
                (Math.random() - 0.5) * 60,
                0.75,
                (Math.random() - 0.5) * 60
            );
            mesh.rotation.y = Math.random() * Math.PI;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            obstacles.push(mesh);
        }

        // --- Player (Stick Figure with Pendulum Leg) ---
        const playerGroup = new THREE.Group();
        
        // Body
        const bodyGeo = new THREE.CylinderGeometry(0.15, 0.15, 1.5, 8);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3366ff });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 1.5;
        body.castShadow = true;
        playerGroup.add(body);

        // Head
        const headGeo = new THREE.SphereGeometry(0.25, 8, 8);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffccaa });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 2.25;
        head.castShadow = true;
        playerGroup.add(head);

        // Pendulum Leg (animated)
        const legPivot = new THREE.Group();
        legPivot.position.set(0, 0.75, 0);
        playerGroup.add(legPivot);

        const legGeo = new THREE.CylinderGeometry(0.12, 0.12, 1.2, 8);
        const legMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const leg = new THREE.Mesh(legGeo, legMat);
        leg.position.y = 0.6;
        leg.castShadow = true;
        legPivot.add(leg);

        // Foot
        const footGeo = new THREE.SphereGeometry(0.15, 8, 8);
        const footMat = new THREE.MeshStandardMaterial({ color: 0x666666 });
        const foot = new THREE.Mesh(footGeo, footMat);
        foot.position.y = 0.15;
        foot.castShadow = true;
        legPivot.add(foot);

        playerGroup.position.set(0, 0, 0);
        scene.add(playerGroup);

        // --- Ball ---
        const ballGeo = new THREE.SphereGeometry(0.15, 16, 16);
        const ballMat = new THREE.MeshStandardMaterial({ 
            color: 0xff0000, 
            roughness: 0.4,
            metalness: 0.1
        });
        const ball = new THREE.Mesh(ballGeo, ballMat);
        ball.position.set(0, 0.15, 0);
        ball.castShadow = true;
        scene.add(ball);

        // --- Game State ---
        let ballVelocity = new THREE.Vector3();
        let ballFriction = 0.985;
        let ballBounce = 0.7;
        let ballResting = false;
        let ballRestingTime = 0;
        let hole = 1;
        let score = 0;
        let swingCooldown = 0;
        let swingActive = false;
        let swingAngle = 0;
        let swingSpeed = 0.3;
        let swingMaxAngle = 1.5;
        let legSwingAngle = 0;
        let legSwingSpeed = 0.15;
        let legSwingMax = 0.8;
        let legSwingDir = 1;
        let gameActive = true;
        let helpVisible = false;

        // --- Input Handling ---
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key.toLowerCase() === 'h') {
                helpVisible = !helpVisible;
                document.getElementById('help').style.opacity = helpVisible ? 1 : 0.8;
            }
            if (e.key.toLowerCase() === 'r' && ballResting) {
                resetBall();
            }
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // --- Physics Functions ---
        function applyGravity() {
            if (!ballResting) {
                ballVelocity.y -= 0.015;
            }
        }

        function applyFriction() {
            if (!ballResting) {
                ballVelocity.multiplyScalar(ballFriction);
            }
        }

        function checkCollisions() {
            // Ground
            if (ball.position.y <= 0.15) {
                ball.position.y = 0.15;
                ballVelocity.y = 0;
                if (ballVelocity.length() < 0.1) {
                    ballResting = true;
                    ballRestingTime = 0;
                }
            }

            // Obstacles
            for (const obs of obstacles) {
                const dist = ball.position.distanceTo(obs.position);
                if (dist < 0.65) {
                    // Simple bounce
                    const normal = new THREE.Vector3().subVectors(ball.position, obs.position).normalize();
                    ballVelocity.reflect(normal);
                    ballVelocity.multiplyScalar(0.6);
                    ball.position.add(normal.multiplyScalar(0.1));
                }
            }

            // Player collision (push ball away)
            const pPos = playerGroup.position;
            const pDist = ball.position.distanceTo(pPos);
            if (pDist < 0.5) {
                const normal = new THREE.Vector3().subVectors(ball.position, pPos).normalize();
                ballVelocity.add(normal.multiplyScalar(0.1));
                ball.position.add(normal.multiplyScalar(0.05));
            }
        }

        function updateLegSwing() {
            if (swingActive) {
                swingAngle += swingSpeed * legSwingDir;
                if (swingAngle >= swingMaxAngle || swingAngle <= -swingMaxAngle) {
                    swingAngle = swingMaxAngle;
                    swingActive = false;
                    swingCooldown = 60;
                }
            } else if (swingCooldown > 0) {
                swingCooldown--;
            }

            // Pendulum leg animation
            if (swingActive) {
                legSwingAngle = swingAngle;
            } else if (legSwingAngle > 0) {
                legSwingAngle += legSwingSpeed * legSwingDir;
                if (legSwingAngle >= legSwingMax) {
                    legSwingAngle = legSwingMax;
                    legSwingDir = -1;
                } else if (legSwingAngle <= -legSwingMax) {
                    legSwingAngle = -legSwingMax;
                    legSwingDir = 1;
                }
            }
        }

        function updatePlayerMovement() {
            const speed = 0.15;
            const forward = new THREE.Vector3(0, 0, 1);
            const right = new THREE.Vector3(1, 0, 0);
            const up = new THREE.Vector3(0, 1, 0);

            if (keys['w'] || keys['arrowup']) forward.add(up);
            if (keys['s'] || keys['arrowdown']) forward.sub(up);
            if (keys['a'] || keys['arrowleft']) right.add(up);
            if (keys['d'] || keys['arrowright']) right.sub(up);

            if (forward.lengthSq() > 0 || right.lengthSq() > 0) {
                const moveDir = forward.clone().add(right).normalize();
                playerGroup.position.add(moveDir.multiplyScalar(speed));
            }

            // Keep player on ground
            playerGroup.position.y = Math.max(0, playerGroup.position.y);
        }

        function updateBall() {
            if (!ballResting) {
                ball.position.add(ballVelocity);
                ballVelocity.y = Math.max(0, ballVelocity.y);
            }

            // Check if ball is far from player (ready to kick)
            if (ballResting && ball.position.distanceTo(playerGroup.position) > 1.5) {
                ballResting = false;
            }

            // Check if ball is near player (can kick)
            if (!ballResting && ball.position.distanceTo(playerGroup.position) < 1.5) {
                ballResting = true;
                ballRestingTime = 0;
            }

            // Check hole (simple: near origin)
            if (ball.position.length() < 0.3 && ballResting) {
                holeComplete();
            }
        }

        function resetBall() {
            ball.position.set(0, 0.15, 0);
            ballVelocity.set(0, 0, 0);
            ballResting = true;
            ballRestingTime = 0;
            showMessage("Ball reset!");
        }

        function holeComplete() {
            hole++;
            score++;
            showMessage(`Hole ${hole} complete!`);
            if (hole > 3) {
                showMessage("Game Over! Final Score: " + score);
                gameActive = false;
            } else {
                resetBall();
            }
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.style.opacity = 1;
            setTimeout(() => { el.style.opacity = 0; }, 2000);
        }

        // --- Rendering ---
        function render() {
            // Update positions
            updatePlayerMovement();
            updateLegSwing();
            applyGravity();
            applyFriction();
            checkCollisions();
            updateBall();

            // Animate leg
            legPivot.rotation.x = legSwingAngle;

            // Update controls
            controls.update();

            // Render
            renderer.render(scene, camera);
        }

        // --- Game Loop ---
        function loop() {
            requestAnimationFrame(loop);
            render();
        }

        // --- Initialization ---
        function init() {
            // Hide loading screen after render
            setTimeout(() => {
                const loading = document.getElementById('loading');
                loading.style.opacity = 0;
                setTimeout(() => loading.remove(), 500);
            }, 500);

            // Start game loop
            loop();
        }

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start
        init();
    </script>
</body>
