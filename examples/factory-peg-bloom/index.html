<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peg Bloom</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><p class="eyebrow">A constellation in every board</p><h1>Peg Bloom</h1><p>Jump a peg over its neighbour into an empty hole. Leave exactly the glowing finishing shape.</p></header>
<nav aria-label="Puzzle controls"><label>Puzzle <select id="board-choice"></select></label><button id="restart">Restart</button><button id="undo">Undo</button><button id="hint">Hint</button></nav>
<div class="readout"><p id="counter">Loading…</p><p id="status" role="status" aria-live="polite"></p></div><div id="board" aria-label="Peg solitaire board"></div><footer>Choose a peg, then a highlighted landing hole. Rings mark the finishing constellation.</footer></main><script type="module" src="app.mjs"></script></body></html>
