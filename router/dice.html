<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d2918">
<title>Dice Roller — muLLM</title>
<style>
/* ─── Design Tokens ─── */
:root {
  --felt: #0d2918;
  --felt-light: #143d24;
  --gold: #d4af37;
  --gold2: #f0c857;
  --silver: #c0c0c0;
  --text: #f0ead6;
  --text2: #a89a7a;
  --bg: #080c0a;
  --die-face: linear-gradient(135deg, #888 0%, #ccc 50%, #999 100%);
  --die-face-dark: linear-gradient(135deg, #555 0%, #888 50%, #666 100%);
  --radius: 8px;
  --transition: 0.15s ease;
}

/* ─── Reset & Base ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: 'Georgia', 'Times New Roman', serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ─── Felt Table ─── */
.felt-bg {
  background:
    radial-gradient(ellipse at 50% 30%, #1a4a2e 0%, #0d2918 45%, #060e09 100%);
  position: relative;
}
.felt-bg::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.03) 3px, rgba(0,0,0,0.03) 4px),
    repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(0,0,0,0.03) 3px, rgba(0,0,0,0.03) 4px);
  pointer-events: none;
}

/* ─── Header ─── */
header {
  text-align: center;
  padding: 1.5rem 1rem 1rem;
  border-bottom: 1px solid rgba(212, 175, 55, 0.2);
  background: rgba(0,0,0,0.4);
  position: relative;
  z-index: 2;
}

header h1 {
  font-size: clamp(1.5rem, 4vw, 2.2rem);
  color: var(--gold);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-shadow: 0 0 20px rgba(212,175,55,0.4);
}

header p {
  color: var(--text2);
  font-size: 0.85rem;
  margin-top: 0.25rem;
  font-style: italic;
}

/* ─── Layout ─── */
.app-layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0;
  flex: 1;
  min-height: 0;
}

@media (min-width: 768px) {
  .app-layout {
    grid-template-columns: 280px 1fr 260px;
    grid-template-rows: 1fr auto;
    height: calc(100vh - 90px);
  }
}

/* ─── Panels ─── */
.panel {
  padding: 1rem;
  border-right: 1px solid rgba(212,175,55,0.1);
}
.panel:last-child { border-right: none; }

.panel-title {
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 0.75rem;
  padding-bottom: 0.4rem;
  border-bottom: 1px solid rgba(212,175,55,0.2);
}

/* ─── Die Selector ─── */
#die-selector {
  background: rgba(0,0,0,0.3);
  border-right: 1px solid rgba(212,175,55,0.15);
}

.die-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
  gap: 0.5rem;
}

@media (min-width: 768px) {
  .die-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

.die-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.3rem;
  padding: 0.6rem 0.3rem;
  min-height: 64px;
  background: linear-gradient(135deg, rgba(136,136,136,0.15) 0%, rgba(204,204,204,0.1) 100%);
  border: 1px solid rgba(192,192,192,0.3);
  border-radius: var(--radius);
  color: var(--text);
  cursor: pointer;
  font-family: inherit;
  font-size: 0.7rem;
  font-weight: bold;
  letter-spacing: 0.05em;
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.die-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
  pointer-events: none;
}

.die-btn:hover, .die-btn:focus {
  border-color: var(--gold);
  background: linear-gradient(135deg, rgba(212,175,55,0.2) 0%, rgba(212,175,55,0.08) 100%);
  box-shadow: 0 0 12px rgba(212,175,55,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
  transform: translateY(-1px);
  outline: none;
}

.die-btn:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}

.die-btn:active { transform: translateY(0) scale(0.97); }

.die-btn.selected {
  border-color: var(--gold2);
  background: linear-gradient(135deg, rgba(240,200,87,0.25) 0%, rgba(212,175,55,0.15) 100%);
  box-shadow: 0 0 16px rgba(240,200,87,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
  color: var(--gold2);
}

.die-icon { width: 36px; height: 36px; }
.die-label { font-size: 0.65rem; color: var(--text2); }
.die-btn.selected .die-label { color: var(--gold); }

/* ─── Dice Tray ─── */
#dice-tray {
  background:
    radial-gradient(ellipse at 50% 20%, #1a4a2e 0%, #0d2918 50%, #060e09 100%);
  min-height: 300px;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

#dice-tray::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 4px),
    repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 4px);
  pointer-events: none;
}

#dice-tray::after {
  content: '';
  position: absolute;
  inset: 8px;
  border: 1px solid rgba(212,175,55,0.15);
  border-radius: 12px;
  pointer-events: none;
  box-shadow: inset 0 0 40px rgba(0,0,0,0.4);
}

.tray-inner {
  position: relative;
  z-index: 1;
  flex: 1;
  padding: 1.5rem;
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  align-content: flex-start;
  justify-content: center;
  min-height: 280px;
}

.tray-empty {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text2);
  font-style: italic;
  opacity: 0.5;
  gap: 0.5rem;
  pointer-events: none;
  min-height: 200px;
}

.tray-empty svg { opacity: 0.4; }

/* ─── Die Items in Tray ─── */
.die-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
  cursor: pointer;
  transition: transform 0.15s;
}
.die-item:hover { transform: scale(1.05); }
.die-item .die-type-label {
  font-size: 0.6rem;
  color: var(--text2);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.die-item .die-result {
  font-size: 0.9rem;
  color: var(--gold);
  font-weight: bold;
  min-height: 1.2em;
  text-align: center;
}

/* ─── CSS 3D Cube (d6) ─── */
.cube-scene {
  width: 52px;
  height: 52px;
  perspective: 200px;
}

.cube {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transform: translateZ(-26px) rotateX(0deg) rotateY(0deg);
  transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}

@media (prefers-reduced-motion: reduce) {
  .cube { transition: none; }
}

.cube-face {
  position: absolute;
  width: 52px;
  height: 52px;
  background: var(--die-face);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  font-weight: bold;
  color: #111;
  box-shadow: inset 0 2px 4px rgba(255,255,255,0.3), inset 0 -2px 4px rgba(0,0,0,0.3);
  backface-visibility: visible;
}

/* Cube face positions — front=1, back=6, right=2, left=5, top=3, bottom=4 */
.cube-face.front  { transform: rotateY(  0deg) translateZ(26px); }
.cube-face.back   { transform: rotateY(180deg) translateZ(26px); }
.cube-face.right  { transform: rotateY( 90deg) translateZ(26px); }
.cube-face.left   { transform: rotateY(-90deg) translateZ(26px); }
.cube-face.top    { transform: rotateX( 90deg) translateZ(26px); }
.cube-face.bottom { transform: rotateX(-90deg) translateZ(26px); }

/* Cube wrapper rotations to show each face
   front=1: no rotation
   right=2: rotate Y -90
   top=3:   rotate X -90
   bottom=4: rotate X 90
   left=5:  rotate Y 90
   back=6:  rotate Y 180 */
.cube[data-face="1"] { transform: translateZ(-26px) rotateX(0deg)   rotateY(0deg);   }
.cube[data-face="2"] { transform: translateZ(-26px) rotateX(0deg)   rotateY(-90deg); }
.cube[data-face="3"] { transform: translateZ(-26px) rotateX(-90deg) rotateY(0deg);   }
.cube[data-face="4"] { transform: translateZ(-26px) rotateX(90deg)  rotateY(0deg);   }
.cube[data-face="5"] { transform: translateZ(-26px) rotateX(0deg)   rotateY(90deg);  }
.cube[data-face="6"] { transform: translateZ(-26px) rotateX(0deg)   rotateY(180deg); }

/* Tumble animation keyframe — applied via JS class */
@keyframes cube-tumble {
  0%   { transform: translateZ(-26px) rotateX(0deg) rotateY(0deg); }
  20%  { transform: translateZ(-26px) rotateX(120deg) rotateY(85deg); }
  40%  { transform: translateZ(-26px) rotateX(240deg) rotateY(190deg); }
  60%  { transform: translateZ(-26px) rotateX(320deg) rotateY(260deg); }
  80%  { transform: translateZ(-26px) rotateX(380deg) rotateY(310deg); }
  100% { transform: translateZ(-26px) rotateX(360deg) rotateY(360deg); }
}

@media (prefers-reduced-motion: reduce) {
  @keyframes cube-tumble { 0%,100% { transform: translateZ(-26px); } }
}

/* ─── SVG Dice (d4/d8/d10/d12/d20) ─── */
.svg-die {
  width: 52px;
  height: 52px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.svg-die svg {
  width: 52px;
  height: 52px;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
}

.svg-die .die-number {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: clamp(0.8rem, 2vw, 1rem);
  font-weight: bold;
  color: #111;
  text-shadow: 0 1px 0 rgba(255,255,255,0.3);
  z-index: 2;
  line-height: 1;
  pointer-events: none;
}

/* Spin animation for SVG dice */
@keyframes die-spin {
  0%   { transform: rotate(0deg) scale(1); }
  20%  { transform: rotate(120deg) scale(1.1); }
  50%  { transform: rotate(270deg) scale(0.95); }
  75%  { transform: rotate(330deg) scale(1.05); }
  100% { transform: rotate(360deg) scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  @keyframes die-spin { 0%,100% { transform: none; } }
}

.svg-die.rolling svg { animation: die-spin 0.8s cubic-bezier(0.4,0,0.2,1) forwards; }
.svg-die.rolling .die-number { opacity: 0; }
.svg-die.settled .die-number { opacity: 1; animation: fadeIn 0.2s ease; }

@keyframes fadeIn { from { opacity: 0; transform: translate(-50%,-50%) scale(0.7); } to { opacity: 1; transform: translate(-50%,-50%) scale(1); } }

/* ─── d2 Coin ─── */
.coin-die {
  width: 52px;
  height: 52px;
  perspective: 160px;
}
.coin-inner {
  width: 52px;
  height: 52px;
  position: relative;
  transform-style: preserve-3d;
  border-radius: 50%;
  transition: transform 0.8s cubic-bezier(0.4,0,0.2,1);
}
@keyframes coin-flip {
  0%   { transform: rotateY(0deg); }
  100% { transform: rotateY(1080deg); }
}
.coin-inner.flipping { animation: coin-flip 0.8s cubic-bezier(0.4,0,0.2,1) forwards; }
@media (prefers-reduced-motion: reduce) {
  .coin-inner.flipping { animation: none; }
}
.coin-face {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: var(--die-face);
  border: 2px solid rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  font-weight: bold;
  color: #111;
  backface-visibility: hidden;
  box-shadow: inset 0 2px 4px rgba(255,255,255,0.3), 0 2px 8px rgba(0,0,0,0.5);
}
.coin-face.tails { transform: rotateY(180deg); }

/* ─── Drum Spinner (d100 / d5000) ─── */
.drum-container {
  display: flex;
  gap: 4px;
  align-items: center;
  justify-content: center;
}

.drum-wrapper {
  perspective: 120px;
  width: 28px;
  height: 36px;
  overflow: hidden;
  border: 1px solid rgba(192,192,192,0.4);
  border-radius: 4px;
  background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.5) 100%);
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.1);
  position: relative;
}

.drum-wrapper::before,
.drum-wrapper::after {
  content: '';
  position: absolute;
  left: 0; right: 0;
  height: 6px;
  z-index: 3;
  pointer-events: none;
}
.drum-wrapper::before { top: 0; background: linear-gradient(180deg, rgba(0,0,0,0.7), transparent); }
.drum-wrapper::after  { bottom: 0; background: linear-gradient(0deg, rgba(0,0,0,0.7), transparent); }

.drum {
  width: 28px;
  height: 36px;
  position: relative;
  transform-style: preserve-3d;
  /* rotateX transition applied in JS */
  transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}
@media (prefers-reduced-motion: reduce) {
  .drum { transition: none; }
}

.drum-face {
  position: absolute;
  width: 28px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  font-weight: bold;
  color: var(--text);
  backface-visibility: hidden;
  border: 1px solid rgba(255,255,255,0.05);
}

.drum-sep {
  color: var(--gold);
  font-size: 1rem;
  font-weight: bold;
  line-height: 36px;
}

/* ─── d5000 special ─── */
.d5000-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.d5000-shape {
  position: relative;
  width: 52px;
  height: 52px;
}
.d5000-drums {
  display: flex;
  gap: 2px;
  align-items: center;
}
.d5000-drums .drum-wrapper {
  width: 22px;
  height: 30px;
}
.d5000-drums .drum {
  width: 22px;
  height: 30px;
}
.d5000-drums .drum-face {
  width: 22px;
  height: 30px;
  font-size: 0.85rem;
}

/* ─── Right Panel ─── */
#control-panel {
  background: rgba(0,0,0,0.4);
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

/* ─── Quantity / Add Controls ─── */
.add-controls {
  display: flex;
  gap: 0.5rem;
  align-items: center;
}

.qty-input {
  width: 60px;
  padding: 0.5rem;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(192,192,192,0.3);
  border-radius: var(--radius);
  color: var(--text);
  font-family: inherit;
  font-size: 1rem;
  text-align: center;
  appearance: none;
  -moz-appearance: textfield;
}
.qty-input::-webkit-outer-spin-button,
.qty-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.qty-input:focus {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
  border-color: var(--gold);
}

.add-btn {
  flex: 1;
  padding: 0.55rem 0.75rem;
  background: linear-gradient(135deg, rgba(212,175,55,0.2), rgba(212,175,55,0.1));
  border: 1px solid var(--gold);
  border-radius: var(--radius);
  color: var(--gold);
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: bold;
  letter-spacing: 0.05em;
  cursor: pointer;
  transition: all var(--transition);
  touch-action: manipulation;
}
.add-btn:hover, .add-btn:focus-visible {
  background: linear-gradient(135deg, rgba(212,175,55,0.35), rgba(212,175,55,0.2));
  box-shadow: 0 0 10px rgba(212,175,55,0.3);
  outline: none;
}
.add-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ─── Roll / Clear Buttons ─── */
.action-btns {
  display: flex;
  gap: 0.5rem;
}

.roll-btn {
  flex: 2;
  padding: 0.9rem 1rem;
  background: linear-gradient(135deg, #d4af37 0%, #b8962e 100%);
  border: none;
  border-radius: var(--radius);
  color: #0d0a02;
  font-family: inherit;
  font-size: 1.1rem;
  font-weight: bold;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all var(--transition);
  box-shadow: 0 4px 12px rgba(212,175,55,0.3), inset 0 1px 0 rgba(255,255,255,0.3);
  touch-action: manipulation;
  min-height: 52px;
}
.roll-btn:hover, .roll-btn:focus-visible {
  background: linear-gradient(135deg, #f0c857 0%, #d4af37 100%);
  box-shadow: 0 6px 20px rgba(212,175,55,0.5), inset 0 1px 0 rgba(255,255,255,0.4);
  transform: translateY(-1px);
  outline: none;
}
.roll-btn:focus-visible { outline: 2px solid var(--gold2); outline-offset: 2px; }
.roll-btn:active { transform: translateY(1px); box-shadow: 0 2px 8px rgba(212,175,55,0.2); }
.roll-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.clear-btn {
  flex: 1;
  padding: 0.9rem 0.75rem;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(192,192,192,0.25);
  border-radius: var(--radius);
  color: var(--text2);
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: bold;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all var(--transition);
  touch-action: manipulation;
  min-height: 52px;
}
.clear-btn:hover, .clear-btn:focus-visible {
  background: rgba(255,100,100,0.1);
  border-color: rgba(255,100,100,0.4);
  color: #ff9999;
  outline: none;
}
.clear-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ─── Total Display ─── */
.total-display {
  text-align: center;
  padding: 1rem;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(212,175,55,0.2);
  border-radius: var(--radius);
}
.total-label {
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text2);
  margin-bottom: 0.25rem;
}
.total-value {
  font-size: clamp(2rem, 6vw, 3rem);
  font-weight: bold;
  color: var(--gold);
  text-shadow: 0 0 20px rgba(212,175,55,0.5);
  line-height: 1;
  transition: all 0.3s ease;
}
@media (prefers-reduced-motion: reduce) {
  .total-value { transition: none; }
}
.total-value.bump {
  animation: total-bump 0.3s ease;
}
@keyframes total-bump {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.15); color: var(--gold2); text-shadow: 0 0 30px rgba(240,200,87,0.8); }
  100% { transform: scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  @keyframes total-bump { 0%,100% { transform: none; } }
}

/* ─── Formula Display ─── */
.formula-display {
  text-align: center;
  color: var(--text2);
  font-size: 0.75rem;
  font-style: italic;
  min-height: 1.2em;
  margin-top: -0.5rem;
}

/* ─── History ─── */
.history-section { }
.history-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  max-height: 140px;
  overflow-y: auto;
}
.history-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.2rem 0.5rem;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(212,175,55,0.2);
  border-radius: 12px;
  font-size: 0.7rem;
  color: var(--text2);
  cursor: default;
  transition: all var(--transition);
}
.history-chip:hover { background: rgba(212,175,55,0.1); border-color: rgba(212,175,55,0.4); color: var(--gold); }
.history-chip .chip-total { color: var(--gold); font-weight: bold; }
.history-chip .chip-time { font-size: 0.6rem; opacity: 0.6; }

/* ─── Keyboard Hint ─── */
.kbd-hint {
  font-size: 0.65rem;
  color: var(--text2);
  text-align: center;
  opacity: 0.6;
}
kbd {
  display: inline-block;
  padding: 0.1em 0.35em;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 3px;

<script>
'use strict';

// ─── Crypto RNG ───────────────────────────────────────────────────────────────
function cryptoRand(min, max) {
  // Returns integer in [min, max] inclusive
  const range = max - min + 1;
  const array = new Uint32Array(1);
  let result;
  do {
    crypto.getRandomValues(array);
    result = array[0] % range;
  } while (array[0] >= Math.floor(0xffffffff / range) * range);
  return result + min;
}

// ─── Web Audio ────────────────────────────────────────────────────────────────
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
}

function playDiceSound() {
  ensureAudio();
  if (!audioCtx) return;
  // Short metallic clang: two oscillators, brief decay
  const t = audioCtx.currentTime;
  const osc1 = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc1.type = 'triangle';
  osc1.frequency.setValueAtTime(880, t);
  osc1.frequency.exponentialRampToValueAtTime(220, t + 0.25);

  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(1320, t);
  osc2.frequency.exponentialRampToValueAtTime(440, t + 0.15);

  gain.gain.setValueAtTime(0.12, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);

  osc1.connect(gain);
  osc2.connect(gain);
  gain.connect(audioCtx.destination);

  osc1.start(t); osc1.stop(t + 0.35);
  osc2.start(t); osc2.stop(t + 0.35);
}

// ─── Drum Component Builder ───────────────────────────────────────────────────
// faceCount: number of digits; digits: array of strings for each face
// radius: translateZ value in px for drum faces
function buildDrum(faceCount, digits, drumClass) {
  // For a drum with faceCount faces, each face height = H
  // rotateX angle per face = 360/faceCount
  // translateZ radius so faces tile: H/(2*tan(PI/N)) where H is face height
  const H = 36; // drum face height
  const anglePerFace = 360 / faceCount;
  const radius = Math.round(H / (2 * Math.tan(Math.PI / faceCount)));

  const wrapper = document.createElement('div');
  wrapper.className = `drum-wrapper${drumClass ? ' ' + drumClass : ''}`;

  const drum = document.createElement('div');
  drum.className = 'drum';
  // Set initial transform without transition so first spin works correctly
  drum.style.transform = `rotateX(0deg)`;

  for (let i = 0; i < faceCount; i++) {
    const face = document.createElement('div');
    face.className = 'drum-face';
    const rotX = anglePerFace * i;
    face.style.transform = `rotateX(${rotX}deg) translateZ(${radius}px)`;
    face.textContent = digits[i];
    drum.appendChild(face);
  }

  wrapper.appendChild(drum);
  return { wrapper, drum, anglePerFace, faceCount };
}

// Spin drum to show digit index `digitIndex`
// Spin drum so digitIndex face lands at the viewer-facing position.
// Face i is positioned at rotateX(i * anglePerFace) in local space.
// To show face i, the drum wrapper needs rotateX(-(i * anglePerFace)).
// We always accumulate in the negative direction so the drum never reverses.
//
// Verified: currentAngle=0, digit 3, 10-face →
//   targetBase=-108, delta=108, target=-468 ≡ -108 (mod 360) → face 3 shows. ✓
// Second call: currentAngle=-468, digit 7 →
//   targetBase=-252, delta=144, target=-972 ≡ -252 (mod 360) → face 7 shows. ✓
function spinDrumTo(drum, digitIndex, faceCount, currentAngle) {
  const anglePerFace = 360 / faceCount;
  const targetBase = -(digitIndex * anglePerFace);
  // Positive distance we need to travel in the forward (negative) direction
  let delta = ((currentAngle - targetBase) % 360 + 360) % 360;
  if (delta === 0) delta = 360; // never stay in place — always spin at least once
  // Subtract delta plus one full extra revolution for flair
  const target = currentAngle - delta - 360;
  drum.style.transform = `rotateX(${target}deg)`;
  return target;
}

// ─── Die Rendering ────────────────────────────────────────────────────────────
function createDieElement(dieDef, index) {
  const item = document.createElement('div');
  item.className = 'die-item';
  item.setAttribute('data-index', index);
  item.setAttribute('tabindex', '0');
  item.setAttribute('role', 'button');
  item.setAttribute('aria-label', `Die ${index + 1}: ${dieDef.label} — click to remove`);
  item.title = `Click to remove this die`;

  const typeLabel = document.createElement('div');
  typeLabel.className = 'die-type-label';
  typeLabel.textContent = dieDef.label;

  const visual = document.createElement('div');
  visual.className = 'die-visual';

  const resultEl = document.createElement('div');
  resultEl.className = 'die-result';
  resultEl.textContent = '?';

  if (dieDef.type === 'cube') {
    visual.appendChild(buildCubeElement());
  } else if (dieDef.type === 'coin') {
    visual.appendChild(buildCoinElement());
  } else if (dieDef.type === 'drum100') {
    visual.appendChild(buildDrum100Element());
  } else if (dieDef.type === 'drum5000') {
    visual.appendChild(buildDrum5000Element());
  } else {
    visual.appendChild(buildSvgDie(dieDef));
  }

  item.appendChild(typeLabel);
  item.appendChild(visual);
  item.appendChild(resultEl);

  item.addEventListener('click', () => removeDie(index));
  item.addEventListener('keydown', (e) => {
    if (e.key === 'Delete' || e.key === 'Backspace') removeDie(index);
  });

  return item;
}

function buildCubeElement() {
  const scene = document.createElement('div');
  scene.className = 'cube-scene';
  const cube = document.createElement('div');
  cube.className = 'cube';
  cube.setAttribute('data-face', '1');
  cube.setAttribute('data-current-angle-x', '0');
  cube.setAttribute('data-current-angle-y', '0');

  // face order: front=1, back=6, right=2, left=5, top=3, bottom=4
  const faces = [
    {cls:'front', val:1}, {cls:'back', val:6},
    {cls:'right', val:2}, {cls:'left',  val:5},
    {cls:'top',   val:3}, {cls:'bottom',val:4}
  ];
  faces.forEach(f => {
    const face = document.createElement('div');
    face.className = `cube-face ${f.cls}`;
    face.textContent = f.val;
    cube.appendChild(face);
  });
  scene.appendChild(cube);
  return scene;
}

function buildCoinElement() {

function buildDrum100Element() {

  container._tens = tens;
  container._units = units;
  container._tensAngle = 0;

function buildDrum5000Element() {
  const container = document.createElement('div');

function buildSvgDie(dieDef) {

// ─── Build Die Selector ───────────────────────────────────────────────────────
function buildDieSelector() {
  DIE_DEFS.forEach(def => {
    const btn = document.createElement('button');

      btn.setAttribute('aria-pressed', 'false');
    }

    const iconEl = document.createElement('div');
    iconEl.className = 'die-icon';
    iconEl.innerHTML = def.icon;
    iconEl.firstElementChild.style.cssText = 'width:36px;height:36px;display:block';

    const label = document.createElement('div');
    label.className = 'die-label';
    label.textContent = def.label;

    btn.appendChild(iconEl);
    btn.appendChild(label);
    btn.addEventListener('click', () => selectDie(def.id));
    dieGrid.appendChild(btn);
  });
}

function selectDie(dieId) {
  selectedDieId = dieId;
  document.querySelectorAll('.die-btn').forEach(btn => {
    const isSelected = btn.dataset.dieId === dieId;
    btn.classList.toggle('selected', isSelected);
    btn.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
  });
}

// ─── Add Dice ─────────────────────────────────────────────────────────────────
function addDice() {
  const qty = Math.min(20, Math.max(1, parseInt(qtyInput.value) || 1));
  const def = DIE_DEFS.find(d => d.id === selectedDieId);
  if (!def) return;

  const remaining = 20 - trayDice.length;
  const toAdd = Math.min(qty, remaining);
  if (toAdd <= 0) {
    announce('Tray full — maximum 20 dice');
    return;
  }

  for (let i = 0; i < toAdd; i++) {
    const idx = trayDice.length;
    const element = createDieElement(def, idx);
    trayDice.push({ dieDef: def, element, result: null });
    trayInner.appendChild(element);
  }

  updateTrayEmpty();
  updateRollButton();
}

// ─── Remove Die ───────────────────────────────────────────────────────────────
function removeDie(index) {
  if (isRolling) return;
  trayDice.splice(index, 1);
  rebuildTray();
  updateTrayEmpty();
  updateRollButton();
  updateTotal();
}

function rebuildTray() {
  // Remove all dice elements and re-add with updated indices
  while (trayInner.firstChild) trayInner.removeChild(trayInner.firstChild);
  trayInner.appendChild(trayEmpty);

  trayDice.forEach((entry, i) => {
    entry.element = createDieElement(entry.dieDef, i);
    if (entry.result !== null) {
      // Restore result display
      const resultEl = entry.element.querySelector('.die-result');
      if (resultEl) resultEl.textContent = entry.result;
      // Restore visual state (no animation)
      restoreVisualResult(entry);
    }
    trayInner.appendChild(entry.element);
  });
}

function restoreVisualResult(entry) {
  const { dieDef, element, result } = entry;
  if (result === null) return;
  if (dieDef.type === 'cube') {
    const cube = element.querySelector('.cube');
    if (cube) {
      cube.style.transition = 'none';
      cube.setAttribute('data-face', result);
    }
  } else if (dieDef.type === 'svg') {
    const numEl = element.querySelector('.die-number');
    if (numEl) { numEl.textContent = result; numEl.parentElement.classList.add('settled'); }
  } else if (dieDef.type === 'coin') {
    const inner = element.querySelector('.coin-inner');
    if (inner) inner.style.transform = result === 1 ? 'rotateY(0deg)' : 'rotateY(180deg)';
    const heads = element.querySelector('.coin-face.heads');
    const tails = element.querySelector('.coin-face.tails');
    if (heads) heads.textContent = result === 1 ? 'H' : '';
    if (tails) tails.textContent = result === 2 ? 'T' : '';
  } else if (dieDef.type === 'drum100' || dieDef.type === 'drum5000') {
    // Visual drum resets on rebuild (acceptable); just ensure text result is shown
    const resultEl = element.querySelector('.die-result');
    if (resultEl) resultEl.textContent = result;
  }
}

// ─── Clear ────────────────────────────────────────────────────────────────────
function clearAll() {
  if (isRolling) return;
  trayDice = [];
  rebuildTray();
  updateTrayEmpty();
  updateRollButton();
  totalValue.textContent = '—';
  formulaDisplay.textContent = '';
}

// ─── Roll ─────────────────────────────────────────────────────────────────────
async function rollAll() {
  if (isRolling || trayDice.length === 0) return;
  isRolling = true;
  rollBtn.disabled = true;
  ensureAudio();

  // Generate results first
  const results = trayDice.map(entry => rollSingle(entry.dieDef));

  // Animate all dice in parallel
  const animations = trayDice.map((entry, i) =>
    animateDie(entry, results[i])
  );

  // Play sound at start
  playDiceSound();

  await Promise.all(animations);

  // Update state
  trayDice.forEach((entry, i) => { entry.result = results[i]; });

  // Compute total
  const total = results.reduce((s, v) => s + v, 0);
  setTotal(total);
  updateFormula();
  addToHistory(total);

  const formulaStr = buildFormulaString();
  announce(`Rolled: ${formulaStr} = ${total}`);

  isRolling = false;
  rollBtn.disabled = false;
}

function rollSingle(def) {
  if (def.id === 'd100') {
    return cryptoRand(1, 100);
  }
  return cryptoRand(def.min, def.max);
}

// ─── Animation Dispatch ───────────────────────────────────────────────────────
function animateDie(entry, result) {
  const { dieDef, element } = entry;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (dieDef.type === 'cube') {
    return animateCube(element, result, reducedMotion);
  } else if (dieDef.type === 'coin') {
    return animateCoin(element, result, reducedMotion);
  } else if (dieDef.type === 'drum100') {
    return animateDrum100(element, result, reducedMotion);
  } else if (dieDef.type === 'drum5000') {
    return animateDrum5000(element, result, reducedMotion);
  } else {
    return animateSvgDie(element, result, reducedMotion);
  }
}

// ─── Cube Animation ───────────────────────────────────────────────────────────
function animateCube(element, result, reducedMotion) {
  const cube = element.querySelector('.cube');
  if (!cube) return Promise.resolve();

  if (reducedMotion) {
    cube.setAttribute('data-face', result);
    const resultEl = element.querySelector('.die-result');
    if (resultEl) resultEl.textContent = result;
    return Promise.resolve();
  }

  // Add tumble keyframe class briefly, then swap to data-face for final position
  // We override the transition temporarily
  cube.style.transition = 'none';
  cube.style.animation = `cube-tumble 0.6s cubic-bezier(0.4,0,0.2,1) forwards`;

  return new Promise(resolve => {
    setTimeout(() => {
      cube.style.animation = '';
      cube.style.transition = 'transform 0.3s cubic-bezier(0.4,0,0.2,1)';
      cube.setAttribute('data-face', result);
      const resultEl = element.querySelector('.die-result');
      if (resultEl) resultEl.textContent = result;
      setTimeout(resolve, 350);
    }, 620);
  });
}

// ─── Coin Animation ───────────────────────────────────────────────────────────
function animateCoin(element, result, reducedMotion) {
  const inner = element.querySelector('.coin-inner');
  const resultEl = element.querySelector('.die-result');
  if (!inner) return Promise.resolve();

  const isHeads = result === 1;

  if (reducedMotion) {
    inner.style.transform = isHeads ? 'rotateY(0deg)' : 'rotateY(180deg)';
    if (resultEl) resultEl.textContent = isHeads ? 'H' : 'T';
    return Promise.resolve();
  }

  inner.classList.add('flipping');
  return new Promise(resolve => {
    setTimeout(() => {
      inner.classList.remove('flipping');
      inner.style.transform = isHeads ? 'rotateY(0deg)' : 'rotateY(180deg)';
      if (resultEl) resultEl.textContent = isHeads ? 'H' : 'T';
      resolve();
    }, ANIMATION_DURATION + 50);
  });
}

// ─── SVG Die Animation ────────────────────────────────────────────────────────
function animateSvgDie(element, result, reducedMotion) {
  const svgDieEl = element.querySelector('.svg-die');
  const numEl = element.querySelector('.die-number');
  if (!svgDieEl) return Promise.resolve();

  if (reducedMotion) {
    if (numEl) numEl.textContent = result;
    svgDieEl.classList.add('settled');
    if (element.querySelector('.die-result')) element.querySelector('.die-result').textContent = result;
    return Promise.resolve();
  }

  svgDieEl.classList.remove('settled');
  svgDieEl.classList.add('rolling');
  if (numEl) numEl.textContent = '';

  return new Promise(resolve => {
    setTimeout(() => {
      svgDieEl.classList.remove('rolling');
      svgDieEl.classList.add('settled');
      if (numEl) numEl.textContent = result;
      const resultEl = element.querySelector('.die-result');
      if (resultEl) resultEl.textContent = result;
      resolve();
    }, ANIMATION_DURATION + 50);
  });
}

// ─── Drum100 Animation ────────────────────────────────────────────────────────
function animateDrum100(element, result, reducedMotion) {
  const dc = element.querySelector('.drum-container[data-drum-type="100"]');
  if (!dc) return Promise.resolve();

  const tens  = dc._tens;
  const units = dc._units;
  if (!tens || !units) return Promise.resolve();

  // result is 1–100; display as 01–100
  const display = result === 100 ? 100 : result;
  const tensDigit  = Math.floor(display / 10) % 10;
  const unitsDigit = display % 10;

  const resultEl = element.querySelector('.die-result');

  if (reducedMotion) {
    tens.drum.style.transform  = `rotateX(${-(tensDigit * 36)}deg)`;
    units.drum.style.transform = `rotateX(${-(unitsDigit * 36)}deg)`;
    if (resultEl) resultEl.textContent = result;
    return Promise.resolve();
  }

  // Spin with momentum
  const newTensAngle  = spinDrumTo(tens.drum,  tensDigit,  10, dc._tensAngle);
  const newUnitsAngle = spinDrumTo(units.drum, unitsDigit, 10, dc._unitsAngle);
  dc._tensAngle  = newTensAngle;
  dc._unitsAngle = newUnitsAngle;

  return new Promise(resolve => {
    setTimeout(() => {
      if (resultEl) resultEl.textContent = result;
      resolve();
    }, ANIMATION_DURATION + 50);
  });
}

// ─── Drum5000 Animation ───────────────────────────────────────────────────────
function animateDrum5000(element, result, reducedMotion) {
  const drums = element.querySelector('[data-drum-type="5000"]');
  if (!drums) return Promise.resolve();

  // result is 1–5000
  const val = result - 1; // 0–4999
  const thouDigit  = Math.floor(val / 1000);    // 0–4
  const hundDigit  = Math.floor(val / 100) % 10; // 0–9
  const tensDigit  = Math.floor(val / 10)  % 10; // 0–9
  const unitsDigit = val % 10;                    // 0–9

  const resultEl = element.querySelector('.die-result');

  if (reducedMotion) {
    if (drums._thou)  drums._thou.drum.style.transform  = `rotateX(${-(thouDigit  * (360/5))}deg)`;
    if (drums._hund)  drums._hund.drum.style.transform  = `rotateX(${-(hundDigit  * 36)}deg)`;
    if (drums._tens)  drums._tens.drum.style.transform  = `rotateX(${-(tensDigit  * 36)}deg)`;
    if (drums._units) drums._units.drum.style.transform = `rotateX(${-(unitsDigit * 36)}deg)`;
    if (resultEl) resultEl.textContent = result;
    return Promise.resolve();
  }

  if (drums._thou) {
    const a = spinDrumTo(drums._thou.drum, thouDigit, 5, drums._thouAngle);
    drums._thouAngle = a;
  }
  if (drums._hund) {
    const a = spinDrumTo(drums._hund.drum, hundDigit, 10, drums._hundAngle);
    drums._hundAngle = a;
  }
  if (drums._tens) {
    const a = spinDrumTo(drums._tens.drum, tensDigit, 10, drums._tensAngle);
    drums._tensAngle = a;
  }
  if (drums._units) {
    const a = spinDrumTo(drums._units.drum, unitsDigit, 10, drums._unitsAngle);
    drums._unitsAngle = a;
  }

  return new Promise(resolve => {
    setTimeout(() => {
      if (resultEl) resultEl.textContent = result;
      resolve();
    }, ANIMATION_DURATION + 50);
  });
}

// ─── Total & Formula ──────────────────────────────────────────────────────────
function setTotal(n) {
  totalValue.textContent = n;
  totalValue.classList.remove('bump');
  void totalValue.offsetWidth; // force reflow
  totalValue.classList.add('bump');
}

function updateFormula() {
  formulaDisplay.textContent = buildFormulaString() || '';
}

function buildFormulaString() {
  if (trayDice.length === 0) return '';
  const counts = {};
  trayDice.forEach(e => {
    counts[e.dieDef.label] = (counts[e.dieDef.label] || 0) + 1;
  });
  return Object.entries(counts).map(([d, n]) => `${n}${d}`).join(' + ');
}

// ─── History ──────────────────────────────────────────────────────────────────
function addToHistory(total) {
  const formula = buildFormulaString();
  const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  rollHistory.unshift({ total, formula, time, results: trayDice.map(e => e.result) });
  if (rollHistory.length > 10) rollHistory.pop();
  renderHistory();
}

function renderHistory() {
  historyChips.innerHTML = '';
  if (rollHistory.length === 0) {
    historyChips.innerHTML = '<span style="font-size:0.7rem;color:var(--text2);font-style:italic;opacity:0.5">No rolls yet</span>';
    return;
  }
  rollHistory.forEach(h => {
    const chip = document.createElement('div');
    chip.className = 'history-chip';
    chip.setAttribute('title', `${h.formula} = ${h.total} at ${h.time}`);
    chip.innerHTML = `<span class="chip-total">${h.total}</span><span>${h.formula}</span><span class="chip-time">${h.time}</span>`;
    historyChips.appendChild(chip);
  });
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function updateTrayEmpty() {
  trayEmpty.style.display = trayDice.length === 0 ? '' : 'none';
}

function updateRollButton() {
  rollBtn.disabled = trayDice.length === 0;
}

function updateTotal() {
  const total = trayDice.reduce((s, e) => s + (e.result || 0), 0);
  if (trayDice.some(e => e.result !== null)) {
    setTotal(total);
    updateFormula();
  }
}

function announce(msg) {
  srAnnounce.textContent = '';
  requestAnimationFrame(() => { srAnnounce.textContent = msg; });
}

// ─── Swipe to Clear (mobile) ──────────────────────────────────────────────────
let swipeStartX = null;
document.getElementById('dice-tray').addEventListener('touchstart', e => {
  swipeStartX = e.touches[0].clientX;
}, { passive: true });
document.getElementById('dice-tray').addEventListener('touchend', e => {
  if (swipeStartX === null) return;
  const dx = e.changedTouches[0].clientX - swipeStartX;
  if (dx > 80) clearAll(); // swipe right
  swipeStartX = null;
}, { passive: true });

// ─── Keyboard Shortcuts ───────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const tag = document.activeElement.tagName.toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;

  switch (e.key.toLowerCase()) {
    case 'r':
      e.preventDefault();
      if (!rollBtn.disabled) rollAll();
      break;
    case 'c':
      e.preventDefault();
      clearAll();
      break;
    case ' ':
    case 'enter':
      // Only if focus is NOT on a die-btn (those handle their own click)
      if (!document.activeElement.classList.contains('die-btn')) {
        e.preventDefault();
        addDice();
      }
      break;
  }
});

// ─── Button Wiring ────────────────────────────────────────────────────────────
rollBtn.addEventListener('click', () => { ensureAudio(); rollAll(); });
clearBtn.addEventListener('click', clearAll);
addBtn.addEventListener('click', addDice);

qtyInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') addDice();
});

// ─── Init ─────────────────────────────────────────────────────────────────────
buildDieSelector();
updateTrayEmpty();
updateRollButton();

// Pre-select d6 on keyboard focus of first die button
const firstBtn = dieGrid.querySelector('.die-btn');
if (firstBtn) {
  firstBtn.addEventListener('focus', () => {
    if (!selectedDieId) selectDie('d2');
  });
}
</script>
</body>
