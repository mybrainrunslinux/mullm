<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="3D Games Gallery - Explore immersive 3D game cards in a starfield environment">
    <meta name="theme-color" content="#0a0a1a">
    <title>3D Games Gallery</title>
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #121225;
            --bg-tertiary: #1a1a3a;
            --accent: #00bfa5;
            --accent-hover: #00d4c4;
            --accent-glow: rgba(0, 191, 165, 0.4);
            --text-primary: #ffffff;
            --text-secondary: #b0b0c0;
            --text-muted: #6a6a7a;
            --error: #ff4757;
            --success: #2ed573;
            --warning: #ffa502;
            --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 30px var(--accent-glow);
            --border-radius: 12px;
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s ease;
            --transition-slow: 0.5s ease;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Focus styles for WCAG 2.2 AA */
        :focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }

        /* Skip link for keyboard navigation */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            padding: 8px 16px;
            background: var(--accent);
            color: var(--bg-primary);
            font-weight: 600;
            z-index: 10000;
            border-radius: 0 0 8px 8px;
            transition: top var(--transition-fast);
        }

        .skip-link:focus {
            top: 0;
        }

        /* Main container */
        #app {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* 3D Canvas */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* HUD Layer */
        #hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        /* Top HUD - Search and Help */
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: auto;
            gap: 16px;
        }

        /* Search Bar */
        .search-container {
            position: relative;
            min-width: 280px;
        }

        .search-input {
            width: 100%;
            padding: 14px 18px 14px 48px;
            background: var(--bg-secondary);
            border: 2px solid var(--bg-tertiary);
            border-radius: 24px;
            color: var(--text-primary);
            font-size: 16px;
            transition: all var(--transition-fast);
            backdrop-filter: blur(10px);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            outline: none;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: var(--text-muted);
            transition: fill var(--transition-fast);
        }

        .search-input:focus + .search-icon {
            fill: var(--accent);
        }

        /* Help Button */
        .help-btn {
            width: 48px;
            height: 48px;
            background: var(--bg-secondary);
            border: 2px solid var(--bg-tertiary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition-fast);
            position: relative;
        }

        .help-btn::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            opacity: 0;
            transition: opacity var(--transition-fast);
        }

        .help-btn:hover::before {
            opacity: 1;
        }

        .help-btn:hover {
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .help-icon {
            width: 24px;
            height: 24px;
            fill: var(--text-secondary);
            transition: fill var(--transition-fast);
        }

        .help-btn:hover .help-icon {
            fill: var(--accent);
        }

        /* Bottom HUD - Stats and Controls */
        .hud-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: auto;
            gap: 16px;
        }

        /* Game Count Display */
        .game-count {
            background: var(--bg-secondary);
            padding: 10px 18px;
            border-radius: 24px;
            border: 2px solid var(--bg-tertiary);
            font-size: 14px;
            color: var(--text-secondary);
            backdrop-filter: blur(10px);
        }

        /* Controls Container */
        .controls-container {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* Control Buttons */
        .control-btn {
            width: 44px;
            height: 44px;
            background: var(--bg-secondary);
            border: 2px solid var(--bg-tertiary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .control-btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .control-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--text-secondary);
            transition: fill var(--transition-fast);
        }

        .control-btn:hover svg {
            fill: var(--accent);
        }

        /* Game Card Container */
        #cards-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        /* Individual Game Card */
        .game-card {
            position: absolute;
            width: 280px;
            height: 180px;
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            pointer-events: auto;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            padding: 16px;
            transition: all var(--transition-normal);
            transform-style: preserve-3d;
            will-change: transform, opacity;
            border: 2px solid var(--bg-tertiary);
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow-soft);
        }

        .game-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--border-radius);
            padding: 2px;
            background: linear-gradient(
                45deg,
                transparent,
                var(--accent-glow),
                transparent
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity var(--transition-fast);
        }

        .game-card:hover::before {
            opacity: 1;
        }

        .game-card:hover {
            transform: scale(1.1) translateZ(50px);
            box-shadow: 0 20px 60px rgba(0, 191, 165, 0.3), var(--shadow-glow);
            border-color: var(--accent);
            z-index: 100;
        }

        .game-card:active {
            transform: scale(1.05);
        }

        /* Card Content */
        .card-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.3;
            word-break: break-word;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        .card-rating {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .rating-stars {
            display: flex;
            gap: 1px;
        }

        .rating-star {
            width: 10px;
            height: 10px;
            fill: var(--warning);
        }

        .rating-star.empty {
            fill: var(--bg-tertiary);
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 8px;
        }

        .card-tag {
            padding: 4px 8px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity var(--transition-slow);
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--bg-tertiary);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            position: absolute;
            bottom: -40px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Game Modal Overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-slow);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            width: 90%;
            max-width: 1200px;
            height: 90%;
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            display: flex;
            overflow: hidden;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform var(--transition-slow);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--bg-tertiary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-tertiary);
        }

        .modal-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .modal-close {
            width: 44px;
            height: 44px;
            background: var(--bg-secondary);
            border: 2px solid var(--bg-tertiary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .modal-close:hover {
            border-color: var(--accent);
            transform: rotate(90deg);
        }

        .modal-close svg {
            width: 20px;
            height: 20px;
            fill: var(--text-secondary);
            transition: fill var(--transition-fast);
        }

        .modal-close:hover svg {
            fill: var(--accent);
        }

        .modal-body {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .modal-iframe {
            flex: 1;
            border: none;
            background: #000;
        }

        .modal-sidebar {
            width: 300px;
            background: var(--bg-tertiary);
            border-left: 1px solid var(--bg-tertiary);
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar-section {
            margin-bottom: 24px;
        }

        .sidebar-section:last-child {
            margin-bottom: 0;
        }

        .sidebar-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

            color:
