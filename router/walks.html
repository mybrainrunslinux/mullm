<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Walk Cycle Designer - Create and preview walk cycle animations for rigged GLB models">
    <title>Walk Cycle Designer - mu|LLM</title>
    <script type="importmap">
        {
            "imports": {
                "three": "/static/three/three.module.js",
                "three/addons/": "/static/three/addons/"
            }
        }
    </script>
    <style>
        :root {
            --bg: #0a0a1a;
            --bg-light: #12122a;
            --bg-dark: #05050a;
            --teal: #00bfa5;
            --teal-dim: #00bfa54d;
            --amber: #f59e0b;
            --amber-dim: #f59e0b4d;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --border: #1e1e3f;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            --radius: 8px;
            --transition: 200ms ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            line-height: 1.5;
        }

        /* Accessibility focus styles */
        :focus-visible {
            outline: 2px solid var(--teal);
            outline-offset: 2px;
        }

        /* Skip link for keyboard users */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: var(--teal);
            color: var(--bg);
            padding: 8px 16px;
            z-index: 1000;
            border-radius: 0 0 var(--radius) 0;
            transition: top var(--transition);
        }

        .skip-link:focus {
            top: 0;
        }

        /* Navigation */
        .nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--bg-dark);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 16px;
            z-index: 100;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--teal);
            text-decoration: none;
            margin-right: 24px;
        }

        .nav-logo svg {
            width: 24px;
            height: 24px;
        }

        .nav-tabs {
            display: flex;
            gap: 2px;
            flex: 1;
            overflow-x: auto;
            max-width: 600px;
        }

        .nav-tab {
            padding: 8px 16px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.875rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all var(--transition);
            white-space: nowrap;
        }

        .nav-tab:hover {
            color: var(--text);
            background: var(--bg-light);
        }

        .nav-tab.active {
            color: var(--teal);
            border-bottom-color: var(--teal);
        }

        .nav-user {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-help-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.25rem;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
        }

        .nav-help-btn:hover {
            background: var(--bg-light);
            color: var(--text);
        }

        /* Main layout */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 320px;
            grid-template-rows: 1fr;
            height: calc(100vh - 56px);
            margin-top: 56px;
        }

        /* Viewport */
        .viewport-container {
            grid-column: 1;
            grid-row: 1;
            position: relative;
            background: var(--bg);
            overflow: hidden;
        }

        #viewport {
            width: 100%;
            height: 100%;
            outline: none;
        }

        .viewport-overlay {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .viewport-info {
            background: var(--bg-dark);
            padding: 8px 12px;
            border-radius: var(--radius);
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Walk cycle controls panel */
        .walk-cycle-controls {
            position: fixed;
            top: 70px;
            right: 16px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 50;
            min-width: 160px;
        }

        .control-btn {
            background: var(--teal-dim);
            border: 1px solid var(--teal);
            color: var(--teal);
            padding: 8px 16px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.875rem;
            transition: all var(--transition);
        }

        .control-btn:hover, .control-btn.active {
            background: var(--teal);
            color: var(--bg);
        }

        .preset-buttons {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .preset-btn {
            background: var(--bg-light);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.75rem;
            transition: all var(--transition);
        }

        .preset-btn:hover, .preset-btn.active {
            border-color: var(--amber);
            color: var(--amber);
        }
    </style>
</head>
<body>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
// Compressed-asset support (Draco geometry + KTX2/Basis textures)
const _mullmDraco = new DRACOLoader().setDecoderPath('/static/three/libs/draco/');
const _mullmKtx2 = new KTX2Loader().setTranscoderPath('/static/three/libs/basis/');
function makeGLTFLoader(renderer) {
  const l = new GLTFLoader();
  l.setDRACOLoader(_mullmDraco);
  try {
    const r = renderer || (window.__mullmProbeRenderer ||= new THREE.WebGLRenderer());
    l.setKTX2Loader(_mullmKtx2.detectSupport(r));
  } catch (e) { console.warn('KTX2 support unavailable:', e); }
  return l;
}
window.makeGLTFLoader = makeGLTFLoader;


// 1. Renderer setup - fill viewport, use antialias for quality
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x0a0a1a, 1);
document.body.appendChild(renderer.domElement);

// 2. Scene & Camera
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(0, 2, 4);

// 3. Lights - baked-style static lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
directionalLight.position.set(5, 10, 5);
directionalLight.castShadow = true;
directionalLight.shadow.mapSize.set(2048, 2048);
scene.add(directionalLight);

// 4. Controls with damping for smooth feel
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minPolarAngle = 0.1;
controls.maxPolarAngle = Math.PI - 0.1;
controls.minDistance = 0.5;
controls.maxDistance = 20;

// 5. Ground plane - using InstancedMesh for scalability
const groundGeometry = new THREE.PlaneGeometry(100, 100, 32, 32);
const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x1a1a2e,
  roughness: 0.7,
  metalness: 0.2,
  side: THREE.DoubleSide
});

// Create a single instance - efficient for one plane
const ground = new THREE.Mesh(groundGeometry, groundMaterial);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// 6. GridHelper - matches the dark theme
const gridHelper = new THREE.GridHelper(100, 100, 0x333344, 0x222233);
gridHelper.position.y = 0.01;
scene.add(gridHelper);

// 7. Animation loop with delta time tracking
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  const time  = clock.getElapsedTime();

  controls.update();

  // Drive WalkCycleController if loaded (cross-module via window)
  if (window.walkController) window.walkController.animate(delta);

  renderer.render(scene, camera);
}

// 8. Window resize handler - responsive design
function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

window.addEventListener('resize', onWindowResize);

// 9. Cleanup function - dispose resources properly
function dispose() {
  renderer.dispose();
  ground.geometry.dispose();
  ground.material.dispose();
  gridHelper.geometry.dispose();
  controls.dispose();
}

// 10. Expose for external access + cross-module globals
window.threeApp = {
  scene,
  camera,
  renderer,
  controls,
  ground,
  gridHelper,
  clock,
  GLTFLoader,
  THREE,
  dispose
};

// Start animation
animate();
</script>

<script type="module">
// Walk Cycle Controller Module — uses window.threeApp for cross-module access
// Wait for first module to finish exposing window.threeApp
await new Promise(resolve => {
  if (window.threeApp) { resolve(); return; }
  const t = setInterval(() => { if (window.threeApp) { clearInterval(t); resolve(); } }, 10);
});

const { scene, camera, renderer, clock, GLTFLoader, THREE } = window.threeApp;

class WalkCycleController {
    constructor() {
        this.clock = clock;
        this.scene = scene;
        this.model = null;
        this.meshes = [];

        // GLB AnimationMixer (for rigged models with embedded clips)
        this.mixer = null;
        this.activeAction = null;
        this.gltfAnimations = [];
        this.currentClipIndex = 0;

        // Animation state
        this.time = 0;
        this.isPlaying = false;
        this.speed = 1.0;
        this.preset = 'walk'; // 'walk' | 'run' | 'waddle'

        // Preset parameters
        this.presets = {
            walk: { speed: 0.5, amplitude: 0.1, frequency: 2.0 },
            run:  { speed: 1.5, amplitude: 0.2, frequency: 3.0 },
            waddle: { speed: 0.3, amplitude: 0.3, frequency: 1.0 }
        };

        // UI Elements
        this.ui = {
            playBtn: null,
            speedSlider: null,
            presetBtns: []
        };
    }

    // 1. Load GLB model
    loadModel(path) {
        if (!path) {
            this.loadFallbackWalker();
            return;
        }
        const loader = window.makeGLTFLoader ? window.makeGLTFLoader(renderer) : new GLTFLoader();

        loader.load(
            path,
            (gltf) => {
                if (this.model) { this.scene.remove(this.model); }
                this.meshes = [];
                if (this.mixer) { this.mixer.stopAllAction(); this.mixer = null; this.activeAction = null; this.gltfAnimations = []; }
                this.model = gltf.scene;
                this.model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        this.meshes.push(child);
                    }
                });

                // Center and scale model
                const box = new THREE.Box3().setFromObject(this.model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                this.model.position.sub(center);
                if (maxDim > 0) this.model.scale.setScalar(2.0 / maxDim);
                this.scene.add(this.model);

                // Set up AnimationMixer for embedded GLB clips
                if (gltf.animations && gltf.animations.length > 0) {
                    this.gltfAnimations = gltf.animations;
                    this.mixer = new THREE.AnimationMixer(this.model);
                    this.playGLBClip(0);
                    // Update UI clip buttons
                    if (this.ui.clipBtns) {
                        this.ui.clipBtns.forEach((btn, i) => {
                            btn.style.display = i < gltf.animations.length ? '' : 'none';
                            btn.textContent = gltf.animations[i].name || `Clip ${i}`;
                        });
                        this.ui.clipBtns[0] && this.ui.clipBtns[0].classList.add('active');
                    }
                }

                // Apply procedural preset too (fallback for unrigged models)
                this.applyPreset(this.preset);
                this.togglePlay(true);
            },
            undefined,
            (error) => {
                console.error('Failed to load model:', error);
                this.loadFallbackWalker();
            }
        );
    }

    loadFallbackWalker() {
        if (this.model) { this.scene.remove(this.model); }
        this.meshes = [];
        if (this.mixer) { this.mixer.stopAllAction(); this.mixer = null; this.activeAction = null; this.gltfAnimations = []; }

        const group = new THREE.Group();
        group.name = 'Procedural Walk Rig';
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00bfa5, roughness: 0.55, metalness: 0.15 });
        const limbMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.65, metalness: 0.05 });
        const darkMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.75 });

        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.9, 0.3), bodyMat);
        torso.position.y = 1.25;
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.34, 0.34), bodyMat);
        head.position.y = 1.95;
        const hip = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.25), darkMat);
        hip.position.y = 0.78;
        group.add(torso, head, hip);

        [
            ['left-leg', -0.18, 0.36, limbMat],
            ['right-leg', 0.18, 0.36, limbMat],
            ['left-arm', -0.46, 1.16, limbMat],
            ['right-arm', 0.46, 1.16, limbMat],
        ].forEach(([name, x, y, mat], index) => {
            const limb = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.72, 0.14), mat);
            limb.name = name;
            limb.position.set(x, y, 0);
            limb.userData.walkAmp = index % 2 === 0 ? 0.18 : -0.18;
            limb.userData.walkFreq = 2.0;
            group.add(limb);
            this.meshes.push(limb);
        });

        group.position.y = 0;
        this.model = group;
        this.scene.add(group);
        this.applyPreset(this.preset);
        this.togglePlay(true);
    }

    // 2. Apply procedural walk cycle
    applyPreset(name) {
        const params = this.presets[name] || this.presets.walk;
        this.preset = name;

        // Smooth transition for speed
        this.speed = params.speed;

        // Apply amplitude and frequency to each mesh
        this.meshes.forEach((mesh, index) => {
            // Use mix() for smooth transition (TSL-style thinking)
            const targetAmplitude = params.amplitude * (index % 2 === 0 ? 1 : -1);
            const targetFrequency = params.frequency;

            // Interpolate current values toward target
            mesh.userData.walkAmp = THREE.MathUtils.lerp(mesh.userData.walkAmp || 0, targetAmplitude, 0.1);
            mesh.userData.walkFreq = THREE.MathUtils.lerp(mesh.userData.walkFreq || 0, targetFrequency, 0.1);
        });
    }

    // 3. Play/Pause toggle
    togglePlay(force = null) {
        if (force !== null) {
            this.isPlaying = force;
        } else {
            this.isPlaying = !this.isPlaying;
        }

        // Update UI button state
        if (this.ui.playBtn) {
            this.ui.playBtn.textContent = this.isPlaying ? 'Pause' : 'Play';
            this.ui.playBtn.classList.toggle('active', this.isPlaying);
        }
    }

    // Set speed via slider
    setSpeed(value) {
        this.speed = THREE.MathUtils.clamp(value, 0.1, 5.0);
    }

    // Play a specific GLB animation clip by index
    playGLBClip(index) {
        if (!this.mixer || !this.gltfAnimations.length) return;
        if (this.activeAction) {
            this.activeAction.fadeOut(0.3);
        }
        this.currentClipIndex = index;
        const clip = this.gltfAnimations[index];
        this.activeAction = this.mixer.clipAction(clip);
        this.activeAction.reset().setEffectiveTimeScale(this.speed).fadeIn(0.3).play();
        // Update button states
        if (this.ui.clipBtns) {
            this.ui.clipBtns.forEach((btn, i) => btn.classList.toggle('active', i === index));
        }
    }

    // Animation loop
    animate(delta) {
        if (!this.model || !this.isPlaying) return;

        this.time += delta * this.speed;

        // GLB AnimationMixer update (rigged models)
        if (this.mixer) {
            this.mixer.update(delta * this.speed);
            return; // Skip procedural when using GLB clips
        }

        // Procedural fallback for unrigged models
        this.meshes.forEach((mesh, index) => {
            const amp = mesh.userData.walkAmp || 0;
            const freq = mesh.userData.walkFreq || 2.0;
            const offset = (index % 2) * Math.PI;
            const rotationX = Math.sin(this.time * freq + offset) * amp;
            mesh.rotation.x = THREE.MathUtils.lerp(mesh.rotation.x, rotationX, 0.1);
        });
    }

    // Destroy and cleanup
    destroy() {
        if (this.model) {
            this.model.traverse((child) => {
                if (child.geometry) child.geometry.dispose();
                if (child.material) {
                    if (Array.isArray(child.material)) {
                        child.material.forEach(m => m.dispose());
                    } else {
                        child.material.dispose();
                    }
                }
            });
            this.scene.remove(this.model);
            this.model = null;
            this.meshes = [];
        }
        if (this.mixer) {
            this.mixer.stopAllAction();
            this.mixer = null;
            this.activeAction = null;
            this.gltfAnimations = [];
        }
    }
}

// UI Controller for controls
class WalkCycleUI {
    constructor(controller) {
        this.controller = controller;
        this.container = document.createElement('div');
        this.container.className = 'walk-cycle-controls';

        // Play/Pause button (top-right, non-blocking)
        this.playBtn = document.createElement('button');
        controller.ui.playBtn = this.playBtn;
        this.playBtn.textContent = 'Play';
        this.playBtn.className = 'control-btn';
        this.playBtn.onclick = () => controller.togglePlay();

        // Speed slider
        this.speedSlider = document.createElement('input');
        this.speedSlider.type = 'range';
        this.speedSlider.min = 0.1;
        this.speedSlider.max = 5.0;
        this.speedSlider.step = 0.1;
        this.speedSlider.value = 1.0;
        this.speedSlider.oninput = (e) => controller.setSpeed(parseFloat(e.target.value));

        // GLB animation clip buttons (shown when rigged model is loaded)
        const clipContainer = document.createElement('div');
        clipContainer.className = 'preset-buttons';
        clipContainer.style.marginTop = '8px';
        controller.ui.clipBtns = [];
        ['idle', 'walk', 'attack'].forEach((name, i) => {
            const btn = document.createElement('button');
            btn.textContent = name;
            btn.className = 'preset-btn';
            btn.title = `Play ${name} animation`;
            btn.onclick = () => controller.playGLBClip(i);
            clipContainer.appendChild(btn);
            controller.ui.clipBtns.push(btn);
        });

        // Preset buttons (procedural fallback)
        const presetContainer = document.createElement('div');
        presetContainer.className = 'preset-buttons';

        ['Walk', 'Run', 'Waddle'].forEach(name => {
            const btn = document.createElement('button');
            btn.textContent = name;
            btn.className = 'preset-btn';
            btn.onclick = () => {
                controller.applyPreset(name.toLowerCase());
                controller.ui.presetBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            };
            presetContainer.appendChild(btn);
            controller.ui.presetBtns.push(btn);
        });

        // Assemble UI
        this.container.appendChild(this.playBtn);
        this.container.appendChild(clipContainer);
        this.container.appendChild(this.speedSlider);
        this.container.appendChild(presetContainer);

        // Add to DOM (top-right, slide-in)
        document.body.appendChild(this.container);

        // Apply slide-in transition
        this.container.style.opacity = '0';
        this.container.style.transform = 'translateX(100%)';
        requestAnimationFrame(() => {
            this.container.style.transition = 'all 0.3s ease-out';
            this.container.style.opacity = '1';
            this.container.style.transform = 'translateX(0)';
        });
    }

    destroy() {
        this.container.remove();
    }
}

// Initialize controller
const walkController = new WalkCycleController();
const walkUI = new WalkCycleUI(walkController);

// Expose controls for external use
window.WalkCycle = {
    load: (path) => walkController.loadModel(path),
    togglePlay: () => walkController.togglePlay(),
    setSpeed: (value) => walkController.setSpeed(value),
    applyPreset: (name) => walkController.applyPreset(name),
    destroy: () => {
        walkController.destroy();
        walkUI.destroy();
    }
};

let currentWalkPath = '';

async function chooseWalkModel() {
    try {
        const params = new URLSearchParams(location.search);
        let requestedUrl = params.get('url') || '';
        try {
            const saved = JSON.parse(localStorage.getItem('mullm.character.handoff') || '{}');
            requestedUrl ||= saved.url || '';
        } catch (_) {}
        if (requestedUrl) return requestedUrl;
        const response = await fetch('/api/3d-assets');
        if (!response.ok) throw new Error(`asset list ${response.status}`);
        const data = await response.json();
        const assets = Array.isArray(data.assets) ? data.assets : [];
        const preferred = assets.find(a => a.can_try && a.can_try.walks)
            || assets.find(a => (a.categories || []).includes('creature'))
            || assets.find(a => a.url && a.file && a.file.endsWith('.glb'));
        return preferred ? preferred.url : '';
    } catch (error) {
        console.warn('Could not load walk asset list:', error);
        return '';
    }
}

// Auto-load on startup; fall back to a procedural rig if no walkable GLB exists.
chooseWalkModel().then((path) => {
    currentWalkPath = path;
    walkController.loadModel(path);
});

// Click anywhere else to reload default
document.addEventListener('click', (e) => {
    if (e.target.closest('.control-btn') || e.target.closest('.preset-btn')) return;
    walkController.loadModel(currentWalkPath);
});

// Expose to first module's animate loop
window.walkController = walkController;
</script>
</body>
</html>
