<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="First-person museum gallery walkthrough with interactive 3D exhibits">
    <meta name="theme-color" content="#0a0a1a">
    <title>Museum Gallery Walkthrough</title>
    <style>
        /* CSS Reset and Base Styles */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #121225;
            --bg-tertiary: #1a1a3a;
            --accent: #00bfa5;
            --accent-hover: #00d4c2;
            --accent-dark: #009a8a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0c0;
            --text-muted: #6a6a7a;
            --text-disabled: #4a4a5a;
            --shadow-color: rgba(0, 0, 0, 0.5);
            --border-radius: 8px;
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s ease;
            --transition-slow: 0.5s ease;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
        }

        /* Focus styles for WCAG 2.2 AA */
        :focus {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }

        :focus:not(:focus-visible) {
            outline: none;
        }

        :focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }

        /* Skip link for keyboard navigation */
        .skip-link {
            position: absolute;
            top: -100px;
            left: 0;
            padding: 1rem 1.5rem;
            background: var(--accent);
            color: var(--bg-primary);
            font-weight: 600;
            z-index: 1000;
            transition: top var(--transition-fast);
        }

        .skip-link:focus {
            top: 0;
        }

        /* Main container */
        #app {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Canvas container */
        #canvas-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            cursor: none;
        }

        /* UI Overlay Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1rem;
        }

        /* Top bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
            padding: 0.5rem 1rem;
            background: linear-gradient(to bottom, rgba(10,10,26,0.8), transparent);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 191, 165, 0.2);
        }

        .top-bar h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(0, 191, 165, 0.5);
        }

        .top-bar .controls-hint {
            font-size: 0.875rem;
            color: var(--text-secondary);
            background: rgba(10, 10, 26, 0.7);
            padding: 0.5rem 1rem;
            border-radius: var(--border-radius);
            border: 1px solid rgba(0, 191, 165, 0.2);
        }

        /* Help button */
        .help-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
            border: 1px solid var(--accent);
            border-radius: var(--border-radius);
            color: var(--text-primary);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            pointer-events: auto;
            box-shadow: 0 4px 15px var(--shadow-color);
        }

        .help-btn:hover {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary));
            border-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--shadow-color);
        }

        .help-btn:active {
            transform: translateY(0);
        }

        .help-btn:focus-visible {
            box-shadow: 0 0 0 3px var(--accent);
        }

        .help-btn svg {
            width: 1.25rem;
            height: 1.25rem;
            fill: currentColor;
        }

        /* Center overlay (game info) */
        .center-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity var(--transition-normal);
        }

        .center-overlay.active {
            opacity: 1;
        }

        .center-overlay h2 {
            font-size: 2rem;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(0, 191, 165, 0.5);
            margin-bottom: 0.5rem;
        }

        .center-overlay p {
            font-size: 1.125rem;
            color: var(--text-secondary);
            max-width: 400px;
            margin: 0 auto;
        }

        /* Bottom bar */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
            padding: 1rem;
            background: linear-gradient(to top, rgba(10,10,26,0.9), transparent);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 191, 165, 0.2);
        }

        .bottom-bar .status {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .bottom-bar .status-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .bottom-bar .status-value {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent);
        }

        .bottom-bar .interaction-hint {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            padding: 0.75rem 1.25rem;
            background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
            border: 1px solid var(--accent);
            border-radius: var(--border-radius);
            min-width: 150px;
        }

        .bottom-bar .interaction-hint .key {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            background: var(--bg-primary);
            border: 1px solid var(--accent);
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--accent);
            box-shadow: 0 2px 5px var(--shadow-color);
        }

        .bottom-bar .interaction-hint .key span {
            margin: 0 0.25rem;
        }

        .bottom-bar .interaction-hint .instruction {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        /* Mobile controls */
        .mobile-controls {
            display: none;
            position: absolute;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
            gap: 1rem;
        }

        .mobile-controls .joystick-zone {
            width: 120px;
            height: 120px;
            background: rgba(10, 10, 26, 0.5);
            border: 2px solid var(--accent);
            border-radius: 50%;
            position: relative;
            touch-action: none;
        }

        .mobile-controls .joystick-knob {
            width: 50px;
            height: 50px;
            background: var(--accent);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(0, 191, 165, 0.5);
        }

        .mobile-controls .action-btn {
            width: 80px;
            height: 80px;
            background: var(--bg-tertiary);
            border: 2px solid var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-weight: 600;
            font-size: 1.25rem;
            touch-action: none;
            transition: all var(--transition-fast);
        }

        .mobile-controls .action-btn:active,
        .mobile-controls .action-btn.active {
            background: var(--accent);
            color: var(--bg-primary);
            transform: scale(0.95);
        }

        /* Loading screen */
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity var(--transition-slow);
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-screen .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--bg-secondary);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1.5rem;
        }

        .loading-screen .spinner::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg-secondary);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        .loading-screen .loading-text {
            font-size: 1.125rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .loading-screen .loading-progress {
            width: 200px;
            height: 6px;
            background: var(--bg-secondary);
            border-radius: 3px;
            overflow: hidden;
        }

        .loading-screen .loading-progress-bar {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Modal for help */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-normal);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--accent);
            border-radius: var(--border-radius);
            padding: 2rem;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px var(--shadow-color);
            transform: scale(0.9);
            transition: transform var(--transition-normal);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal h2 {
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 1rem;
            text-align: center;
        }

        .modal .modal-content {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.75;
        }

        .modal .modal-content ul {
            padding-left: 1.5rem;
            margin: 1rem 0;
        }

        .modal .modal-content li {
            margin: 0.5rem 0;
        }

        .modal .modal-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .modal .modal-actions button {
            padding: 0.75rem 1.5rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--accent);
            border-radius: var(--border-radius);
            color: var(--text-primary);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .modal .modal-actions button:hover {
            background: var(--accent);
            color: var(--bg-primary);
        }

        /* Accessibility: reduced motion preference */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.
