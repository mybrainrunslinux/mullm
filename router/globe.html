<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>muLLM — Data Globe</title><script type="importmap">{"imports":{"three":"/static/three/three.module.js","three/addons/":"/static/three/addons/"}}</script>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#02040a;color:#dbeafe;font:14px system-ui}canvas{display:block}.panel{position:fixed;z-index:2;top:18px;left:18px;width:min(340px,calc(100vw - 36px));padding:16px;background:#07101dde;border:1px solid #1e3a5f;border-radius:12px;backdrop-filter:blur(12px)}h1{margin:0 0 5px;font-size:20px;color:#67e8f9}.sub{color:#93a4b8;font-size:12px;line-height:1.45}.row{display:flex;gap:8px;margin-top:12px}button,textarea{border:1px solid #285078;background:#0c1b2d;color:#e5f6ff;border-radius:7px;padding:8px}button{cursor:pointer;color:#67e8f9}textarea{width:100%;height:110px;resize:vertical;font:11px ui-monospace,monospace}.credit{position:fixed;right:12px;bottom:10px;color:#8ba2b8;font-size:11px;background:#020611bb;padding:5px 8px;border-radius:5px}a{color:#67e8f9}</style></head>
<body><section class="panel"><h1>Data Globe</h1><div class="sub">Three.js r185 · drag to orbit · scroll to zoom. Paste JSON rows with <code>lat</code>, <code>lng</code>, and optional <code>value</code>, <code>label</code>, or <code>color</code>.</div><div class="row"><button id="sample">Sample data</button><button id="plot">Plot JSON</button><button id="spin">Pause spin</button></div><textarea id="data" aria-label="Globe data JSON"></textarea><div id="status" class="sub"></div></section><div class="credit">Earth imagery: <a href="https://science.nasa.gov/earth/earth-observatory/blue-marble-next-generation/" target="_blank" rel="noopener">NASA Earth Observatory — Blue Marble</a></div>
<script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x02040a);const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(0,1.2,7);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=3;controls.maxDistance=14;
scene.add(new THREE.HemisphereLight(0x99ccff,0x06101b,1.1));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(-4,3,5);scene.add(sun);const earth=new THREE.Group();scene.add(earth);const mat=new THREE.MeshStandardMaterial({color:0x2b75a8,roughness:.72,metalness:0});const globe=new THREE.Mesh(new THREE.SphereGeometry(2,128,64),mat);earth.add(globe);earth.add(new THREE.Mesh(new THREE.SphereGeometry(2.025,96,48),new THREE.MeshPhongMaterial({color:0x87ceeb,transparent:true,opacity:.09,side:THREE.BackSide})));new THREE.TextureLoader().load('https://assets.science.nasa.gov/content/dam/science/esd/eo/images/bmng/bmng-base/january/world.200401.3x5400x2700.jpg',t=>{t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy();mat.map=t;mat.color.set(0xffffff);mat.needsUpdate=true},undefined,()=>document.getElementById('status').textContent='NASA texture unavailable; using ocean fallback.');
const stars=new THREE.BufferGeometry(),p=[];for(let i=0;i<2500;i++){const r=25+Math.random()*45,a=Math.random()*Math.PI*2,b=Math.acos(2*Math.random()-1);p.push(r*Math.sin(b)*Math.cos(a),r*Math.cos(b),r*Math.sin(b)*Math.sin(a))}stars.setAttribute('position',new THREE.Float32BufferAttribute(p,3));scene.add(new THREE.Points(stars,new THREE.PointsMaterial({color:0xbad7ff,size:.035,sizeAttenuation:true})));
const markers=new THREE.Group();earth.add(markers);function xyz(lat,lng,r=2.04){const phi=(90-lat)*Math.PI/180,th=(lng+180)*Math.PI/180;return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(th),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(th))}function plot(rows){markers.clear();for(const row of rows){const v=Math.max(0,Number(row.value??1)),h=.04+Math.sqrt(v)*.025,pos=xyz(Number(row.lat),Number(row.lng));if(!Number.isFinite(pos.x))continue;const mesh=new THREE.Mesh(new THREE.CylinderGeometry(.018,.035,h,10),new THREE.MeshStandardMaterial({color:new THREE.Color(row.color||'#ffb347'),emissive:new THREE.Color(row.color||'#ff7b22'),emissiveIntensity:.7}));mesh.position.copy(pos.clone().setLength(2.04+h/2));mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),pos.clone().normalize());mesh.userData=row;markers.add(mesh)}document.getElementById('status').textContent=`${markers.children.length} locations plotted`}
const sample=[{label:'San Francisco',lat:37.77,lng:-122.42,value:8},{label:'London',lat:51.5,lng:-.12,value:5,color:'#67e8f9'},{label:'Tokyo',lat:35.68,lng:139.69,value:12,color:'#f472b6'},{label:'Cape Town',lat:-33.92,lng:18.42,value:4},{label:'Sydney',lat:-33.87,lng:151.21,value:7}];const ta=document.getElementById('data');function loadSample(){ta.value=JSON.stringify(sample,null,2);plot(sample)}document.getElementById('sample').onclick=loadSample;document.getElementById('plot').onclick=()=>{try{const x=JSON.parse(ta.value);plot(Array.isArray(x)?x:x.rows||x.features?.map(f=>({...f.properties,lng:f.geometry.coordinates[0],lat:f.geometry.coordinates[1]}))||[])}catch(e){document.getElementById('status').textContent=e.message}};let spin=true;document.getElementById('spin').onclick=e=>{spin=!spin;e.target.textContent=spin?'Pause spin':'Resume spin'};loadSample();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});let last=performance.now();renderer.setAnimationLoop(now=>{if(spin)earth.rotation.y+=(now-last)*.000035;last=now;controls.update();renderer.render(scene,camera)});</script></body></html>
