<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>muLLM — Character Studio</title><script type="importmap">{"imports":{"three":"/static/three/three.module.js","three/addons/":"/static/three/addons/"}}</script><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#10121a;color:#eee;font:13px system-ui}canvas{display:block}.ui{position:fixed;z-index:2;top:12px;left:12px;width:min(370px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:#111827ed;border:1px solid #385070;border-radius:10px;padding:14px}h1{margin:0;color:#82b8ff;font-size:20px}.row{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}button,.file{padding:7px;background:#192b43;color:#9cc9ff;border:1px solid #345b86;border-radius:5px;text-decoration:none;cursor:pointer}.file input{display:none}.control{display:grid;grid-template-columns:92px 1fr;align-items:center;margin:6px 0}.appearance{display:grid;grid-template-columns:1fr 1fr;gap:7px}.appearance label{font-size:11px;color:#a7b0c0}.appearance input{width:100%;margin-top:3px}.hint,#status{font-size:11px;color:#a7b0c0;line-height:1.45}.section{margin-top:10px;padding-top:8px;border-top:1px solid #29384d;color:#82b8ff;font-size:12px}</style></head><body><section class="ui"><h1>Character Studio</h1><div class="hint">Customize or import a GLB, pose named bones, save it to muLLM, then hand the same asset and bone manifest to Rig or Walks.</div><div class="section">Character</div><div class="appearance"><label>Name<input id="name" value="my-character"></label><label>Height<input id="height" type="range" min="0.75" max="1.35" step="0.01" value="1"></label><label>Build<input id="build" type="range" min="0.65" max="1.5" step="0.01" value="1"></label><label>Head<input id="head" type="range" min="0.7" max="1.4" step="0.01" value="1"></label><label>Skin<input id="skin" type="color" value="#e2a34e"></label><label>Outfit<input id="outfit" type="color" value="#426aa8"></label></div><div class="row"><button id="generate">Generate</button><label class="file">Import GLB<input id="import" type="file" accept=".glb,model/gltf-binary"></label><button id="download">Download GLB</button></div><div class="section">Pose</div><div id="controls"></div><div class="row"><button id="mirror">Mirror pose</button><button id="reset">T-pose</button></div><div class="section">Workflow</div><div class="row"><button id="save">Save asset</button><button id="rig">Save → Rig</button><button id="walks">Save → Walks</button></div><div id="status">Procedural character ready.</div></section><script type="module">import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{GLTFExporter}from'three/addons/exporters/GLTFExporter.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x10121a);const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(6,4,10);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,3,0);orbit.enableDamping=true;scene.add(new THREE.HemisphereLight(0xddeeff,0x332b28,2.5));let character,joints={},importedAnimations=[];const $=id=>document.getElementById(id),status=s=>$('status').textContent=s;
function customization(){return{name:$('name').value||'character',height:+$('height').value,build:+$('build').value,head:+$('head').value,skin:$('skin').value,outfit:$('outfit').value}}function material(color){return new THREE.MeshStandardMaterial({color,roughness:.7})}function makeBone(name,len,r,mat){const bone=new THREE.Bone();bone.name=name;const mesh=new THREE.Mesh(new THREE.CapsuleGeometry(r,len,6,12),mat);mesh.position.y=-len/2;mesh.name=name+'Mesh';bone.add(mesh);bone.add(new THREE.Mesh(new THREE.SphereGeometry(r*1.18,16,10),material(0x303945)));return bone}
function generate(){if(character)scene.remove(character);joints={};importedAnimations=[];const c=customization(),skin=material(c.skin),outfit=material(c.outfit),root=new THREE.Group();root.name=c.name;root.userData={mullmCharacter:true,boneConvention:'mullm-humanoid-v1'};const hips=new THREE.Bone();hips.name='Hips';hips.position.y=3.15;root.add(hips);joints.Hips=hips;const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.75*c.build,1.5,8,16),outfit);torso.position.y=.85;torso.name='TorsoMesh';hips.add(torso);const spine=new THREE.Bone();spine.name='Spine';spine.position.y=1.55;hips.add(spine);joints.Spine=spine;const neck=new THREE.Bone();neck.name='Neck';neck.position.y=.95;spine.add(neck);joints.Neck=neck;const head=new THREE.Mesh(new THREE.SphereGeometry(.65*c.head,24,16),skin);head.position.y=.75;head.name='HeadMesh';neck.add(head);for(const side of[-1,1]){const s=side<0?'Left':'Right',arm=makeBone(s+'Shoulder',1.45,.24*c.build,skin);arm.position.set(side*.9*c.build,.72,0);arm.rotation.z=side*Math.PI/2;const fore=makeBone(s+'Elbow',1.25,.21*c.build,skin);fore.position.y=-1.45;arm.add(fore);spine.add(arm);const leg=makeBone(s+'Hip',1.8,.3*c.build,outfit);leg.position.set(side*.42*c.build,0,0);const shin=makeBone(s+'Knee',1.65,.25*c.build,outfit);shin.position.y=-1.8;leg.add(shin);hips.add(leg);Object.assign(joints,{[s+'Shoulder']:arm,[s+'Elbow']:fore,[s+'Hip']:leg,[s+'Knee']:shin})}root.scale.y=c.height;character=root;scene.add(root);status(`${Object.keys(joints).length} named bones generated`)}
const defs=[['Shoulder',-150,150],['Elbow',-130,20],['Hip',-100,100],['Knee',-10,130]];for(const[d,min,max]of defs){const row=document.createElement('label');row.className='control';row.innerHTML=`${d}<input type="range" min="${min}" max="${max}" value="0">`;row.querySelector('input').oninput=e=>{for(const s of['Left','Right'])if(joints[s+d])joints[s+d].rotation.x=THREE.MathUtils.degToRad(+e.target.value)};$('controls').appendChild(row)}
function boneManifest(){const out=[];character?.traverse(o=>{if(o.isBone)out.push({name:o.name,parent:o.parent?.isBone?o.parent.name:null,position:o.position.toArray(),rotation:o.rotation.toArray().slice(0,3)})});return out}function exportGLB(){return new Promise((resolve,reject)=>new GLTFExporter().parse(character,resolve,reject,{binary:true,animations:importedAnimations,onlyVisible:true}))}async function save(){if(!character)throw Error('No character loaded');status('Exporting and saving…');const buf=await exportGLB(),bytes=new Uint8Array(buf);let binary='';for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));const c=customization(),res=await fetch('/api/characters/store',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:c.name,glb_base64:btoa(binary),bones:boneManifest(),customization:c})}),data=await res.json();if(!res.ok)throw Error(data.detail||'Save failed');localStorage.setItem('mullm.character.handoff',JSON.stringify({...data,bones:boneManifest(),customization:c,saved_at:Date.now()}));status(`Saved ${data.asset_name}.glb · ${data.bone_count} bones`);return data}
$('generate').onclick=generate;$('reset').onclick=()=>{generate();document.querySelectorAll('#controls input').forEach(x=>x.value=0)};$('mirror').onclick=()=>{for(const d of defs.map(x=>x[0]))if(joints['Left'+d]&&joints['Right'+d])joints['Right'+d].rotation.copy(joints['Left'+d].rotation)};$('download').onclick=async()=>{try{const b=await exportGLB(),u=URL.createObjectURL(new Blob([b],{type:'model/gltf-binary'})),a=document.createElement('a');a.href=u;a.download=(customization().name||'character')+'.glb';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);status('GLB downloaded')}catch(e){status(e.message)}};$('save').onclick=()=>save().catch(e=>status(e.message));async function handoff(page){try{const d=await save();location.href=`/${page}?asset=${encodeURIComponent(d.asset_name)}&url=${encodeURIComponent(d.url)}&source=characters`}catch(e){status(e.message)}}$('rig').onclick=()=>handoff('rigs');$('walks').onclick=()=>handoff('walks');
$('import').onchange=e=>{const file=e.target.files[0];if(!file)return;const u=URL.createObjectURL(file);new GLTFLoader().load(u,g=>{URL.revokeObjectURL(u);if(character)scene.remove(character);character=g.scene;character.name=file.name.replace(/\.glb$/i,'');$('name').value=character.name;importedAnimations=g.animations||[];joints={};character.traverse(o=>{if(o.isBone)joints[o.name]=o});scene.add(character);const box=new THREE.Box3().setFromObject(character),size=box.getSize(new THREE.Vector3()),scale=6/Math.max(size.y,1e-6);character.scale.multiplyScalar(scale);character.position.y-=new THREE.Box3().setFromObject(character).min.y;status(`Imported ${file.name} · ${Object.keys(joints).length} bones · ${importedAnimations.length} clips`)},undefined,err=>status(err.message))};for(const id of['height','build','head','skin','outfit'])$(id).oninput=()=>generate();generate();const floor=new THREE.Mesh(new THREE.CircleGeometry(5,64),new THREE.MeshStandardMaterial({color:0x202938,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.4;scene.add(floor);renderer.setAnimationLoop(()=>{orbit.update();renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
