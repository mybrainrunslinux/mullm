<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>muLLM — /sysctl</title>
  <meta name="description" content="muLLM kernel and Ollama tuning status dashboard — sysctl, THP, and Ollama environment variable health." />
  <meta name="theme-color" content="#0a0e1a" />
  <style>
    /* ── Reset ── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── Design tokens ── */
    :root {
      --bg:        #0a0e1a;
      --surface:   #111827;
      --surface2:  #1a2332;
      --border:    #1e2d3d;
      --gold:      #d4af37;
      --gold-dim:  #a88820;
      --gold-glow: 0 0 18px rgba(212, 175, 55, 0.35);
      --text:      #e2e8f0;
      --text2:     #94a3b8;
      --text3:     #64748b;
      --green:     #22c55e;
      --amber:     #f59e0b;
      --red:       #ef4444;
      --blue:      #38bdf8;
      --grid-line: rgba(20, 184, 166, 0.03);
      --mono:      "JetBrains Mono", "Fira Code", "SF Mono", ui-monospace, monospace;
      --sans:      "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: dark;
    }

    /* ── Circuit grid background ── */
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Header bar ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 14, 26, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      height: 64px;
    }
    .topbar::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dim) 100%);
    }

    .topbar-brand {
      display: flex;
      align-items: baseline;
      gap: 8px;
      text-decoration: none;
    }
    .topbar-logo {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: -0.02em;
    }
    .topbar-slash {
      color: var(--text3);
      font-family: var(--mono);
      font-size: 0.9rem;
    }
    .topbar-route {
      font-family: var(--mono);
      font-size: 0.9rem;
      color: var(--gold);
    }

    .topbar-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .topbar-subtitle {
      font-size: 0.75rem;
      color: var(--text2);
    }

    /* Progress ring */
    .ring-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .ring-svg {
      width: 48px;
      height: 48px;
      transform: rotate(-90deg);
    }
    .ring-track {
      fill: none;
      stroke: var(--border);
      stroke-width: 4;
    }
    .ring-fill {
      fill: none;
      stroke-width: 4;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.4s ease;
    }
    .ring-label {
      text-align: center;
    }
    .ring-pct {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      font-family: var(--mono);
      display: block;
    }
    .ring-caption {
      font-size: 0.62rem;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Refresh button */
    .btn-refresh {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text2);
      font-family: var(--sans);
      font-size: 0.82rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      flex-shrink: 0;
    }
    .btn-refresh:hover, .btn-refresh:focus-visible {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(212, 175, 55, 0.06);
      outline: none;
    }
    .btn-refresh:focus-visible {
      box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.4);
    }
    .btn-refresh svg {
      width: 14px;
      height: 14px;
      transition: transform 0.6s ease;
      flex-shrink: 0;
    }
    .btn-refresh.spinning svg {
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Page content ── */
    .page {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 24px 80px;
    }

    /* ── Loading / error state ── */
    .state-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 200px;
      color: var(--text2);
      font-size: 0.9rem;
    }
    .state-box.error { color: var(--red); }
    .spinner-dots {
      display: flex;
      gap: 6px;
    }
    .spinner-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      animation: dot-pulse 1.2s ease-in-out infinite;
    }
    .spinner-dots span:nth-child(2) { animation-delay: 0.2s; }
    .spinner-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-pulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40%           { opacity: 1;   transform: scale(1);   }
    }

    /* ── Section headers ── */
    .section {
      margin-top: 28px;
      opacity: 0;
      transform: translateY(12px);
      animation: fade-up 0.4s ease forwards;
    }
    .section:nth-child(1) { animation-delay: 0.05s; }
    .section:nth-child(2) { animation-delay: 0.12s; }
    .section:nth-child(3) { animation-delay: 0.19s; }
    .section:nth-child(4) { animation-delay: 0.26s; }
    .section:nth-child(5) { animation-delay: 0.33s; }
    @keyframes fade-up {
      to { opacity: 1; transform: translateY(0); }
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--gold);
    }
    .section-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border) 0%, transparent 100%);
    }
    .section-count {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--text3);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
    }

    /* ── Summary pills ── */
    .summary-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      border: 1px solid transparent;
    }
    .pill-green  { background: rgba(34,197,94,0.1);  color: var(--green); border-color: rgba(34,197,94,0.25); }
    .pill-amber  { background: rgba(245,158,11,0.1); color: var(--amber); border-color: rgba(245,158,11,0.25); }
    .pill-red    { background: rgba(239,68,68,0.1);  color: var(--red);   border-color: rgba(239,68,68,0.25); }
    .pill-ghost  { background: var(--surface);       color: var(--text2); border-color: var(--border); }

    /* ── Bench timing section ── */
    .bench-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }
    .bench-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      position: relative;
      overflow: hidden;
    }
    .bench-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
    }
    .bench-card.improved::before { background: var(--green); }
    .bench-card.regressed::before { background: var(--red); }
    .bench-card.neutral::before { background: var(--border); }

    .bench-metric-name {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text3);
      margin-bottom: 8px;
    }
    .bench-values {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }
    .bench-before {
      font-family: var(--mono);
      font-size: 0.9rem;
      color: var(--text2);
      text-decoration: line-through;
      text-decoration-color: var(--text3);
    }
    .bench-after {
      font-family: var(--mono);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
    }
    .bench-delta {
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      margin-left: auto;
    }
    .delta-green { background: rgba(34,197,94,0.15);  color: var(--green); }
    .delta-red   { background: rgba(239,68,68,0.15);  color: var(--red);   }
    .delta-grey  { background: var(--surface2);        color: var(--text3); }

    /* Bar chart */
    .bench-chart-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .bench-chart-title {
      font-size: 0.72rem;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }
    .bar-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bar-row {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 10px;
      align-items: center;
    }
    .bar-label {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--text2);
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bar-track {
      position: relative;
      height: 20px;
      border-radius: 3px;
      overflow: visible;
    }
    .bar-before, .bar-after {
      position: absolute;
      top: 0;
      left: 0;
      height: 50%;
      border-radius: 2px;
      transition: width 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .bar-before {
      background: rgba(239,68,68,0.35);
      top: 0;
    }
    .bar-after {
      background: rgba(34,197,94,0.5);
      top: 50%;
    }
    .bar-val-before, .bar-val-after {
      position: absolute;
      font-family: var(--mono);
      font-size: 0.62rem;
      white-space: nowrap;
    }
    .bar-val-before {
      top: 0px;
      left: calc(var(--w) + 4px);
      color: rgba(239,68,68,0.8);
    }
    .bar-val-after {
      top: 50%;
      left: calc(var(--w) + 4px);
      color: rgba(34,197,94,0.9);
    }

    .bench-timestamps {
      font-size: 0.72rem;
      color: var(--text3);
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .bench-timestamps span { font-family: var(--mono); }

    .callout {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--amber);
      border-radius: 6px;
      padding: 12px 16px;
      margin-top: 12px;
      font-size: 0.82rem;
      color: var(--text2);
    }
    .callout code {
      font-family: var(--mono);
      color: var(--amber);
      background: rgba(245,158,11,0.1);
      padding: 1px 5px;
      border-radius: 3px;
    }

    /* ── Table ── */
    .tbl-wrap {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.83rem;
    }
    thead th {
      background: var(--surface2);
      color: var(--text3);
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 9px 14px;
      text-align: left;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    thead th:first-child { padding-left: 16px; }
    thead th:last-child  { padding-right: 16px; }

    tbody tr {
      border-bottom: 1px solid var(--border);
      opacity: 0;
      animation: row-in 0.3s ease forwards;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.02); }

    td {
      padding: 10px 14px;
      vertical-align: middle;
    }
    td:first-child { padding-left: 16px; }
    td:last-child  { padding-right: 16px; }

    @keyframes row-in {
      from { opacity: 0; transform: translateX(-6px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .key-cell {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--text);
      white-space: nowrap;
    }
    .val-cell {
      font-family: var(--mono);
      font-size: 0.78rem;
      white-space: nowrap;
    }
    .val-match   { color: var(--green); }
    .val-mismatch { color: var(--red); }
    .val-unset   { color: var(--text3); font-style: italic; }

    .why-cell {
      color: var(--text2);
      font-size: 0.79rem;
      max-width: 340px;
      min-width: 160px;
    }

    .status-ok {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--green);
      font-size: 0.78rem;
      font-weight: 600;
    }
    .status-warn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--amber);
      font-size: 0.78rem;
      font-weight: 600;
    }
    .status-icon {
      font-size: 0.9rem;
      line-height: 1;
    }

    /* ── THP section ── */
    .thp-rows {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .thp-row {
      display: grid;
      grid-template-columns: 180px 1fr 1fr 1fr;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.83rem;
      opacity: 0;
      animation: fade-up 0.35s ease forwards;
    }
    .thp-row:last-child { border-bottom: none; }
    .thp-row:nth-child(1) { animation-delay: 0.05s; }
    .thp-row:nth-child(2) { animation-delay: 0.12s; }
    .thp-key {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--text);
    }
    .thp-label {
      font-size: 0.7rem;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ── Footer ── */
    .footer {
      margin-top: 36px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      animation: fade-up 0.4s ease 0.4s forwards;
    }
    .code-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 16px;
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--amber);
      overflow-x: auto;
      white-space: nowrap;
    }
    .footer-links {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 0.8rem;
    }
    .footer-links a {
      color: var(--gold);
      text-decoration: none;
      font-family: var(--mono);
    }
    .footer-links a:hover { text-decoration: underline; }
    .footer-links a:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* Auto-refresh indicator */
    .refresh-indicator {
      position: fixed;
      bottom: 16px;
      right: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 0.7rem;
      color: var(--text3);
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 5px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .refresh-indicator.visible { opacity: 1; }
    .refresh-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
    }
    .refresh-dot.pulse { animation: pulse 1s ease-in-out; }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(34,197,94,0.7); }
      70%  { box-shadow: 0 0 0 8px rgba(34,197,94,0); }
      100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .topbar { padding: 0 12px; height: 56px; gap: 10px; }
      .page { padding: 16px 12px 80px; }
      .ring-svg { width: 38px; height: 38px; }
      .ring-pct { font-size: 0.9rem; }
      .topbar-subtitle { display: none; }
      .bench-grid { grid-template-columns: 1fr 1fr; }
      .bar-row { grid-template-columns: 90px 1fr; }
      .thp-row { grid-template-columns: 1fr 1fr; row-gap: 4px; }
      .thp-row > * { grid-column: auto; }
      .thp-key { grid-column: 1 / -1; }
      .btn-refresh span { display: none; }
    }

    @media (max-width: 400px) {
      .bench-grid { grid-template-columns: 1fr; }
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="topbar" role="banner">
    <a href="/" class="topbar-brand" aria-label="muLLM home">
      <span class="topbar-logo">muLLM</span>
      <span class="topbar-slash"> · </span>
      <span class="topbar-route">/sysctl</span>
    </a>
    <div class="topbar-info">
      <span class="topbar-subtitle">Kernel + Ollama tuning dashboard</span>
    </div>
    <!-- Progress ring -->
    <div class="ring-wrap" role="img" aria-label="Tuning completion percentage">
      <svg class="ring-svg" viewBox="0 0 48 48" aria-hidden="true">
        <circle class="ring-track" cx="24" cy="24" r="20"/>
        <circle class="ring-fill" id="ring-fill" cx="24" cy="24" r="20"
                stroke-dasharray="125.66"
                stroke-dashoffset="125.66"/>
      </svg>
      <div class="ring-label">
        <span class="ring-pct" id="ring-pct">—</span>
        <span class="ring-caption">tuned</span>
      </div>
    </div>
    <!-- Refresh -->
    <button class="btn-refresh" id="btn-refresh" aria-label="Refresh data" title="Refresh data">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M23 4v6h-6M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
      </svg>
      <span>Refresh</span>
    </button>
  </header>

  <main class="page" role="main" id="main-content">
    <!-- Content injected by JS -->
    <div id="root">
      <div class="state-box" role="status" aria-live="polite">
        <div class="spinner-dots" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        Loading tuning status…
      </div>
    </div>
  </main>

  <!-- Auto-refresh indicator -->
  <div class="refresh-indicator" id="refresh-indicator" aria-live="polite" aria-atomic="true">
    <div class="refresh-dot" id="refresh-dot"></div>
    <span id="refresh-text">auto-refresh in 30s</span>
  </div>

  <script>
  'use strict';

  // ── Constants ──────────────────────────────────────────────────────────────
  const API_URL = '/api/sysctl';
  const REFRESH_INTERVAL = 30_000;

  const METRIC_LABELS = {
    health_latency_ms: 'Health',
    system_latency_ms: 'System',
    classify_ms:       'Classify',
    sse_ttft_ms:       'SSE TTFT',
    query_total_ms:    'Query Total',
  };

  // ── State ──────────────────────────────────────────────────────────────────
  let refreshTimer = null;
  let countdown = REFRESH_INTERVAL / 1000;

  // ── DOM refs ───────────────────────────────────────────────────────────────
  const root        = document.getElementById('root');
  const ringFill    = document.getElementById('ring-fill');
  const ringPct     = document.getElementById('ring-pct');
  const btnRefresh  = document.getElementById('btn-refresh');
  const indicator   = document.getElementById('refresh-indicator');
  const refreshDot  = document.getElementById('refresh-dot');
  const refreshText = document.getElementById('refresh-text');

  // ── Fetch + render ─────────────────────────────────────────────────────────
  async function loadData() {
    btnRefresh.classList.add('spinning');
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      render(data);
    } catch (err) {
      root.innerHTML = `
        <div class="state-box error" role="alert">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          Failed to load: ${escHtml(err.message)}
          <button class="btn-refresh" onclick="triggerRefresh()" style="margin-top:4px">
            Retry
          </button>
        </div>`;
    } finally {
      btnRefresh.classList.remove('spinning');
    }
  }

  function render(data) {
    updateRing(data.summary);
    root.innerHTML = '';

    const frag = document.createDocumentFragment();

    // Section: timing bench
    if (data.bench_timing && data.bench_timing.before) {
      frag.appendChild(buildBenchSection(data.bench_timing));
    }

    // Section: sysctl
    if (data.sysctl && data.sysctl.length) {
      frag.appendChild(buildTableSection({
        title: 'Kernel sysctl',
        id: 'sysctl',
        rows: sortRows(data.sysctl),
        type: 'sysctl',
      }));
    }

    // Section: ollama
    if (data.ollama && data.ollama.length) {
      frag.appendChild(buildTableSection({
        title: 'Ollama ENV',
        id: 'ollama',
        rows: sortRows(data.ollama),
        type: 'ollama',
      }));
    }

    // Section: THP
    if (data.thp) {
      frag.appendChild(buildThpSection(data.thp));
    }

    // Footer
    frag.appendChild(buildFooter());

    root.appendChild(frag);
    staggerRows();
  }

  // ── Ring ────────────────────────────────────────────────────────────────────
  function updateRing(summary) {
    if (!summary) return;
    const pct = summary.pct_tuned || 0;
    const circ = 2 * Math.PI * 20; // r=20
    const offset = circ * (1 - pct / 100);
    const color = pct >= 100 ? 'var(--green)' : pct >= 50 ? 'var(--amber)' : 'var(--red)';
    ringFill.style.strokeDashoffset = offset;
    ringFill.style.stroke = color;
    ringPct.textContent = `${Math.round(pct)}%`;
    ringPct.style.color = color;
  }

  // ── Sort: untuned first ────────────────────────────────────────────────────
  function sortRows(rows) {
    return [...rows].sort((a, b) => {
      if (a.tuned === b.tuned) return 0;
      return a.tuned ? 1 : -1;
    });
  }

  // ── Bench timing section ───────────────────────────────────────────────────
  function buildBenchSection(bench) {
    const before = bench.before;
    const after  = bench.after;
    const metrics = Object.keys(METRIC_LABELS);

    const section = mkEl('div', 'section');

    const hdr = mkEl('div', 'section-header');
    hdr.innerHTML = `
      <span class="section-title">Timing Benchmark</span>
      <div class="section-line" aria-hidden="true"></div>
      <span class="section-count" title="${before.n || ''} samples">${after ? 'before → after' : 'baseline only'}</span>`;
    section.appendChild(hdr);

    // Summary pills
    if (after) {
      const pills = mkEl('div', 'summary-pills');
      const wins = metrics.filter(m => {
        const b = before[m]?.p50, a = after[m]?.p50;
        return b && a && deltaPct(b, a) < -5;
      }).length;
      const losses = metrics.filter(m => {
        const b = before[m]?.p50, a = after[m]?.p50;
        return b && a && deltaPct(b, a) > 5;
      }).length;
      pills.innerHTML = `
        <span class="pill pill-green">${wins} metric${wins !== 1 ? 's' : ''} faster</span>
        ${losses ? `<span class="pill pill-red">${losses} metric${losses !== 1 ? 's' : ''} slower</span>` : ''}
        <span class="pill pill-ghost">p50 values shown</span>`;
      section.appendChild(pills);
    }

    // Metric cards
    const grid = mkEl('div', 'bench-grid');
    for (const key of metrics) {
      const bVal = before[key]?.p50;
      const aVal = after?.[key]?.p50;
      const dp = bVal && aVal ? deltaPct(bVal, aVal) : null;
      const cardClass = dp === null ? 'neutral' : dp < -5 ? 'improved' : dp > 5 ? 'regressed' : 'neutral';
      const card = mkEl('div', `bench-card ${cardClass}`);

      let deltaHtml = '';
      if (dp !== null) {
        const cls = dp < -5 ? 'delta-green' : dp > 5 ? 'delta-red' : 'delta-grey';
        const sym = dp < -5 ? '▼' : dp > 5 ? '▲' : '≈';
        deltaHtml = `<span class="bench-delta ${cls}" title="${dp > 0 ? '+' : ''}${dp.toFixed(1)}% change">${sym} ${Math.abs(dp).toFixed(0)}%</span>`;
      }

      card.innerHTML = `
        <div class="bench-metric-name">${METRIC_LABELS[key]}</div>
        <div class="bench-values">
          ${bVal && after ? `<span class="bench-before" title="before: p50">${fmtMs(bVal)}</span>` : ''}
          <span class="bench-after" title="${after ? 'after: p50' : 'baseline p50'}">${fmtMs(aVal ?? bVal)}</span>
          ${deltaHtml}
        </div>`;
      grid.appendChild(card);
    }
    section.appendChild(grid);

    // Bar chart (before+after only)
    if (after) {
      const maxVal = Math.max(...metrics.map(m => Math.max(before[m]?.p50 || 0, after[m]?.p50 || 0)));
      const chartWrap = mkEl('div', 'bench-chart-wrap');
      chartWrap.innerHTML = `<div class="bench-chart-title">Before vs After — p50 latency</div>`;
      const barGroup = mkEl('div', 'bar-group');

      for (const key of metrics) {
        const bVal = before[key]?.p50;
        const aVal = after[key]?.p50;
        if (!bVal) continue;
        const bPct = maxVal > 0 ? (bVal / maxVal * 100).toFixed(1) : 0;
        const aPct = maxVal > 0 && aVal ? (aVal / maxVal * 100).toFixed(1) : 0;

        const row = mkEl('div', 'bar-row');
        row.innerHTML = `
          <div class="bar-label" title="${key}">${METRIC_LABELS[key]}</div>
          <div class="bar-track" style="height:28px;">
            <div class="bar-before" style="width:${bPct}%;height:50%;" title="Before: ${fmtMs(bVal)}"></div>
            <div class="bar-after"  style="width:${aPct}%;height:50%;" title="After: ${fmtMs(aVal)}"></div>
            <span class="bar-val-before" style="top:0px;left:calc(${bPct}% + 4px);position:absolute;font-family:var(--mono);font-size:0.62rem;color:rgba(239,68,68,0.8)">${fmtMs(bVal)}</span>
            <span class="bar-val-after"  style="top:14px;left:calc(${aPct}% + 4px);position:absolute;font-family:var(--mono);font-size:0.62rem;color:rgba(34,197,94,0.9)">${fmtMs(aVal)}</span>
          </div>`;
        barGroup.appendChild(row);
      }
      chartWrap.appendChild(barGroup);
      section.appendChild(chartWrap);
    } else {
      const callout = mkEl('div', 'callout');
      callout.innerHTML = `Run <code>python ~/mullm/scripts/bench-timing.py after</code> after applying tuning to see improvements.`;
      section.appendChild(callout);
    }

    // Timestamps
    const ts = mkEl('div', 'bench-timestamps');
    ts.setAttribute('aria-label', 'Benchmark timestamps');
    ts.innerHTML = `
      <span>Before: <span>${fmtTimestamp(before.timestamp)}</span></span>
      ${after ? `<span>After: <span>${fmtTimestamp(after.timestamp)}</span></span>` : ''}`;
    section.appendChild(ts);

    return section;
  }

  // ── Table section (sysctl / ollama) ───────────────────────────────────────
  function buildTableSection({ title, id, rows, type }) {
    const tuned   = rows.filter(r => r.tuned).length;
    const untuned = rows.filter(r => !r.tuned).length;

    const section = mkEl('div', 'section');
    section.id = id;

    const hdr = mkEl('div', 'section-header');
    hdr.innerHTML = `
      <span class="section-title">${escHtml(title)}</span>
      <div class="section-line" aria-hidden="true"></div>
      ${untuned ? `<span class="section-count" style="color:var(--amber)">${untuned} need attention</span>` : ''}
      <span class="section-count" style="color:var(--green)">${tuned} tuned</span>`;
    section.appendChild(hdr);

    const wrap = mkEl('div', 'tbl-wrap');
    const table = document.createElement('table');
    table.setAttribute('role', 'table');
    table.setAttribute('aria-label', title);

    table.innerHTML = `
      <thead>
        <tr role="row">
          <th scope="col">Setting</th>
          <th scope="col">Current</th>
          <th scope="col">Desired</th>
          <th scope="col">Status</th>
          <th scope="col">Why</th>
        </tr>
      </thead>`;

    const tbody = document.createElement('tbody');
    rows.forEach((row, i) => {
      const tr = document.createElement('tr');
      tr.setAttribute('role', 'row');
      tr.style.animationDelay = `${i * 0.03}s`;

      const isMatch = row.current === row.desired;
      const isUnset = row.current === '<not set>' || row.current === '' || row.current === null;

      let currentHtml;
      if (isMatch) {
        currentHtml = `<span class="val-match" title="Matches desired">${escHtml(row.current)}</span>`;
      } else if (isUnset) {
        currentHtml = `<span class="val-unset" title="Not set">&lt;not set&gt;</span>`;
      } else {
        currentHtml = `<span class="val-mismatch" title="Does not match desired: ${escHtml(row.desired)}">${escHtml(row.current)}</span>`;
      }

      const statusHtml = row.tuned
        ? `<span class="status-ok" role="img" aria-label="Tuned"><span class="status-icon" aria-hidden="true">✓</span> Tuned</span>`
        : `<span class="status-warn" role="img" aria-label="Not tuned — needs attention">
             <span class="status-icon" aria-hidden="true">⚠</span> Not tuned
           </span>`;

      tr.innerHTML = `
        <td class="key-cell">${escHtml(row.key)}</td>
        <td class="val-cell">${currentHtml}</td>
        <td class="val-cell"><span class="val-match">${escHtml(row.desired)}</span></td>
        <td>${statusHtml}</td>
        <td class="why-cell">${escHtml(row.why || '')}</td>`;
      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    wrap.appendChild(table);
    section.appendChild(wrap);
    return section;
  }

  // ── THP section ────────────────────────────────────────────────────────────
  function buildThpSection(thp) {
    const entries = [
      { key: 'thp/enabled', label: 'THP enabled',      ...thp.enabled },
      { key: 'thp/defrag',  label: 'THP defrag mode',  ...thp.defrag  },
    ].filter(e => e.current !== undefined);

    const section = mkEl('div', 'section');
    section.id = 'thp';

    const hdr = mkEl('div', 'section-header');
    hdr.innerHTML = `
      <span class="section-title">Transparent Hugepages</span>
      <div class="section-line" aria-hidden="true"></div>
      <span class="section-count">${entries.length} setting${entries.length !== 1 ? 's' : ''}</span>`;
    section.appendChild(hdr);

    const rows = mkEl('div', 'thp-rows');
    entries.forEach((e, i) => {
      const row = mkEl('div', 'thp-row');
      row.style.animationDelay = `${i * 0.06}s`;
      const isMatch = e.current === e.desired;

      row.innerHTML = `
        <div class="thp-key">${escHtml(e.label)}</div>
        <div>
          <div class="thp-label">Current</div>
          <span class="val-cell ${isMatch ? 'val-match' : 'val-mismatch'}" style="font-family:var(--mono);font-size:0.78rem">${escHtml(e.current)}</span>
        </div>
        <div>
          <div class="thp-label">Desired</div>
          <span class="val-cell val-match" style="font-family:var(--mono);font-size:0.78rem">${escHtml(e.desired)}</span>
        </div>
        <div>
          ${e.tuned
            ? `<span class="status-ok" role="img" aria-label="Tuned"><span class="status-icon" aria-hidden="true">✓</span> Tuned</span>`
            : `<span class="status-warn" role="img" aria-label="Needs tuning"><span class="status-icon" aria-hidden="true">⚠</span> Not tuned</span>`}
        </div>`;
      rows.appendChild(row);
    });

    section.appendChild(rows);
    return section;
  }

  // ── Footer ─────────────────────────────────────────────────────────────────
  function buildFooter() {
    const footer = mkEl('div', 'footer');
    footer.setAttribute('role', 'contentinfo');
    footer.innerHTML = `
      <div>
        <div style="font-size:0.72rem;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.08em">Apply all tuning changes</div>
        <div class="code-block" role="code" aria-label="Command to apply sysctl tuning">sudo bash ~/mullm/scripts/apply-sysctl-tuning.sh</div>
      </div>
      <div class="footer-links">
        <a href="/bench" aria-label="Router benchmark page">/bench</a>
        <a href="/dashboard" aria-label="Savings dashboard">/dashboard</a>
        <a href="/" aria-label="muLLM home">home</a>
      </div>`;
    return footer;
  }

  // ── Stagger row animations ─────────────────────────────────────────────────
  function staggerRows() {
    root.querySelectorAll('tbody tr').forEach((tr, i) => {
      // Preserve the per-row delay already set, stack section index on top
      const existing = parseFloat(tr.style.animationDelay) || 0;
      tr.style.animationDelay = `${existing}s`;
    });
  }

  // ── Auto-refresh countdown ─────────────────────────────────────────────────
  function startCountdown() {
    clearInterval(refreshTimer);
    countdown = REFRESH_INTERVAL / 1000;
    indicator.classList.add('visible');

    refreshTimer = setInterval(() => {
      countdown--;
      refreshText.textContent = countdown > 0
        ? `auto-refresh in ${countdown}s`
        : 'refreshing…';
      if (countdown <= 0) {
        clearInterval(refreshTimer);
        triggerRefresh();
      }
    }, 1000);
  }

  function triggerRefresh() {
    refreshDot.classList.remove('pulse');
    void refreshDot.offsetWidth; // reflow to restart animation
    refreshDot.classList.add('pulse');
    loadData().then(() => startCountdown());
  }

  btnRefresh.addEventListener('click', triggerRefresh);

  // ── Helpers ────────────────────────────────────────────────────────────────
  function mkEl(tag, cls) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    return el;
  }

  function escHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function fmtMs(v) {
    if (v === null || v === undefined) return '—';
    const n = Number(v);
    if (n >= 1000) return `${(n / 1000).toFixed(2)}s`;
    return `${n.toFixed(0)}ms`;
  }

  function deltaPct(before, after) {
    if (!before) return 0;
    return ((after - before) / before) * 100;
  }

  function fmtTimestamp(ts) {
    if (!ts) return '—';
    try {
      const d = new Date(ts);
      return d.toLocaleString(undefined, {
        month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit', hour12: false
      });
    } catch {
      return ts;
    }
  }

  // ── Boot ───────────────────────────────────────────────────────────────────
  loadData().then(() => startCountdown());
  </script>
</body>
</html>
