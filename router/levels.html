<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>muLLM — Level Generator</title><script type="importmap">{"imports":{"three":"/static/three/three.module.js","three/addons/":"/static/three/addons/"}}</script><style>*{box-sizing:border-box}body{margin:0;background:#07100e;color:#e5f5ef;font:14px system-ui;overflow:hidden}.ui{position:fixed;z-index:2;top:16px;left:16px;width:300px;padding:15px;background:#07130fe8;border:1px solid #24533f;border-radius:10px}h1{margin:0;color:#5ee6a8;font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}label{font-size:11px;color:#9bb9ad}input{width:100%;margin-top:3px;background:#0d211a;color:white;border:1px solid #285c47;border-radius:5px;padding:7px}button{background:#123d2d;color:#7df0b6;border:1px solid #2c7b59;padding:8px;border-radius:6px;cursor:pointer}canvas{display:block}.hint{font-size:11px;color:#8ba99e;margin:8px 0}</style></head><body><section class="ui"><h1>r185 Level Generator</h1><div class="hint">One seeded scene combining terrain, roads, city blocks, buildings, trees, lighting, and GLB export.</div><div class="grid"><label>Seed<input id="seed" type="number" value="185"></label><label>Terrain size<input id="size" type="number" value="300"></label><label>City blocks<input id="blocks" type="number" min="1" max="8" value="4"></label><label>Buildings/block<input id="density" type="number" min="1" max="12" value="6"></label></div><button id="generate">Generate level</button> <button id="export">Export GLB</button><div id="status" class="hint"></div></section><script type="module">import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFExporter}from'three/addons/exporters/GLTFExporter.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ec7d2);scene.fog=new THREE.Fog(0x9ec7d2,180,520);const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,1200);camera.position.set(180,145,210);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xdff6ff,0x354227,2));const sun=new THREE.DirectionalLight(0xfff1d1,3);sun.position.set(120,220,80);sun.castShadow=true;scene.add(sun);let level;
function rng(seed){let s=seed>>>0||1;return()=>{s=(s+0x6d2b79f5)|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function height(x,z,r){return(Math.sin(x*.035)+Math.cos(z*.028)+Math.sin((x+z)*.017))*5+(r()-.5)*1.5}
function generate(){if(level)scene.remove(level);level=new THREE.Group();level.name='muLLM_Level';const seed=+document.getElementById('seed').value,r=rng(seed),size=Math.max(100,+document.getElementById('size').value),seg=96,g=new THREE.PlaneGeometry(size,size,seg,seg);g.rotateX(-Math.PI/2);const a=g.attributes.position;for(let i=0;i<a.count;i++)a.setY(i,height(a.getX(i),a.getZ(i),r));g.computeVertexNormals();const terrain=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x557a46,roughness:.95,vertexColors:false}));terrain.receiveShadow=true;terrain.name='Terrain';level.add(terrain);const blocks=Math.max(1,Math.min(8,+document.getElementById('blocks').value)),density=Math.max(1,Math.min(12,+document.getElementById('density').value)),span=size*.55,road=span/blocks*.22;const roadMat=new THREE.MeshStandardMaterial({color:0x31363a,roughness:.9}),buildMats=[0xc7b79c,0x8fa5ad,0xb7836a,0x9b9a8b].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.75}));for(let i=0;i<=blocks;i++){for(const vertical of [true,false]){const m=new THREE.Mesh(new THREE.BoxGeometry(vertical?road:span+road,.35,vertical?span+road:road),roadMat);const q=-span/2+i*span/blocks;m.position.set(vertical?q:0,1,vertical?0:q);m.name='Road';level.add(m)}}for(let bx=0;bx<blocks;bx++)for(let bz=0;bz<blocks;bz++)for(let n=0;n<density;n++){const cell=span/blocks-road,bw=5+r()*9,bd=5+r()*9,bh=8+r()*42,x=-span/2+(bx+.5)*span/blocks+(r()-.5)*(cell-bw),z=-span/2+(bz+.5)*span/blocks+(r()-.5)*(cell-bd),m=new THREE.Mesh(new THREE.BoxGeometry(bw,bh,bd),buildMats[Math.floor(r()*buildMats.length)]);m.position.set(x,bh/2+1,z);m.castShadow=m.receiveShadow=true;m.name='Building';level.add(m)}for(let i=0;i<90;i++){const x=(r()-.5)*size*.92,z=(r()-.5)*size*.92;if(Math.abs(x)<span*.62&&Math.abs(z)<span*.62)continue;const tree=new THREE.Group(),trunk=new THREE.Mesh(new THREE.CylinderGeometry(.45,.65,3,7),new THREE.MeshStandardMaterial({color:0x60452f})),crown=new THREE.Mesh(new THREE.ConeGeometry(2+r()*2,6+r()*5,8),new THREE.MeshStandardMaterial({color:0x28583a}));trunk.position.y=2;crown.position.y=6;tree.add(trunk,crown);tree.position.set(x,height(x,z,r),z);tree.name='Tree';level.add(tree)}scene.add(level);document.getElementById('status').textContent=`Generated ${level.children.length} objects with seed ${seed}`}
document.getElementById('generate').onclick=generate;document.getElementById('export').onclick=()=>{if(!level)return;document.getElementById('status').textContent='Exporting…';new GLTFExporter().parse(level,b=>{const u=URL.createObjectURL(new Blob([b],{type:'model/gltf-binary'})),a=document.createElement('a');a.href=u;a.download=`mullm-level-${document.getElementById('seed').value}.glb`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);document.getElementById('status').textContent='GLB exported' },e=>document.getElementById('status').textContent=e.message,{binary:true,onlyVisible:true})};generate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});</script></body></html>
