<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIEGE WEAPON PREVIEW</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #0a0a12;
            color: #c8a044;
            overflow: hidden;
            height: 100vh;
        }
        
        .container {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 2px;
            padding: 10px;
        }
        
        @media (min-width: 1400px) {
            .container {
                grid-template-columns: repeat(4, 1fr);
                grid-template-rows: 1fr;
            }
        }
        
        .viewer-wrapper {
            display: flex;
            flex-direction: column;
            background-color: #0a0a12;
            border: 1px solid #333;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .viewer-canvas {
            flex: 1;
            width: 100%;
            display: block;
        }
        
        .viewer-label {
            padding: 12px;
            text-align: center;
            color: #c8a044;
            background-color: #1a1a22;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="viewer-wrapper">
            <canvas class="viewer-canvas" data-model="/assets/3d/meshy-ballista.glb"></canvas>
            <div class="viewer-label">Ballista</div>
        </div>
        <div class="viewer-wrapper">
            <canvas class="viewer-canvas" data-model="/assets/3d/meshy-catapult.glb"></canvas>
            <div class="viewer-label">Catapult</div>
        </div>
        <div class="viewer-wrapper">
            <canvas class="viewer-canvas" data-model="/assets/3d/meshy-trebuchet.glb"></canvas>
            <div class="viewer-label">Trebuchet</div>
        </div>
        <div class="viewer-wrapper">
            <canvas class="viewer-canvas" data-model="/assets/3d/meshy-onager.glb"></canvas>
            <div class="viewer-label">Onager</div>
        </div>
    </div>

    <script src="/static/three/three.min.js"></script>
    <script src="/static/three/examples/js/controls/OrbitControls.js"></script>
    <script src="/static/three/examples/js/loaders/GLTFLoader.js"></script>
    <script>
        const canvases = document.querySelectorAll('.viewer-canvas');
        
        canvases.forEach((canvas) => {
            const modelPath = canvas.dataset.model;
            
            // Scene setup
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a12);
            
            // Camera
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
            camera.position.set(0, 0, 5);
            
            // Renderer
            const renderer = new THREE.WebGLRenderer({ antialias: true, canvas: canvas });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 10, 10);
            scene.add(directionalLight);
            
            // Controls
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 4;
            
            // Load model
            const loader = new THREE.GLTFLoader();
            loader.load(modelPath, (gltf) => {
                const model = gltf.scene;
                scene.add(model);
                
                // Auto-fit camera
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const fov = camera.fov * (Math.PI / 180);
                let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
                
                cameraZ *= 1.5;
                camera.position.z = cameraZ;
                camera.lookAt(box.getCenter(new THREE.Vector3()));
            });
            
            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();
            
            // Handle resize
            window.addEventListener('resize', () => {
                const newWidth = canvas.clientWidth;
                const newHeight = canvas.clientHeight;
                camera.aspect = newWidth / newHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(newWidth, newHeight);
            });
        });
    </script>
</body>
</html>
