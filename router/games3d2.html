<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Pirate Ship 3D Game Navigator - Sail across procedural oceans to discover islands and games">
    <meta name="theme-color" content="#0a0a1a">
    <title>Pirate Ship Navigator 3D</title>
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #121225;
            --bg-tertiary: #1a1a35;
            --accent: #00bfa5;
            --accent-hover: #00d4c4;
            --accent-dark: #00968f;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0c0;
            --text-muted: #707080;
            --text-warning: #ffb347;
            --text-danger: #ff6b6b;
            --text-success: #4ade80;
            --border-color: #2a2a4a;
            --shadow-color: rgba(0, 0, 0, 0.5);
            --shadow-accent: rgba(0, 191, 165, 0.3);
            --transition-fast: 150ms;
            --transition-normal: 250ms;
            --transition-slow: 400ms;
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 20px;
            --font-primary: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --font-mono: 'Consolas', 'Monaco', monospace;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-primary);
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Focus styles for WCAG 2.2 AA */
        :focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }

        /* Skip link for keyboard navigation */
        .skip-link {
            position: absolute;
            top: -100px;
            left: 0;
            padding: 12px 24px;
            background: var(--accent);
            color: var(--bg-primary);
            font-weight: 600;
            z-index: 10000;
            transition: top var(--transition-fast);
        }

        .skip-link:focus {
            top: 0;
        }

        /* Main canvas container */
        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Overlay - Dark theme */
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
        }

        /* Top bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
            background: linear-gradient(180deg, var(--bg-secondary) 0%, transparent 100%);
            padding: 8px 16px;
            border-radius: var(--radius-md);
            backdrop-filter: blur(8px);
        }

        .top-bar h1 {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            text-shadow: 0 0 10px var(--shadow-accent);
            letter-spacing: 0.5px;
        }

        .top-bar .stats {
            display: flex;
            gap: 16px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stat-item .label {
            color: var(--text-muted);
            font-size: 12px;
        }

        .stat-item .value {
            font-family: var(--font-mono);
            font-weight: 600;
        }

        /* Bottom controls */
        .bottom-controls {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: auto;
            gap: 12px;
        }

        /* Control panel */
        .control-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px;
            min-width: 280px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px var(--shadow-color);
        }

        .control-panel h2 {
            font-size: 16px;
            color: var(--accent);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .control-panel .section {
            margin-bottom: 16px;
        }

        .control-panel .section:last-child {
            margin-bottom: 0;
        }

        .control-panel .section-title {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-primary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            text-decoration: none;
            white-space: nowrap;
        }

        .btn:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 15px var(--shadow-accent);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        .btn-danger {
            background: var(--text-danger);
            color: var(--bg-primary);
        }

        .btn-danger:hover {
            background: #ff8080;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Input fields */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .input-group input,
        .input-group select {
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: var(--font-primary);
            font-size: 14px;
            transition: border-color var(--transition-fast);
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: var(--accent);
        }

        .input-group input::placeholder {
            color: var(--text-muted);
        }

        /* Sliders */
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-group label {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .slider-group input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: var(--bg-tertiary);
            border-radius: 3px;
            outline: none;
        }

        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            transition: transform var(--transition-fast);
        }

        .slider-group input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        /* Toggle switch */
        .toggle-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
        }

        .toggle-group label {
            font-size: 14px;
            color: var(--text-primary);
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            cursor: pointer;
            transition: background var(--transition-fast);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 16px;
            height: 16px;
            background: var(--text-secondary);
            border-radius: 50%;
            transition: transform var(--transition-fast);
        }

        .toggle-switch.active {
            background: var(--accent);
        }

        .toggle-switch.active::after {
            transform: translateX(20px);
            background: var(--bg-primary);
        }

        /* Help button */
        .help-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition-fast);
            z-index: 101;
        }

        .help-btn:hover {
            background: var(--border-color);
            border-color: var(--accent);
        }

        .help-btn:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }

        .help-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--text-primary);
            transition: fill var(--transition-fast);
        }

        .help-btn:hover svg {
            fill: var(--accent);
        }

        /* Modal/Popup */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-normal);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: transform var(--transition-normal);
            box-shadow: 0 20px 60px var(--shadow-color);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal h2 {
            font-size: 20px;
            color: var(--accent);
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal .modal-content {
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.6;
        }

        .modal .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        /* HUD elements */
        .hud-element {
            position: absolute;
            pointer-events: none;
            text-shadow: 0 2px 4px var(--shadow-color);
        }

        .hud-speed {
            bottom: 16px;
            left: 16px;
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--text-secondary);
        }

        .hud-speed .value {
            color: var(--accent);
            font-weight: 700;
        }

        .hud-depth {
            bottom: 16px;
            right: 16px;
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--text-secondary);
        }

        .hud-depth .value {
            color: var(--text-warning);
            font-weight: 700;
        }

        /* Loading screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
            transition: opacity var(--transition-slow);
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-screen .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--bg-tertiary);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }

        .loading-screen .spinner::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg-tertiary);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite reverse;
