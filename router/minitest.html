<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniTest — muLLM</title>
<style>
:root {
  --bg:           #0a0a0f;
  --bg2:          #11111a;
  --bg3:          #1a1a26;
  --bg4:          #22223a;
  --gold:         #d4af37;
  --gold-dim:     #8a7020;
  --gold-bright:  #f0cc50;
  --text:         #e8e8f0;
  --text-dim:     #8888aa;
  --text-muted:   #555570;
  --border:       #2a2a3a;
  --border-bright:#3a3a50;
  --green:        #3dba6e;
  --red:          #d94f4f;
  --blue:         #4a9eff;
  --purple:       #9a6fff;
  --orange:       #e07a30;
  --radius:       8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ── Header ─────────────────────────────────────── */
header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 20px;
  flex-shrink: 0;
}
.logo { display: flex; align-items: baseline; gap: 8px; }
.logo h1 { font-size: 18px; font-weight: 700; color: var(--gold); letter-spacing: 0.5px; }
.logo .sub { font-size: 12px; color: var(--text-dim); }

.global-controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-left: auto;
  align-items: center;
}

/* ── Buttons ─────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border-bright);
  background: var(--bg3);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, opacity 0.15s;
  white-space: nowrap;
}
.btn:hover { background: var(--bg4); border-color: var(--gold-dim); }
.btn.primary { background: var(--gold-dim); border-color: var(--gold); color: #fff; }
.btn.primary:hover { background: var(--gold); color: #000; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }
.btn.sm { padding: 4px 10px; font-size: 12px; }
.btn.danger { border-color: var(--red); color: var(--red); }
.btn.danger:hover { background: var(--red); color: #fff; }

/* ── Main layout ─────────────────────────────────── */
main {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* ── Prompt card ─────────────────────────────────── */
.prompt-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg3);
}
.card-title { font-size: 15px; font-weight: 600; color: var(--gold-bright); }
.badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.8px;
  padding: 2px 8px;
  border-radius: 4px;
  text-transform: uppercase;
}
.badge-game  { background: #1a3a20; color: var(--green); border: 1px solid #2a6030; }
.badge-text  { background: #1a2a3a; color: var(--blue);  border: 1px solid #2a4060; }

.prompt-preview {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.5;
}
.prompt-preview .snippet { display: inline; }
.prompt-preview .full    { display: none; }
.prompt-preview.expanded .snippet { display: none; }
.prompt-preview.expanded .full    { display: inline; }
.show-more-btn {
  background: none;
  border: none;
  color: var(--gold-dim);
  cursor: pointer;
  font-size: 12px;
  padding: 0 4px;
}
.show-more-btn:hover { color: var(--gold); }

/* ── Model tabs ──────────────────────────────────── */
.tab-bar {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.tab {
  padding: 9px 20px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-dim);
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  user-select: none;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--gold); border-bottom-color: var(--gold); }
.tab .status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--text-muted);
}
.tab .status-dot.done    { background: var(--green); }
.tab .status-dot.running { background: var(--orange); animation: pulse 1s infinite; }
.tab .status-dot.error   { background: var(--red); }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.3; }
}

/* ── Tab panels ──────────────────────────────────── */
.tab-panels { }
.tab-panel { display: none; padding: 16px; }
.tab-panel.active { display: block; }

.run-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

/* ── Spinner ─────────────────────────────────────── */
.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--border-bright);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: none;
}
.spinner.visible { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Meta bar ────────────────────────────────────── */
.meta-bar {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
  font-size: 12px;
  color: var(--text-dim);
  min-height: 22px;
}
.meta-item { display: flex; gap: 4px; align-items: center; }
.meta-label { color: var(--text-muted); }
.meta-value { color: var(--text); font-weight: 500; }
.tier-badge {
  padding: 1px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
}
.tier-local  { background: #1a3a20; color: var(--green); }
.tier-cloud  { background: #1a1a40; color: var(--purple); }
.tier-unknown { background: var(--bg4); color: var(--text-dim); }

/* ── Response area ───────────────────────────────── */
.response-area {
  margin-top: 10px;
}
.response-text {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  max-height: 500px;
  overflow-y: auto;
  line-height: 1.7;
  color: var(--text);
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 13px;
}
/* Markdown styling inside response-text */
.response-text h1, .response-text h2, .response-text h3 {
  color: var(--gold-bright);
  margin: 14px 0 6px;
  line-height: 1.3;
}
.response-text h1 { font-size: 17px; }
.response-text h2 { font-size: 15px; }
.response-text h3 { font-size: 14px; }
.response-text strong { color: var(--gold-bright); font-weight: 600; }
.response-text em { color: var(--text-dim); font-style: italic; }
.response-text code {
  background: var(--bg4);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 5px;
  font-family: 'JetBrains Mono', 'Fira Code', monospace;
  font-size: 12px;
  color: var(--blue);
}
.response-text pre {
  background: var(--bg4);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  overflow-x: auto;
  margin: 10px 0;
}
.response-text pre code { background: none; border: none; padding: 0; }
.response-text ul, .response-text ol { padding-left: 20px; margin: 8px 0; }
.response-text li { margin: 3px 0; }
.response-text p { margin: 6px 0; }
.response-text hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
.response-text blockquote {
  border-left: 3px solid var(--gold-dim);
  padding-left: 12px;
  color: var(--text-dim);
  margin: 8px 0;
}

.game-frame-container {
  margin-top: 10px;
}
.game-frame {
  width: 100%;
  height: 480px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #000;
}
.code-toggle-row {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  align-items: center;
}
.code-block {
  display: none;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  margin-top: 8px;
  max-height: 360px;
  overflow-y: auto;
  font-family: 'JetBrains Mono', 'Fira Code', monospace;
  font-size: 12px;
  color: var(--text-dim);
  white-space: pre-wrap;
  word-break: break-word;
}
.code-block.visible { display: block; }

/* ── Compare overlay ─────────────────────────────── */
#compare-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
#compare-overlay.visible { display: flex; }
.compare-modal {
  background: var(--bg2);
  border: 1px solid var(--border-bright);
  border-radius: var(--radius);
  width: 96vw;
  max-width: 1400px;
  height: 88vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.compare-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg3);
}
.compare-modal-header h2 { font-size: 15px; color: var(--gold); }
.compare-panes {
  display: flex;
  flex: 1;
  overflow: hidden;
  gap: 1px;
  background: var(--border);
}
.compare-pane {
  flex: 1;
  background: var(--bg2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.compare-pane-header {
  padding: 8px 14px;
  font-weight: 600;
  font-size: 13px;
  color: var(--gold-bright);
  border-bottom: 1px solid var(--border);
  background: var(--bg3);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.compare-pane-body {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
}
.compare-select-row {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  background: var(--bg);
}
.compare-select-row select {
  background: var(--bg3);
  border: 1px solid var(--border-bright);
  color: var(--text);
  padding: 5px 10px;
  border-radius: 4px;
  font-size: 13px;
}
.compare-select-row label { color: var(--text-dim); font-size: 12px; }

/* ── Scrollbar ───────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--gold-dim); }

/* ── Toast ───────────────────────────────────────── */
#toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--bg3);
  border: 1px solid var(--border-bright);
  color: var(--text);
  padding: 10px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  display: none;
  z-index: 9999;
  max-width: 320px;
}
#toast.visible { display: block; }
#toast.error { border-color: var(--red); color: var(--red); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <h1>muLLM</h1>
    <span class="sub">MiniTest — 3 prompts × 3 models</span>
  </div>
  <div class="global-controls">
    <button class="btn" onclick="runAll('30b')">&#9654; Run All (Local 30B)</button>
    <button class="btn" onclick="runAll('omnicoder')">&#9654; Run All (OmniCoder)</button>
    <button class="btn primary" onclick="runAll('mullm')">&#9654; Run All (muLLM Router)</button>
    <button class="btn" onclick="openCompare()">&#9741; Compare</button>
  </div>
</header>

<main id="main"></main>

<!-- Compare overlay -->
<div id="compare-overlay">
  <div class="compare-modal">
    <div class="compare-modal-header">
      <h2>Side-by-Side Compare</h2>
      <button class="btn sm danger" onclick="closeCompare()">&#10005; Close</button>
    </div>
    <div class="compare-select-row">
      <label>Prompt:</label>
      <select id="cmp-prompt-sel" onchange="renderCompare()">
        <option value="0">Rope Physics Game</option>
        <option value="1">The Jury Expert</option>
        <option value="2">Permaculture Guild Design</option>
      </select>
      <label>Left:</label>
      <select id="cmp-left-sel" onchange="renderCompare()">
        <option value="30b">Local 30B</option>
        <option value="omnicoder">OmniCoder 9B</option>
        <option value="mullm">muLLM Router</option>
      </select>
      <label>Right:</label>
      <select id="cmp-right-sel" onchange="renderCompare()">
        <option value="omnicoder">OmniCoder 9B</option>
        <option value="mullm">muLLM Router</option>
        <option value="30b">Local 30B</option>
      </select>
    </div>
    <div class="compare-panes">
      <div class="compare-pane" id="cmp-left">
        <div class="compare-pane-header">
          <span id="cmp-left-label">—</span>
          <span id="cmp-left-meta" style="font-size:11px;color:var(--text-dim);font-weight:400"></span>
        </div>
        <div class="compare-pane-body" id="cmp-left-body"></div>
      </div>
      <div class="compare-pane" id="cmp-right">
        <div class="compare-pane-header">
          <span id="cmp-right-label">—</span>
          <span id="cmp-right-meta" style="font-size:11px;color:var(--text-dim);font-weight:400"></span>
        </div>
        <div class="compare-pane-body" id="cmp-right-body"></div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';

// ── State ─────────────────────────────────────────
const MODELS = {
  '30b':       { label: 'Local 30B',    dot: '#3dba6e' },
  'omnicoder': { label: 'OmniCoder 9B', dot: '#4a9eff' },
  'mullm':     { label: 'muLLM Router', dot: '#d4af37' },
};
const MODEL_KEYS = ['30b', 'omnicoder', 'mullm'];

let prompts   = [];          // loaded from API
let results   = {};          // {prompt_id: {model_key: result}}
let activeTab = {};          // {card_idx: model_key}
let running   = {};          // {`${prompt_idx}:${model_key}`: true}

// ── Boot ──────────────────────────────────────────
async function boot() {
  try {
    const res = await fetch('/api/minitest/prompts');
    const data = await res.json();
    prompts = data.prompts;
    await fetchResults();
    renderCards();
  } catch (e) {
    showToast('Failed to load prompts: ' + e.message, true);
  }
}

async function fetchResults() {
  try {
    const res = await fetch('/api/minitest/results');
    const data = await res.json();
    results = data.results || {};
  } catch (_) { /* ignore */ }
}

// ── Render cards ──────────────────────────────────
function renderCards() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  prompts.forEach((p, idx) => {
    if (!activeTab[idx]) activeTab[idx] = '30b';
    main.appendChild(buildCard(p, idx));
  });
}

function buildCard(p, idx) {
  const card = document.createElement('div');
  card.className = 'prompt-card';
  card.id = `card-${idx}`;

  const snippet = p.prompt.slice(0, 100);
  const rest    = p.prompt.slice(100);
  const badgeClass = p.type === 'game' ? 'badge-game' : 'badge-text';
  const badgeText  = p.type === 'game' ? 'GAME' : 'TEXT';

  card.innerHTML = `
    <div class="card-header">
      <span class="card-title">${esc(p.title)}</span>
      <span class="badge ${badgeClass}">${badgeText}</span>
    </div>
    <div class="prompt-preview" id="pp-${idx}">
      <span class="snippet">${esc(snippet)}&hellip;</span>
      <span class="full">${esc(p.prompt)}</span>
      <button class="show-more-btn" onclick="togglePrompt(${idx})">show more</button>
    </div>
    <div class="tab-bar" id="tabbar-${idx}">
      ${MODEL_KEYS.map(mk => `
        <div class="tab ${activeTab[idx]===mk?'active':''}" id="tab-${idx}-${mk}" onclick="switchTab(${idx},'${mk}')">
          <span class="status-dot ${dotClass(idx,mk)}" id="dot-${idx}-${mk}"></span>
          ${esc(MODELS[mk].label)}
        </div>
      `).join('')}
    </div>
    <div class="tab-panels" id="panels-${idx}">
      ${MODEL_KEYS.map(mk => buildPanel(p, idx, mk)).join('')}
    </div>
  `;
  return card;
}

function buildPanel(p, idx, mk) {
  const active = activeTab[idx] === mk ? 'active' : '';
  const res    = results[p.id]?.[mk];
  const isGame = p.type === 'game';

  let responseHtml = '';
  if (res) {
    responseHtml = isGame
      ? buildGameResponse(res, idx, mk)
      : buildTextResponse(res);
  }

  const metaHtml = res ? buildMeta(res, mk) : '';
  const runLabel = res ? '&#8635; Re-run' : '&#9654; Run';

  return `
    <div class="tab-panel ${active}" id="panel-${idx}-${mk}">
      <div class="run-row">
        <button class="btn primary sm" id="runbtn-${idx}-${mk}"
                onclick="runOne(${idx},'${mk}')">${runLabel}</button>
        <div class="spinner" id="spin-${idx}-${mk}"></div>
        <div class="meta-bar" id="meta-${idx}-${mk}">${metaHtml}</div>
      </div>
      <div class="response-area" id="resp-${idx}-${mk}">${responseHtml}</div>
    </div>
  `;
}

function buildMeta(res, mk) {
  const lat = res.latency_ms ? (res.latency_ms / 1000).toFixed(1) + 's' : '—';
  const cost = res.cost > 0 ? '$' + res.cost.toFixed(4) : '$0.00';
  const tier = res.tier_used || 'unknown';
  const tierClass = tier === 'local' ? 'tier-local' : tier === 'unknown' ? 'tier-unknown' : 'tier-cloud';
  const modelUsed = res.model_used || '—';
  const tierDisplay = mk === 'mullm'
    ? `<span class="meta-item"><span class="meta-label">tier:</span> <span class="tier-badge ${tierClass}">${esc(tier)}</span></span>`
    : '';

  return `
    <span class="meta-item"><span class="meta-label">latency:</span> <span class="meta-value">${lat}</span></span>
    ${tierDisplay}
    <span class="meta-item"><span class="meta-label">model:</span> <span class="meta-value" title="${esc(modelUsed)}">${esc(shortModel(modelUsed))}</span></span>
    <span class="meta-item"><span class="meta-label">cost:</span> <span class="meta-value">${cost}</span></span>
  `;
}

function buildTextResponse(res) {
  const html = renderMarkdown(res.response || '');
  return `<div class="response-text">${html}</div>`;
}

function buildGameResponse(res, idx, mk) {
  const code = res.response || '';
  const safeId = `gf-${idx}-${mk}`;
  const codeId = `gc-${idx}-${mk}`;
  return `
    <div class="game-frame-container">
      <iframe class="game-frame" id="${safeId}" sandbox="allow-scripts" srcdoc="${htmlAttrEsc(code)}"></iframe>
      <div class="code-toggle-row">
        <button class="btn sm" onclick="toggleCode('${codeId}', this)">View Code</button>
        <span style="font-size:11px;color:var(--text-muted)">${code.length.toLocaleString()} chars</span>
      </div>
      <pre class="code-block" id="${codeId}">${esc(code)}</pre>
    </div>
  `;
}

// ── Interaction ───────────────────────────────────
function switchTab(idx, mk) {
  activeTab[idx] = mk;
  document.querySelectorAll(`#tabbar-${idx} .tab`).forEach(t => t.classList.remove('active'));
  document.getElementById(`tab-${idx}-${mk}`).classList.add('active');
  document.querySelectorAll(`#panels-${idx} .tab-panel`).forEach(p => p.classList.remove('active'));
  document.getElementById(`panel-${idx}-${mk}`).classList.add('active');
}

function togglePrompt(idx) {
  const el = document.getElementById(`pp-${idx}`);
  const btn = el.querySelector('.show-more-btn');
  el.classList.toggle('expanded');
  btn.textContent = el.classList.contains('expanded') ? 'show less' : 'show more';
}

function toggleCode(codeId, btn) {
  const el = document.getElementById(codeId);
  el.classList.toggle('visible');
  btn.textContent = el.classList.contains('visible') ? 'Hide Code' : 'View Code';
}

// ── Run logic ─────────────────────────────────────
async function runOne(promptIdx, modelKey) {
  const runKey = `${promptIdx}:${modelKey}`;
  if (running[runKey]) return;
  running[runKey] = true;

  const btn  = document.getElementById(`runbtn-${promptIdx}-${modelKey}`);
  const spin = document.getElementById(`spin-${promptIdx}-${modelKey}`);
  const dot  = document.getElementById(`dot-${promptIdx}-${modelKey}`);
  const meta = document.getElementById(`meta-${promptIdx}-${modelKey}`);
  const resp = document.getElementById(`resp-${promptIdx}-${modelKey}`);

  btn.disabled = true;
  spin.classList.add('visible');
  dot.className = 'status-dot running';
  meta.innerHTML = '<span style="color:var(--text-muted)">Running…</span>';
  resp.innerHTML  = '';

  try {
    const res = await fetch('/api/minitest/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: modelKey, prompt_idx: promptIdx }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);

    const p = prompts[promptIdx];
    if (!results[p.id]) results[p.id] = {};
    results[p.id][modelKey] = data;

    meta.innerHTML = buildMeta(data, modelKey);
    resp.innerHTML = p.type === 'game'
      ? buildGameResponse(data, promptIdx, modelKey)
      : buildTextResponse(data);

    dot.className = 'status-dot done';
    btn.innerHTML = '&#8635; Re-run';
    showToast(`Done: ${p.title} / ${MODELS[modelKey].label}`);
  } catch (e) {
    dot.className = 'status-dot error';
    meta.innerHTML = `<span style="color:var(--red)">${esc(e.message)}</span>`;
    showToast(e.message, true);
  } finally {
    btn.disabled = false;
    spin.classList.remove('visible');
    delete running[runKey];
  }
}

async function runAll(modelKey) {
  for (let i = 0; i < prompts.length; i++) {
    switchTab(i, modelKey);
    await runOne(i, modelKey);
  }
}

// ── Compare modal ─────────────────────────────────
function openCompare() {
  document.getElementById('compare-overlay').classList.add('visible');
  renderCompare();
}
function closeCompare() {
  document.getElementById('compare-overlay').classList.remove('visible');
}

function renderCompare() {
  const promptIdx = parseInt(document.getElementById('cmp-prompt-sel').value);
  const leftKey   = document.getElementById('cmp-left-sel').value;
  const rightKey  = document.getElementById('cmp-right-sel').value;
  const p = prompts[promptIdx];

  renderComparePane('left',  p, promptIdx, leftKey);
  renderComparePane('right', p, promptIdx, rightKey);
}

function renderComparePane(side, p, promptIdx, mk) {
  const label    = document.getElementById(`cmp-${side}-label`);
  const metaEl   = document.getElementById(`cmp-${side}-meta`);
  const body     = document.getElementById(`cmp-${side}-body`);
  const res      = results[p?.id]?.[mk];

  label.textContent  = MODELS[mk]?.label || mk;
  metaEl.textContent = res ? `${(res.latency_ms/1000).toFixed(1)}s · ${res.tier_used||'?'} · $${(res.cost||0).toFixed(4)}` : 'No result yet';

  if (!res) {
    body.innerHTML = `<div style="color:var(--text-muted);padding:20px">No result — run this model first.</div>`;
    return;
  }

  if (p.type === 'game') {
    body.innerHTML = buildGameResponse(res, promptIdx, mk);
  } else {
    body.innerHTML = buildTextResponse(res);
  }
}

// ── Dot class helper ──────────────────────────────
function dotClass(idx, mk) {
  const p = prompts[idx];
  if (!p) return '';
  if (results[p.id]?.[mk]) return 'done';
  return '';
}

// ── Markdown renderer (lightweight) ──────────────
function renderMarkdown(text) {
  // Escape HTML first, then apply markdown
  let s = esc(text);

  // Code blocks (must come before inline code)
  s = s.replace(/```[\w]*\n?([\s\S]*?)```/g, (_, code) =>
    `<pre><code>${code}</code></pre>`
  );
  // Inline code
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');

  // Headers
  s = s.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  s = s.replace(/^## (.+)$/gm,  '<h2>$1</h2>');
  s = s.replace(/^# (.+)$/gm,   '<h1>$1</h1>');

  // Bold / italic
  s = s.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  s = s.replace(/\*\*(.+?)\*\*/g,     '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g,         '<em>$1</em>');

  // HR
  s = s.replace(/^---+$/gm, '<hr>');

  // Blockquote
  s = s.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

  // Bullet lists
  s = s.replace(/((?:^[\-\*] .+\n?)+)/gm, (block) => {
    const items = block.trim().split('\n').map(l => `<li>${l.replace(/^[\-\*] /, '')}</li>`).join('');
    return `<ul>${items}</ul>`;
  });

  // Numbered lists
  s = s.replace(/((?:^\d+\. .+\n?)+)/gm, (block) => {
    const items = block.trim().split('\n').map(l => `<li>${l.replace(/^\d+\. /, '')}</li>`).join('');
    return `<ol>${items}</ol>`;
  });

  // Paragraphs — double newlines
  s = s.replace(/\n{2,}/g, '</p><p>');
  s = '<p>' + s + '</p>';

  // Single newlines inside paragraphs → <br>
  s = s.replace(/(?<![>])(\n)(?!<)/g, '<br>');

  return s;
}

// ── Escape helpers ────────────────────────────────
function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function htmlAttrEsc(s) {
  // For srcdoc attribute — encode quotes and ampersands
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;');
}

function shortModel(m) {
  if (!m) return '—';
  if (m.length <= 28) return m;
  return m.slice(0, 14) + '…' + m.slice(-10);
}

// ── Toast ─────────────────────────────────────────
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = 'visible' + (isError ? ' error' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = ''; }, 4000);
}

// ── Kick off ──────────────────────────────────────
document.addEventListener('DOMContentLoaded', boot);

// Close compare on background click
document.getElementById('compare-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeCompare();
});
</script>
