<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Power the AI — muLLM</title>
<style>
  :root{
    --bg:#07091a;
    --bg2:#0d1130;
    --panel:rgba(14,18,48,0.85);
    --panel-border:#2a3170;
    --gold:#f5c542;
    --navy:#0a0f2e;
    --green:#3ddc84;
    --amber:#ffb020;
    --red:#ff4d6d;
    --cyan:#5cf1ff;
    --purple:#a96bff;
    --text:#e6e9ff;
    --dim:#8a91c7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;height:100%;-webkit-tap-highlight-color:transparent;user-select:none}
  #game{position:fixed;inset:0;display:flex;flex-direction:column}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #topbar{position:absolute;top:0;left:0;right:0;padding:10px 14px;
    display:flex;align-items:center;gap:10px;z-index:5;pointer-events:none;
    background:linear-gradient(180deg,rgba(7,9,26,0.95),rgba(7,9,26,0));}
  #topbar > *{pointer-events:auto}
  .meter{background:var(--panel);border:1px solid var(--panel-border);
    border-radius:10px;padding:6px 10px;min-width:120px;
    box-shadow:0 4px 16px rgba(0,0,0,0.4);backdrop-filter:blur(8px)}
  .meter .label{font-size:10px;letter-spacing:1.2px;color:var(--dim);text-transform:uppercase}
  .meter .val{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
  .bar{height:6px;background:#11163a;border-radius:4px;overflow:hidden;margin-top:4px}
  .bar > span{display:block;height:100%;transition:width .2s,background .2s}
  #powerMeter{flex:1;max-width:340px}
  #powerMeter .val{font-size:22px;color:var(--gold);text-shadow:0 0 12px rgba(245,197,66,0.4)}
  #co2Meter .val{color:var(--red)}
  #moneyMeter .val{color:var(--green)}
  #dayMeter .val{color:var(--cyan)}
  #scoreMeter .val{color:var(--purple)}

  #buildMenu{position:absolute;left:10px;top:84px;width:220px;z-index:5;
    background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;
    padding:10px;backdrop-filter:blur(10px);box-shadow:0 8px 32px rgba(0,0,0,0.5);
    max-height:calc(100vh - 180px);overflow-y:auto}
  #buildMenu h3{margin:0 0 8px;font-size:11px;letter-spacing:1.4px;color:var(--dim);text-transform:uppercase}
  .build-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;
    background:#11163a;border:1px solid #2a3170;border-radius:8px;cursor:pointer;
    color:var(--text);margin-bottom:6px;font-family:inherit;font-size:12px;
    transition:all .15s;text-align:left}
  .build-btn:hover:not(:disabled){background:#1a2050;border-color:var(--gold);transform:translateX(2px)}
  .build-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .build-btn:disabled{opacity:.4;cursor:not-allowed}
  .build-btn.selected{background:#2a3170;border-color:var(--gold);box-shadow:0 0 0 2px rgba(245,197,66,0.3)}
  .build-btn .icon{width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:var(--navy);border-radius:6px;font-size:16px}
  .build-btn .info{flex:1;min-width:0}
  .build-btn .name{font-weight:600;font-size:12px}
  .build-btn .cost{font-size:10px;color:var(--dim)}
  .build-btn .tags{display:flex;gap:3px;margin-top:2px;flex-wrap:wrap}
  .tag{font-size:8px;padding:1px 4px;border-radius:3px;background:#0a0f2e;color:var(--dim);letter-spacing:.5px}
  .tag.dirty{color:var(--red)} .tag.clean{color:var(--green)} .tag.rel{color:var(--cyan)}

  #eventLog{position:absolute;left:10px;bottom:10px;width:340px;max-width:calc(100vw - 20px);
    background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;
    padding:8px 10px;font-size:11px;font-family:"SF Mono",Menlo,monospace;
    max-height:140px;overflow-y:auto;z-index:4;backdrop-filter:blur(8px)}
  #eventLog .entry{padding:2px 0;color:var(--dim);border-left:2px solid transparent;padding-left:6px;margin-left:-6px}
  #eventLog .entry.good{color:var(--green);border-color:var(--green)}
  #eventLog .entry.bad{color:var(--red);border-color:var(--red)}
  #eventLog .entry.warn{color:var(--amber);border-color:var(--amber)}
  #eventLog .entry.info{color:var(--cyan)}

  #mixBar{position:absolute;top:10px;right:14px;width:260px;max-width:calc(100vw - 20px);z-index:5;
    background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;padding:8px 10px;backdrop-filter:blur(8px)}
  #mixBar .label{font-size:10px;color:var(--dim);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:4px}
  #mixStack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#11163a}
  #mixStack > span{display:block;height:100%}
  #mixLegend{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:10px}
  #mixLegend span{display:flex;align-items:center;gap:3px;color:var(--dim)}
  #mixLegend span i{width:8px;height:8px;border-radius:2px;display:inline-block}

  #controls{position:absolute;right:14px;bottom:14px;display:flex;gap:8px;z-index:5}
  #controls button{background:var(--panel);border:1px solid var(--panel-border);color:var(--text);
    padding:10px 14px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:12px;
    font-weight:600;backdrop-filter:blur(8px);transition:all .15s;min-width:52px;min-height:44px}
  #controls button:hover{border-color:var(--gold);background:#1a2050}
  #controls button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  #modal{position:fixed;inset:0;background:rgba(5,7,20,.92);z-index:20;display:none;
    align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
  #modal.show{display:flex}
  #modal .card{background:linear-gradient(180deg,#0d1130,#07091a);border:1px solid var(--gold);
    border-radius:16px;padding:28px;max-width:560px;width:100%;
    box-shadow:0 20px 60px rgba(245,197,66,0.2),0 0 0 1px rgba(245,197,66,0.3)}
  #modal h1{margin:0 0 8px;color:var(--gold);font-size:28px;letter-spacing:1px}
  #modal h2{margin:0 0 14px;color:var(--cyan);font-size:14px;letter-spacing:1.6px;text-transform:uppercase}
  #modal p{color:var(--text);line-height:1.55;font-size:13px}
  #modal .btn{margin-top:16px;padding:12px 24px;background:var(--gold);color:var(--navy);border:none;
    border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;font-family:inherit}
  #modal .btn:hover{filter:brightness(1.1)}
  #modal .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0;font-size:12px}
  #modal .stats div{background:#11163a;padding:8px 10px;border-radius:8px;border:1px solid #2a3170}
  #modal .stats b{color:var(--gold)}

  #tooltip{position:fixed;background:var(--panel);border:1px solid var(--gold);border-radius:8px;
    padding:8px 10px;font-size:11px;pointer-events:none;z-index:10;max-width:240px;
    display:none;box-shadow:0 8px 24px rgba(0,0,0,0.6);backdrop-filter:blur(8px)}
  #tooltip b{color:var(--gold)}
  #tooltip .row{display:flex;justify-content:space-between;gap:8px;margin-top:2px;color:var(--dim)}
  #tooltip .row span:last-child{color:var(--text)}

  #helpBtn{position:absolute;right:14px;top:80px;z-index:5;width:36px;height:36px;
    border-radius:50%;background:var(--panel);border:1px solid var(--panel-border);
    color:var(--gold);font-size:18px;cursor:pointer;backdrop-filter:blur(8px)}

  @media (max-width:700px){
    #buildMenu{width:170px;left:6px;top:76px;padding:8px;max-height:calc(100vh - 200px)}
    #mixBar{width:180px;right:6px;top:70px}
    #eventLog{width:calc(100vw - 12px);left:6px;bottom:70px;max-height:90px}
    #controls{right:6px;bottom:6px}
    #topbar{padding:6px 8px;gap:6px;flex-wrap:wrap}
    .meter{min-width:78px;padding:4px 6px}
    .meter .val{font-size:14px}
    #powerMeter .val{font-size:16px}
    #helpBtn{right:6px;top:180px}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important;transition-duration:0.01ms !important}
  }
</style>
</head>
<body>
<div id="game" role="application" aria-label="Power the AI game">
  <canvas id="canvas" aria-label="Datacenter power grid simulation"></canvas>

  <div id="topbar">
    <div class="meter" id="powerMeter">
      <div class="label">AI Power</div>
      <div class="val" id="powerVal">100%</div>
      <div class="bar"><span id="powerBar" style="width:100%;background:var(--gold)"></span></div>
    </div>
    <div class="meter" id="moneyMeter">
      <div class="label">Money</div>
      <div class="val" id="moneyVal">$500</div>
    </div>
    <div class="meter" id="co2Meter">
      <div class="label">CO2</div>
      <div class="val" id="co2Val">0</div>
      <div class="bar"><span id="co2Bar" style="width:0%;background:var(--red)"></span></div>
    </div>
    <div class="meter" id="dayMeter">
      <div class="label">Day / Time</div>
      <div class="val" id="dayVal">1 · 06:00</div>
    </div>
    <div class="meter" id="scoreMeter">
      <div class="label">Queries</div>
      <div class="val" id="scoreVal">0</div>
    </div>
  </div>

  <aside id="buildMenu" aria-label="Build menu">
    <h3>Build Power Source</h3>
    <div id="buildBtns"></div>
  </aside>

  <div id="mixBar" aria-label="Energy mix">
    <div class="label">Energy Mix</div>
    <div id="mixStack"></div>
    <div id="mixLegend"></div>
  </div>

  <button id="helpBtn" aria-label="Help" title="How to play">?</button>

  <div id="eventLog" role="log" aria-live="polite" aria-label="Event log"></div>

  <div id="controls">
    <button id="pauseBtn" aria-label="Pause">Pause</button>
    <button id="speedBtn" aria-label="Speed">1x</button>
  </div>

  <div id="tooltip"></div>

  <div id="modal" role="dialog" aria-modal="true">
    <div class="card">
      <h2 id="modalTag">Welcome</h2>
      <h1 id="modalTitle">Power the AI</h1>
      <p id="modalBody"></p>
      <div id="modalStats"></div>
      <button class="btn" id="modalBtn">Start</button>
    </div>
  </div>
</div>

<script>
"use strict";

// =================================================================
// POWER THE AI - Strategy/puzzle game
// =================================================================

const SOURCES = {
  coal:    { name:"Coal Plant",      icon:"\u26cf", buildCost:150, mw:40, runCost:0.8, co2:6.0, rel:1.00, needsSun:false, needsWind:false, color:"#6b4a3a", dirty:true },
  gas:     { name:"Natural Gas",     icon:"\u{1f525}", buildCost:200, mw:50, runCost:1.2, co2:3.2, rel:0.95, needsSun:false, needsWind:false, color:"#c47a2b", dirty:true },
  solar:   { name:"Solar Array",     icon:"\u2600", buildCost:260, mw:35, runCost:0.0, co2:0.0, rel:0.60, needsSun:true,  needsWind:false, color:"#f5c542", dirty:false },
  wind:    { name:"Wind Turbines",   icon:"\u{1f4a8}", buildCost:240, mw:30, runCost:0.0, co2:0.0, rel:0.40, needsSun:false, needsWind:true,  color:"#5cf1ff", dirty:false },
  nuclear: { name:"Nuclear Reactor", icon:"\u269b", buildCost:900, mw:120, runCost:0.6, co2:0.0, rel:0.99, needsSun:false, needsWind:false, color:"#a96bff", dirty:false },
  salt:    { name:"Molten Salt",     icon:"\u{1f9c2}", buildCost:520, mw:60, runCost:0.3, co2:0.0, rel:0.85, needsSun:false, needsWind:false, color:"#ff9f3f", dirty:false },
  battery: { name:"Battery Storage", icon:"\u{1f50b}", buildCost:300, mw:0,  runCost:0.0, co2:0.0, rel:1.00, needsSun:false, needsWind:false, color:"#3ddc84", dirty:false, battery:true, cap:80 },
};

const STARTING_MONEY = 500;
const DEMAND_BASE = 60;      // MW AI needs
const DAY_LENGTH_MS = 20000; // 20s real = 1 game day
const GAME_DAYS = 30;

const game = {
  money: STARTING_MONEY,
  power: 100,           // 0-100
  co2: 0,               // total
  day: 1,
  time: 6,              // hours 0-24
  totalTimeMs: 0,
  paused: false,
  speed: 1,
  plants: [],           // {id,type,x,y,online,age,produced}
  queries: 0,
  avgPowerAcc: 0, avgPowerN: 0,
  weatherSolar: 1.0,    // multiplier
  weatherWind: 1.0,
  weatherEnd: 0,
  weatherLabel: "",
  offlineTimer: 0,      // ms underpowered
  selectedBuild: null,
  placing: false,
  placeXY: null,
  regWarnIssued: false,
  gameOver: false,
  won: false,
  particles: [],
  lastTick: performance.now(),
  demand: DEMAND_BASE,
};

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d",{alpha:false});
let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = canvas.clientWidth = window.innerWidth;
  H = canvas.clientHeight = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize",resize); resize();

// ----- Event log -----
const logEl = document.getElementById("eventLog");
function logMsg(text, cls="info"){
  const d = document.createElement("div");
  d.className = "entry "+cls;
  const hh = String(Math.floor(game.time)).padStart(2,"0");
  const mm = String(Math.floor((game.time%1)*60)).padStart(2,"0");
  d.textContent = `D${game.day} ${hh}:${mm}  ${text}`;
  logEl.insertBefore(d, logEl.firstChild);
  while(logEl.children.length>40) logEl.removeChild(logEl.lastChild);
}

// ----- Build menu -----
const buildBtnsEl = document.getElementById("buildBtns");
function renderBuildMenu(){
  buildBtnsEl.innerHTML = "";
  for(const [key,s] of Object.entries(SOURCES)){
    const btn = document.createElement("button");
    btn.className = "build-btn";
    btn.dataset.key = key;
    btn.setAttribute("aria-label", `Build ${s.name}, cost ${s.buildCost} dollars`);
    const canAfford = game.money >= s.buildCost;
    btn.disabled = !canAfford;
    if(game.selectedBuild===key) btn.classList.add("selected");
    const tags = [];
    if(s.battery) tags.push('<span class="tag clean">STORAGE</span>');
    else {
      if(s.dirty) tags.push('<span class="tag dirty">CO2</span>'); else tags.push('<span class="tag clean">CLEAN</span>');
      tags.push(`<span class="tag rel">${Math.round(s.rel*100)}%</span>`);
    }
    btn.innerHTML = `
      <div class="icon" style="color:${s.color}">${s.icon}</div>
      <div class="info">
        <div class="name">${s.name}</div>
        <div class="cost">$${s.buildCost} · ${s.battery?s.cap+' MWh':s.mw+' MW'}</div>
        <div class="tags">${tags.join("")}</div>
      </div>`;
    btn.addEventListener("click",()=>selectBuild(key));
    btn.addEventListener("pointerenter",e=>showTip(e,key));
    btn.addEventListener("pointerleave",hideTip);
    buildBtnsEl.appendChild(btn);
  }
}
function selectBuild(key){
  if(game.money < SOURCES[key].buildCost) return;
  game.selectedBuild = (game.selectedBuild===key) ? null : key;
  game.placing = !!game.selectedBuild;
  renderBuildMenu();
}

// ----- Tooltip -----
const tipEl = document.getElementById("tooltip");
function showTip(e,key){
  const s = SOURCES[key];
  tipEl.innerHTML = `<b>${s.name}</b>
    <div class="row"><span>Build cost</span><span>$${s.buildCost}</span></div>
    ${s.battery? `<div class="row"><span>Capacity</span><span>${s.cap} MWh</span></div>
                  <div class="row"><span>Role</span><span>Absorbs surplus</span></div>`
    : `<div class="row"><span>Output</span><span>${s.mw} MW</span></div>
       <div class="row"><span>Run cost</span><span>$${s.runCost}/hr</span></div>
       <div class="row"><span>CO2</span><span>${s.co2}/hr</span></div>
       <div class="row"><span>Reliability</span><span>${Math.round(s.rel*100)}%</span></div>`}`;
  tipEl.style.display="block";
  const r = tipEl.getBoundingClientRect();
  const x = Math.min(e.clientX+12, window.innerWidth-r.width-10);
  const y = Math.min(e.clientY+12, window.innerHeight-r.height-10);
  tipEl.style.left = x+"px"; tipEl.style.top = y+"px";
}
function hideTip(){ tipEl.style.display="none"; }

// ----- Placement -----
// Plants live in a "field" area to the left; datacenter on the right
function getLayout(){
  const datacenterW = Math.min(300, W*0.35);
  const fieldW = W - datacenterW - 40;
  return {
    fieldX: 250, fieldY: 140, fieldW: Math.max(200, fieldW-260), fieldH: H-260,
    dcX: W - datacenterW - 20, dcY: 140, dcW: datacenterW, dcH: H-260
  };
}
function inField(x,y){
  const L = getLayout();
  return x>L.fieldX && x<L.fieldX+L.fieldW && y>L.fieldY && y<L.fieldY+L.fieldH;
}

canvas.addEventListener("pointerdown",(e)=>{
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX-rect.left, y = e.clientY-rect.top;
  if(game.placing && game.selectedBuild && inField(x,y)){
    const s = SOURCES[game.selectedBuild];
    if(game.money >= s.buildCost){
      game.money -= s.buildCost;
      game.plants.push({
        id: Math.random().toString(36).slice(2),
        type: game.selectedBuild, x, y, online:true, age:0, produced:0,
        charge: s.battery ? 0 : 0,
        relRoll: 1,
      });
      logMsg(`${s.name} online (+${s.mw||s.cap+" MWh"})`,"good");
      spawnParticles(x,y,s.color,24);
      game.selectedBuild = null; game.placing = false;
      renderBuildMenu();
    }
  }
});
canvas.addEventListener("pointermove",(e)=>{
  const rect = canvas.getBoundingClientRect();
  game.placeXY = {x:e.clientX-rect.left, y:e.clientY-rect.top};
});
canvas.addEventListener("pointerleave",()=>{ game.placeXY = null; });

// ----- Controls -----
document.getElementById("pauseBtn").addEventListener("click",()=>{
  game.paused = !game.paused;
  document.getElementById("pauseBtn").textContent = game.paused?"Play":"Pause";
});
document.getElementById("speedBtn").addEventListener("click",()=>{
  game.speed = game.speed===1?2:(game.speed===2?4:1);
  document.getElementById("speedBtn").textContent = game.speed+"x";
});

window.addEventListener("keydown",(e)=>{
  if(e.key===" "){ e.preventDefault(); document.getElementById("pauseBtn").click(); }
  if(e.key==="Escape"){ game.selectedBuild=null; game.placing=false; renderBuildMenu(); }
  const keys = {"1":"coal","2":"gas","3":"solar","4":"wind","5":"nuclear","6":"salt","7":"battery"};
  if(keys[e.key]) selectBuild(keys[e.key]);
});

// ----- Modal -----
const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modalTitle");
const modalTag = document.getElementById("modalTag");
const modalBody = document.getElementById("modalBody");
const modalStats = document.getElementById("modalStats");
const modalBtn = document.getElementById("modalBtn");
function showModal(tag,title,html,btnText,onClose){
  modalTag.textContent = tag;
  modalTitle.textContent = title;
  modalBody.innerHTML = html;
  modalBtn.textContent = btnText;
  modal.classList.add("show");
  game.paused = true;
  modalBtn.onclick = ()=>{ modal.classList.remove("show"); game.paused = false; if(onClose) onClose(); };
}
document.getElementById("helpBtn").addEventListener("click",()=>{
  showModal("How to play","Power the AI",`
    <p>Your AI datacenter needs <b>60 MW+</b> around the clock. Build power plants on the left side field. Keep the AI at <b>70%+</b> power for 30 days.</p>
    <p><b>Coal</b> is cheap but builds CO2. <b>Nuclear</b> is expensive but clean and reliable. <b>Solar + Molten Salt</b> is the elegant path: solar by day, stored heat by night. <b>Batteries</b> absorb wind/solar surplus for lean hours.</p>
    <p>Keys: <b>Space</b> pause · <b>1-7</b> select build · <b>Esc</b> cancel</p>
  `,"Got it");
});

// ----- Particles (juice) -----
function spawnParticles(x,y,color,n){
  for(let i=0;i<n;i++){
    game.particles.push({
      x,y, vx:(Math.random()-0.5)*3, vy:-Math.random()*3-1,
      life:30+Math.random()*20, color, size:2+Math.random()*2
    });
  }
}

// ----- Simulation tick -----
function tick(dtMs){
  if(game.gameOver || game.won || game.paused) return;
  const dt = dtMs * game.speed;
  game.totalTimeMs += dt;

  // time advance
  const hoursPerMs = 24 / DAY_LENGTH_MS;
  game.time += dt * hoursPerMs;
  while(game.time >= 24){
    game.time -= 24;
    game.day += 1;
    onNewDay();
  }

  // weather
  if(game.totalTimeMs > game.weatherEnd){
    const r = Math.random();
    if(r<0.22){ game.weatherSolar = 0.2; game.weatherWind = 1.0; game.weatherLabel="Cloudy week"; }
    else if(r<0.42){ game.weatherSolar = 1.0; game.weatherWind = 0.25; game.weatherLabel="Calm period"; }
    else { game.weatherSolar = 1.0; game.weatherWind = 1.0; game.weatherLabel="Clear"; }
    game.weatherEnd = game.totalTimeMs + (2+Math.random()*3)*DAY_LENGTH_MS;
    if(game.weatherLabel!=="Clear") logMsg(`Weather: ${game.weatherLabel}`,"warn");
  }

  // Demand drifts with "AI load"
  game.demand = DEMAND_BASE + Math.sin(game.totalTimeMs*0.0001)*8 + game.day*0.5;

  // Compute generation
  const isDay = game.time>6 && game.time<19;
  const solarPhase = isDay ? Math.sin(((game.time-6)/13)*Math.PI) : 0;

  let totalSupply = 0, runCost = 0, co2Add = 0;
  const mix = {};
  for(const p of game.plants){
    const s = SOURCES[p.type];
    p.age += dt;
    if(s.battery) continue;
    // reliability flicker
    if(Math.random() < 0.005) p.relRoll = Math.random() < s.rel ? 1 : 0.4;
    let output = s.mw * p.relRoll;
    if(s.needsSun) output *= solarPhase * game.weatherSolar;
    if(s.needsWind){
      const gust = 0.6 + Math.sin(game.totalTimeMs*0.0007 + p.x*0.01)*0.4;
      output *= Math.max(0,gust) * game.weatherWind;
    }
    if(!isFinite(output) || output<0) output = 0;
    p.currentOutput = output;
    totalSupply += output;
    mix[p.type] = (mix[p.type]||0) + output;
    // costs scale with hours of sim time
    const hrs = dt * hoursPerMs;
    runCost += s.runCost * hrs;
    co2Add += s.co2 * (output/s.mw) * hrs;
  }

  // Batteries: charge from surplus, discharge on deficit
  const batteries = game.plants.filter(p=>SOURCES[p.type].battery);
  const deficit = game.demand - totalSupply;
  if(deficit < 0){
    // surplus -> charge
    let surplus = -deficit;
    for(const b of batteries){
      const cap = SOURCES.battery.cap;
      const room = cap - b.charge;
      const take = Math.min(room, surplus, cap*0.2); // 0.2 cap/tick
      b.charge += take; surplus -= take;
      if(surplus<=0) break;
    }
  } else if(deficit > 0){
    let need = deficit;
    for(const b of batteries){
      const give = Math.min(b.charge, need, SOURCES.battery.cap*0.3);
      b.charge -= give; need -= give;
      totalSupply += give;
      mix.battery = (mix.battery||0) + give;
      if(need<=0) break;
    }
  }

  // Update power meter
  const supplyRatio = totalSupply / game.demand;
  const targetPower = Math.max(0, Math.min(100, supplyRatio*100));
  game.power += (targetPower - game.power) * Math.min(1, dt*0.004);

  // Track avg power
  game.avgPowerAcc += game.power * dt;
  game.avgPowerN += dt;

  // Money: AI produces queries based on power
  const hrs = dt * hoursPerMs;
  const tier = game.power>=70 ? 1.0 : game.power>=40 ? 0.6 : game.power>=20 ? 0.25 : 0;
  const queriesThisTick = tier * 300 * hrs; // per hour
  game.queries += queriesThisTick;
  const income = queriesThisTick * 0.035 - runCost;
  game.money += income;
  game.money = Math.max(0, game.money);

  // CO2
  game.co2 += co2Add;
  if(game.co2 > 200 && !game.regWarnIssued){
    game.regWarnIssued = true;
    logMsg("Regulatory warning: CO2 exceeds 200","warn");
  }
  if(game.co2 > 400){
    const fine = Math.min(game.money, 2*hrs);
    game.money -= fine;
  }

  // Offline detection
  if(game.power < 20){
    game.offlineTimer += dt;
    if(game.offlineTimer > 30000) endGame(false,"AI offline too long");
  } else {
    game.offlineTimer = Math.max(0, game.offlineTimer - dt*2);
  }

  // Particles
  for(let i=game.particles.length-1;i>=0;i--){
    const p = game.particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life--;
    if(p.life<=0) game.particles.splice(i,1);
  }

  // Store mix for UI
  game._mix = mix; game._supply = totalSupply;
}

function onNewDay(){
  logMsg(`Day ${game.day} begins`,"info");
  if(game.day > GAME_DAYS){
    const avg = game.avgPowerN>0 ? game.avgPowerAcc/game.avgPowerN : 0;
    if(avg >= 70) endGame(true,`Survived ${GAME_DAYS} days at ${avg.toFixed(1)}% avg power`);
    else endGame(false,`Average power ${avg.toFixed(1)}% below 70% target`);
  }
}

function endGame(won,reason){
  if(game.gameOver || game.won) return;
  game.gameOver = !won; game.won = won;
  const avg = game.avgPowerN>0 ? game.avgPowerAcc/game.avgPowerN : 0;
  const co2Pen = Math.max(0.3, 1 - game.co2/1000);
  const score = Math.floor(game.queries * (avg/100) * co2Pen);
  const stats = `<div class="stats">
    <div>Queries<br><b>${Math.floor(game.queries).toLocaleString()}</b></div>
    <div>Avg Power<br><b>${avg.toFixed(1)}%</b></div>
    <div>CO2 Total<br><b>${Math.floor(game.co2)}</b></div>
    <div>Final Score<br><b>${score.toLocaleString()}</b></div>
  </div>`;
  showModal(won?"Victory":"Game Over", won?"AI Survived":"Datacenter Failed",
    `<p>${reason}</p>${stats}<p>Reload the page to play again.</p>`,
    "Close",()=>{});
}

// ----- Rendering -----
function draw(){
  // Sky background with day/night gradient
  const t = game.time/24;
  const sunAng = (game.time/24)*Math.PI*2 - Math.PI/2;
  const isDay = game.time>6 && game.time<19;
  const sky = ctx.createLinearGradient(0,0,0,H);
  if(isDay){
    const daylight = Math.sin(((game.time-6)/13)*Math.PI);
    const top = `rgb(${10+30*daylight},${12+40*daylight},${46+60*daylight})`;
    sky.addColorStop(0, top);
    sky.addColorStop(1, "#07091a");
  } else {
    sky.addColorStop(0, "#050816");
    sky.addColorStop(1, "#07091a");
  }
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);

  // Stars (at night)
  if(!isDay){
    ctx.fillStyle = "#fff";
    for(let i=0;i<80;i++){
      const sx = (i*131 % W);
      const sy = (i*71 % (H*0.5));
      const a = 0.3 + Math.sin(game.totalTimeMs*0.002 + i)*0.3;
      ctx.globalAlpha = Math.max(0.1,a);
      ctx.fillRect(sx,sy,1.2,1.2);
    }
    ctx.globalAlpha = 1;
  }

  // Sun / Moon
  const cx = W*0.5, cy = H*0.25;
  const rx = W*0.4, ry = H*0.22;
  const bodyX = cx + Math.cos(sunAng)*rx;
  const bodyY = cy + Math.sin(sunAng)*ry;
  if(isDay){
    ctx.fillStyle = "#ffd64a";
    ctx.shadowColor = "#ffd64a"; ctx.shadowBlur = 30;
    ctx.beginPath(); ctx.arc(bodyX,bodyY,22,0,Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle = "#d8ddf0";
    ctx.shadowColor = "#8aa0ff"; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(bodyX,bodyY,18,0,Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur = 0;

  const L = getLayout();

  // Ground field
  ctx.fillStyle = "#0a0f2a";
  ctx.fillRect(L.fieldX-10, L.fieldY-10, L.fieldW+20, L.fieldH+20);
  // Grid pattern
  ctx.strokeStyle = "rgba(90,110,200,0.12)";
  ctx.lineWidth = 1;
  for(let gx=L.fieldX; gx<L.fieldX+L.fieldW; gx+=30){
    ctx.beginPath(); ctx.moveTo(gx,L.fieldY); ctx.lineTo(gx,L.fieldY+L.fieldH); ctx.stroke();
  }
  for(let gy=L.fieldY; gy<L.fieldY+L.fieldH; gy+=30){
    ctx.beginPath(); ctx.moveTo(L.fieldX,gy); ctx.lineTo(L.fieldX+L.fieldW,gy); ctx.stroke();
  }
  // Field border
  ctx.strokeStyle = "#2a3170"; ctx.lineWidth = 2;
  ctx.strokeRect(L.fieldX-10, L.fieldY-10, L.fieldW+20, L.fieldH+20);
  ctx.fillStyle = "#5a6ab0"; ctx.font="10px system-ui";
  ctx.fillText("POWER FIELD — click to build",L.fieldX-6,L.fieldY-16);

  // Datacenter
  drawDatacenter(L);

  // Power lines from plants to DC
  for(const p of game.plants){
    const s = SOURCES[p.type];
    const alive = (p.currentOutput||0)>0.1 || s.battery;
    const pulse = alive ? (0.4 + Math.sin(game.totalTimeMs*0.005 + p.x)*0.3) : 0.1;
    ctx.strokeStyle = s.battery ? "rgba(61,220,132,"+pulse+")" : `rgba(245,197,66,${pulse})`;
    ctx.lineWidth = alive ? 2 : 1;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    const dcCX = L.dcX + L.dcW*0.25, dcCY = L.dcY + L.dcH*0.5;
    ctx.quadraticCurveTo((p.x+dcCX)/2, (p.y+dcCY)/2 - 20, dcCX, dcCY);
    ctx.stroke();
  }

  // Plants
  for(const p of game.plants) drawPlant(p);

  // CO2 clouds above dirty plants
  for(const p of game.plants){
    const s = SOURCES[p.type];
    if(!s.dirty || (p.currentOutput||0)<0.1) continue;
    const cc = 6;
    for(let i=0;i<cc;i++){
      const cx = p.x + Math.sin(game.totalTimeMs*0.001 + i)*8;
      const cy = p.y - 30 - i*6 - (game.totalTimeMs*0.01 % 20);
      ctx.fillStyle = `rgba(90,80,90,${0.35-i*0.04})`;
      ctx.beginPath(); ctx.arc(cx,cy,8+i,0,Math.PI*2); ctx.fill();
    }
  }

  // Particles
  for(const p of game.particles){
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0,p.life/50);
    ctx.fillRect(p.x,p.y,p.size,p.size);
  }
  ctx.globalAlpha = 1;

  // Placement ghost
  if(game.placing && game.selectedBuild && game.placeXY && inField(game.placeXY.x,game.placeXY.y)){
    const s = SOURCES[game.selectedBuild];
    ctx.globalAlpha = 0.5;
    drawPlant({x:game.placeXY.x,y:game.placeXY.y,type:game.selectedBuild,currentOutput:s.mw,charge:0,age:0});
    ctx.globalAlpha = 1;
  }
}

function drawDatacenter(L){
  // Building
  const grad = ctx.createLinearGradient(L.dcX,L.dcY,L.dcX,L.dcY+L.dcH);
  grad.addColorStop(0,"#1a2050"); grad.addColorStop(1,"#0a0f2e");
  ctx.fillStyle = grad;
  ctx.fillRect(L.dcX, L.dcY, L.dcW, L.dcH);
  ctx.strokeStyle = "#2a3170"; ctx.lineWidth = 2;
  ctx.strokeRect(L.dcX, L.dcY, L.dcW, L.dcH);

  // Server rack rows
  for(let r=0;r<6;r++){
    const ry = L.dcY + 40 + r*((L.dcH-80)/6);
    ctx.fillStyle = "#050816";
    ctx.fillRect(L.dcX+20, ry, L.dcW-40, 14);
    // LEDs blink based on power
    for(let c=0;c<6;c++){
      const on = Math.random() < game.power/110;
      ctx.fillStyle = on ? (game.power>70?"#3ddc84":game.power>40?"#ffb020":"#ff4d6d") : "#1a2050";
      ctx.fillRect(L.dcX+30+c*((L.dcW-60)/6), ry+4, 4, 6);
    }
  }

  // AI face display
  const faceX = L.dcX + L.dcW*0.5, faceY = L.dcY + L.dcH*0.5;
  const faceR = Math.min(50, L.dcW*0.22);
  ctx.fillStyle = "#050816";
  ctx.beginPath(); ctx.arc(faceX,faceY,faceR+4,0,Math.PI*2); ctx.fill();
  // screen gradient based on power
  let faceColor = "#3ddc84";
  if(game.power<70) faceColor = "#ffb020";
  if(game.power<40) faceColor = "#ff6040";
  if(game.power<20) faceColor = "#ff2040";
  const fg = ctx.createRadialGradient(faceX,faceY,2,faceX,faceY,faceR);
  fg.addColorStop(0, faceColor);
  fg.addColorStop(1, "#050816");
  ctx.fillStyle = fg;
  ctx.beginPath(); ctx.arc(faceX,faceY,faceR,0,Math.PI*2); ctx.fill();

  // eyes
  const eyeOff = faceR*0.35, eyeY = faceY - faceR*0.15, eyeR = Math.max(3, faceR*0.12);
  ctx.fillStyle = "#07091a";
  // blink / droop when low
  const droop = game.power<40 ? 0.6 : game.power<70 ? 0.85 : 1;
  ctx.beginPath(); ctx.ellipse(faceX-eyeOff,eyeY,eyeR,eyeR*droop,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(faceX+eyeOff,eyeY,eyeR,eyeR*droop,0,0,Math.PI*2); ctx.fill();
  // mouth
  ctx.strokeStyle = "#07091a"; ctx.lineWidth = 3; ctx.lineCap="round";
  ctx.beginPath();
  if(game.power>70){
    ctx.arc(faceX,faceY+faceR*0.25,faceR*0.3,0,Math.PI);
  } else if(game.power>40){
    ctx.moveTo(faceX-faceR*0.3,faceY+faceR*0.3); ctx.lineTo(faceX+faceR*0.3,faceY+faceR*0.3);
  } else {
    ctx.arc(faceX,faceY+faceR*0.4,faceR*0.3,Math.PI,Math.PI*2);
  }
  ctx.stroke();

  // Status text
  ctx.fillStyle = "#e6e9ff"; ctx.font = "bold 11px system-ui"; ctx.textAlign="center";
  let status = "FULL CAPACITY";
  if(game.power<70) status = "DEGRADED";
  if(game.power<40) status = "SLOW";
  if(game.power<20) status = "OFFLINE";
  ctx.fillText(status, faceX, faceY+faceR+18);
  ctx.textAlign="left";
}

function drawPlant(p){
  const s = SOURCES[p.type];
  // shadow
  ctx.fillStyle = "rgba(0,0,0,0.4)";
  ctx.beginPath(); ctx.ellipse(p.x, p.y+22, 22, 6, 0, 0, Math.PI*2); ctx.fill();

  // base
  ctx.fillStyle = s.color;
  ctx.beginPath(); ctx.arc(p.x,p.y,20,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = "#07091a"; ctx.lineWidth=2; ctx.stroke();

  // type-specific flourish
  ctx.fillStyle = "#07091a";
  ctx.font = "bold 14px system-ui"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(s.icon, p.x, p.y+1);
  ctx.textBaseline="alphabetic"; ctx.textAlign="left";

  // battery charge bar
  if(s.battery){
    const pct = (p.charge||0)/SOURCES.battery.cap;
    ctx.fillStyle = "#050816"; ctx.fillRect(p.x-18,p.y+26,36,4);
    ctx.fillStyle = "#3ddc84"; ctx.fillRect(p.x-18,p.y+26,36*pct,4);
  } else {
    // output ring
    const out = (p.currentOutput||0)/s.mw;
    ctx.strokeStyle = out>0.5?"#3ddc84":out>0.1?"#ffb020":"#ff4d6d";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x,p.y,24,-Math.PI/2,-Math.PI/2 + Math.PI*2*out); ctx.stroke();
  }

  // Rotating wind blades
  if(p.type==="wind"){
    const spin = game.totalTimeMs*0.006*(p.currentOutput/s.mw || 0.1);
    ctx.strokeStyle = "#e6e9ff"; ctx.lineWidth=2;
    for(let i=0;i<3;i++){
      const a = spin + i*(Math.PI*2/3);
      ctx.beginPath(); ctx.moveTo(p.x,p.y-8);
      ctx.lineTo(p.x+Math.cos(a)*14, p.y-8+Math.sin(a)*14);
      ctx.stroke();
    }
  }
}

// ----- UI refresh -----
const powerVal = document.getElementById("powerVal");
const powerBar = document.getElementById("powerBar");
const moneyVal = document.getElementById("moneyVal");
const co2Val = document.getElementById("co2Val");
const co2Bar = document.getElementById("co2Bar");
const dayVal = document.getElementById("dayVal");
const scoreVal = document.getElementById("scoreVal");
const mixStack = document.getElementById("mixStack");
const mixLegend = document.getElementById("mixLegend");

let lastUIFrame = 0;
function refreshUI(now){
  if(now - lastUIFrame < 100) return;
  lastUIFrame = now;
  powerVal.textContent = Math.round(game.power)+"%";
  powerBar.style.width = Math.max(0,Math.min(100,game.power))+"%";
  powerBar.style.background = game.power>70?"var(--gold)":game.power>40?"var(--amber)":"var(--red)";
  moneyVal.textContent = "$"+Math.floor(game.money).toLocaleString();
  co2Val.textContent = Math.floor(game.co2);
  co2Bar.style.width = Math.min(100, game.co2/5)+"%";
  const hh = String(Math.floor(game.time)).padStart(2,"0");
  const mm = String(Math.floor((game.time%1)*60)).padStart(2,"0");
  dayVal.textContent = `${game.day} · ${hh}:${mm}`;
  scoreVal.textContent = Math.floor(game.queries).toLocaleString();

  // Mix
  const mix = game._mix || {};
  const total = Object.values(mix).reduce((a,b)=>a+b,0) || 1;
  mixStack.innerHTML = "";
  mixLegend.innerHTML = "";
  for(const [k,v] of Object.entries(mix)){
    if(v<0.1) continue;
    const pct = (v/total*100).toFixed(0);
    const span = document.createElement("span");
    span.style.width = pct+"%";
    span.style.background = SOURCES[k].color;
    mixStack.appendChild(span);
    const leg = document.createElement("span");
    leg.innerHTML = `<i style="background:${SOURCES[k].color}"></i>${SOURCES[k].name.split(" ")[0]} ${pct}%`;
    mixLegend.appendChild(leg);
  }
  // Refresh build menu affordances every second
  if(Math.floor(now/500) !== Math.floor(lastUIFrame/500+1)){
    renderBuildMenu();
  }
}

// ----- Main loop -----
function loop(now){
  const dt = Math.min(100, now - game.lastTick);
  game.lastTick = now;
  tick(dt);
  draw();
  refreshUI(now);
  requestAnimationFrame(loop);
}

// ----- Init -----
function init(){
  renderBuildMenu();
  // Start with a small coal plant
  const L = getLayout();
  game.plants.push({
    id:"start", type:"coal",
    x: L.fieldX + L.fieldW*0.25, y: L.fieldY + L.fieldH*0.5,
    online:true, age:0, produced:0, charge:0, relRoll:1, currentOutput:40
  });
  logMsg("Datacenter booted. Coal plant online.","good");
  logMsg("Keep AI at 70%+ for 30 days.","info");

  showModal("Mission Briefing","Power the AI",`
    <p>You run an AI datacenter. The AI earns money by processing queries — but only when it has enough power. Your job: build a balanced energy mix.</p>
    <p><b>Coal</b> is cheap dirty baseload. <b>Solar + Molten Salt</b> is the clean path. <b>Nuclear</b> is the endgame. <b>Batteries</b> absorb wind/solar surplus.</p>
    <p>Survive <b>30 days</b> with <b>70%+</b> average power.</p>
  `,"Start",()=>{ game.lastTick = performance.now(); });

  requestAnimationFrame(loop);
}
init();
</script>
