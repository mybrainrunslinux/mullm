<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>muLLM Agent Sessions</title>
<style>
:root {
  --gold: #c9a84c;
  --gold-light: #e8c86a;
  --navy: #0d1b2a;
  --navy-mid: #1a2d45;
  --navy-light: #243854;
  --text: #e8e8e8;
  --text-dim: #8a9ab0;
  --green: #3ecf8e;
  --red: #e05252;
  --orange: #e09452;
  --yellow: #e0d452;
  --blue: #4a9ff5;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--navy);
  color: var(--text);
  font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  font-size: 13px;
  min-height: 100vh;
}

header {
  background: var(--navy-mid);
  border-bottom: 1px solid var(--gold);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
}

header h1 {
  font-size: 18px;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: 1px;
}

.badge {
  background: var(--navy-light);
  border: 1px solid var(--gold);
  color: var(--gold-light);
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
}

.badge-green { border-color: var(--green); color: var(--green); }
.badge-red   { border-color: var(--red);   color: var(--red); }

nav {
  padding: 8px 20px;
  background: var(--navy-mid);
  border-bottom: 1px solid var(--navy-light);
  font-size: 12px;
  color: var(--text-dim);
}
nav a { color: var(--gold); text-decoration: none; margin-right: 16px; }
nav a:hover { color: var(--gold-light); }

main { padding: 20px; }

.stats-row {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.stat-card {
  background: var(--navy-mid);
  border: 1px solid var(--navy-light);
  border-radius: 6px;
  padding: 12px 16px;
  min-width: 140px;
  flex: 1;
}
.stat-card .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
.stat-card .value { font-size: 22px; font-weight: 700; color: var(--gold); margin-top: 4px; }

.section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.section-header h2 {
  font-size: 14px;
  font-weight: 600;
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.table-wrap {
  background: var(--navy-mid);
  border: 1px solid var(--navy-light);
  border-radius: 6px;
  overflow: hidden;
}

table {
  width: 100%;
  border-collapse: collapse;
}
thead tr {
  background: var(--navy-light);
}
th {
  text-align: left;
  padding: 10px 14px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--navy-light);
}
td {
  padding: 10px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  vertical-align: middle;
}
tbody tr:hover { background: rgba(201, 168, 76, 0.05); }
tbody tr:last-child td { border-bottom: none; }

.status-pill {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
}
.status-running  { background: rgba(62,207,142,0.15); color: var(--green); border: 1px solid var(--green); }
.status-halted   { background: rgba(224,82,82,0.15);  color: var(--red);   border: 1px solid var(--red); }
.status-done     { background: rgba(74,159,245,0.15); color: var(--blue);  border: 1px solid var(--blue); }
.status-idle     { background: rgba(138,154,176,0.15); color: var(--text-dim); border: 1px solid var(--text-dim); }
.status-error    { background: rgba(224,148,82,0.15); color: var(--orange); border: 1px solid var(--orange); }

.model-pill {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 11px;
  background: var(--navy-light);
  color: var(--gold-light);
}
.model-cloud { color: var(--orange); }

.controls { display: flex; gap: 6px; }
.btn {
  border: 1px solid var(--navy-light);
  background: transparent;
  color: var(--text-dim);
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 4px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}
.btn:hover { border-color: var(--gold); color: var(--gold); }
.btn-stop:hover    { border-color: var(--red); color: var(--red); }
.btn-escalate:hover { border-color: var(--orange); color: var(--orange); }

.empty-state {
  padding: 40px;
  text-align: center;
  color: var(--text-dim);
  font-size: 13px;
}

.sse-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-dim);
  margin-left: auto;
}
.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--text-dim);
}
.dot.live { background: var(--green); animation: pulse 1.5s infinite; }
.dot.dead { background: var(--red); }

@keyframes pulse {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.4; }
}

.task-cell {
  max-width: 280px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
}

.mono { font-family: monospace; color: var(--text-dim); font-size: 11px; }

footer {
  text-align: center;
  padding: 20px;
  color: var(--text-dim);
  font-size: 11px;
  border-top: 1px solid var(--navy-light);
  margin-top: 40px;
}
</style>
</head>
<body>

<header>
  <h1>muLLM / Agent Sessions</h1>
  <span class="badge" id="mode-badge">AGENTIC OFF</span>
  <div class="sse-status" id="sse-status">
    <div class="dot" id="sse-dot"></div>
    <span id="sse-label">connecting…</span>
  </div>
</header>

<nav>
  <a href="/dashboard">Dashboard</a>
  <a href="/chat">Chat</a>
  <a href="/bench">Bench</a>
  <a href="/sessions">Sessions</a>
</nav>

<main>
  <div class="stats-row">
    <div class="stat-card">
      <div class="label">Active</div>
      <div class="value" id="stat-active">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Total Turns</div>
      <div class="value" id="stat-turns">—</div>
    </div>
    <div class="stat-card">
      <div class="label">$ Spent</div>
      <div class="value" id="stat-cost">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Completed</div>
      <div class="value" id="stat-done">—</div>
    </div>
  </div>

  <div class="section-header">
    <h2>Agent Sessions</h2>
    <button class="btn" onclick="refreshSessions()" title="Refresh session list">↺ Refresh</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Session ID</th>
          <th>Task</th>
          <th>Turn</th>
          <th>Model</th>
          <th>$ Spent</th>
          <th>Budget Left</th>
          <th>Status</th>
          <th>Controls</th>
        </tr>
      </thead>
      <tbody id="sessions-tbody">
        <tr><td colspan="8" class="empty-state">Loading sessions…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<footer>muLLM Agent Dashboard · tbench.ai adapter · <span id="ts">—</span></footer>

<script>
const BASE = location.origin;
let sseSource = null;
let allSessions = [];

function statusClass(status) {
  return 'status-' + (status || 'idle');
}

function modelClass(model) {
  return model && model !== 'local' ? 'model-pill model-cloud' : 'model-pill';
}

function renderSessions(sessions) {
  allSessions = sessions || [];
  const tbody = document.getElementById('sessions-tbody');

  // Stats
  const active = sessions.filter(s => s.status === 'running').length;
  const totalTurns = sessions.reduce((a, s) => a + (s.turn || 0), 0);
  const totalCost = sessions.reduce((a, s) => a + (s.cost_spent || 0), 0);
  const done = sessions.filter(s => s.status === 'done').length;

  document.getElementById('stat-active').textContent = active;
  document.getElementById('stat-turns').textContent = totalTurns;
  document.getElementById('stat-cost').textContent = '$' + totalCost.toFixed(4);
  document.getElementById('stat-done').textContent = done;

  if (!sessions.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty-state">No active agent sessions. Start one via <code>mullm-agent "task"</code>.</td></tr>';
    return;
  }

  tbody.innerHTML = sessions.map(s => {
    const sid = s.session_id || '—';
    const task = s.task || '—';
    const turn = s.turn != null ? s.turn : '—';
    const model = s.model || 'local';
    const cost = typeof s.cost_spent === 'number' ? '$' + s.cost_spent.toFixed(4) : '—';
    const budget = typeof s.budget_remaining === 'number' ? '$' + s.budget_remaining.toFixed(4) : '—';
    const status = s.status || 'idle';
    const isRunning = status === 'running';

    return `
      <tr id="row-${sid}">
        <td class="mono">${sid.slice(0, 20)}</td>
        <td class="task-cell" title="${task}">${task}</td>
        <td>${turn}</td>
        <td><span class="${modelClass(model)}">${model}</span></td>
        <td>${cost}</td>
        <td>${budget}</td>
        <td><span class="status-pill ${statusClass(status)}">${status}</span></td>
        <td>
          <div class="controls">
            <button class="btn btn-stop" onclick="controlSession('${sid}','stop')" ${!isRunning ? 'disabled' : ''} title="Stop session">Stop</button>
            <button class="btn btn-escalate" onclick="controlSession('${sid}','escalate')" ${!isRunning ? 'disabled' : ''} title="Force cloud escalation">Escalate</button>
            <button class="btn" onclick="controlSession('${sid}','pause')" ${!isRunning ? 'disabled' : ''} title="Pause 5s">Pause</button>
          </div>
        </td>
      </tr>`;
  }).join('');
}

async function refreshSessions() {
  try {
    const r = await fetch(BASE + '/api/agent/sessions', { headers: { Accept: 'application/json' } });
    if (r.ok) {
      const data = await r.json();
      renderSessions(data.sessions || []);
    }
  } catch (e) {
    console.warn('refresh failed', e);
  }
}

async function controlSession(sessionId, action) {
  try {
    const r = await fetch(BASE + `/api/agent/${sessionId}/control`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action }),
    });
    if (r.ok) {
      await refreshSessions();
    } else {
      alert('Control failed: ' + r.status);
    }
  } catch (e) {
    alert('Control error: ' + e.message);
  }
}

function connectSSE(sessionId, task) {
  if (sseSource) {
    sseSource.close();
  }
  const url = BASE + `/agent/stream?task=${encodeURIComponent(task)}&session_id=${sessionId}`;
  sseSource = new EventSource(url);

  const dot = document.getElementById('sse-dot');
  const label = document.getElementById('sse-label');

  sseSource.onopen = () => {
    dot.className = 'dot live';
    label.textContent = 'live · ' + sessionId;
  };

  sseSource.onmessage = (e) => {
    try {
      const ev = JSON.parse(e.data);
      // Refresh the table on meaningful events
      if (['start','turn','done','halted','bash_result'].includes(ev.type)) {
        refreshSessions();
      }
    } catch {}
  };

  sseSource.onerror = () => {
    dot.className = 'dot dead';
    label.textContent = 'disconnected';
  };
}

// Check AGENTIC_MODE status
async function checkMode() {
  try {
    const r = await fetch(BASE + '/health');
    if (r.ok) {
      const data = await r.json();
      const badge = document.getElementById('mode-badge');
      if (data.agentic_mode) {
        badge.textContent = 'AGENTIC ON';
        badge.className = 'badge badge-green';
      } else {
        badge.textContent = 'AGENTIC OFF';
        badge.className = 'badge badge-red';
      }
    }
  } catch {}
}

// Update timestamp footer
function tick() {
  document.getElementById('ts').textContent = new Date().toLocaleTimeString();
}

// Init
checkMode();
refreshSessions();
tick();
setInterval(refreshSessions, 5000);
setInterval(tick, 1000);
</script>
</body>
</html>
