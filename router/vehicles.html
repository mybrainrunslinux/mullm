<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>muLLM — Vehicle Lab</title><script type="importmap">{"imports":{"three":"/static/three/three.module.js","three/addons/":"/static/three/addons/"}}</script><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#8ec9dc;font:13px system-ui;color:#eef}canvas{display:block}.ui{position:fixed;z-index:3;left:14px;top:14px;width:min(340px,calc(100vw - 28px));padding:14px;background:#08141ddd;border:1px solid #2d6375;border-radius:10px}h1{margin:0;color:#62e8ff;font-size:20px}.hint{color:#aac2cc;font-size:11px;line-height:1.4;margin:5px 0 10px}.types{display:flex;flex-wrap:wrap;gap:5px}.types button,.actions button{background:#102b39;color:#b8f3ff;border:1px solid #28677d;border-radius:5px;padding:6px;cursor:pointer}.types button.active{background:#16708b}.actions{margin-top:9px;display:flex;gap:6px}.hud{position:fixed;right:12px;top:12px;background:#06131acc;padding:8px;border-radius:7px;color:#b8efff;font:11px monospace}</style></head><body><section class="ui"><h1>Vehicle Lab Island</h1><div class="hint">r185 test range: oval track, runway + helipads, cliff launch, gondola, lake and animated ocean. WASD/arrow keys drive; Q/E articulate steering or yaw; Space brakes/deploys. Vehicle parts use named pivots suitable for GLB rigging.</div><div class="types" id="types"></div><div class="actions"><button id="reset">Reset</button><button id="animate">Wipers / canopy</button><button id="export">Export vehicle GLB</button></div></section><div class="hud" id="hud"></div><script type="module">import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFExporter}from'three/addons/exporters/GLTFExporter.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x91ccdf);scene.fog=new THREE.Fog(0x91ccdf,260,800);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,1500);camera.position.set(100,80,130);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;scene.add(new THREE.HemisphereLight(0xdff8ff,0x36533a,2.3));const sun=new THREE.DirectionalLight(0xfff1cf,3);sun.position.set(100,180,60);sun.castShadow=true;scene.add(sun);
const island=new THREE.Mesh(new THREE.CylinderGeometry(190,220,18,96),new THREE.MeshStandardMaterial({color:0x628a4b,roughness:.95}));island.position.y=-9;island.receiveShadow=true;scene.add(island);const oceanGeo=new THREE.PlaneGeometry(1200,1200,80,80);oceanGeo.rotateX(-Math.PI/2);const ocean=new THREE.Mesh(oceanGeo,new THREE.MeshPhysicalMaterial({color:0x167aa0,roughness:.16,metalness:.05,transmission:.12,transparent:true,opacity:.88}));ocean.position.y=-3;scene.add(ocean);const lake=new THREE.Mesh(new THREE.CircleGeometry(42,64),new THREE.MeshPhysicalMaterial({color:0x1d91b0,roughness:.2,transparent:true,opacity:.8}));lake.rotation.x=-Math.PI/2;lake.position.set(72,.3,45);scene.add(lake);
const track=new THREE.Mesh(new THREE.RingGeometry(78,98,96),new THREE.MeshStandardMaterial({color:0x30363b,roughness:.92,side:THREE.DoubleSide}));track.rotation.x=-Math.PI/2;track.scale.y=.62;track.position.y=.5;scene.add(track);const runway=new THREE.Mesh(new THREE.BoxGeometry(150,.5,18),new THREE.MeshStandardMaterial({color:0x42494d}));runway.position.set(-15,.6,-110);scene.add(runway);for(let i=-60;i<=60;i+=15){const m=new THREE.Mesh(new THREE.BoxGeometry(7,.05,.5),new THREE.MeshBasicMaterial({color:0xffffff}));m.position.set(i,1,-110);scene.add(m)}for(const x of[-65,-35]){const pad=new THREE.Mesh(new THREE.CircleGeometry(12,32),new THREE.MeshStandardMaterial({color:0x4b5358}));pad.rotation.x=-Math.PI/2;pad.position.set(x,.7,-70);scene.add(pad)}const cliff=new THREE.Mesh(new THREE.BoxGeometry(62,55,55),new THREE.MeshStandardMaterial({color:0x71654e,roughness:1}));cliff.position.set(118,25,-70);scene.add(cliff);const cable=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(75,3,-40),new THREE.Vector3(118,57,-70)]),new THREE.LineBasicMaterial({color:0x222222}));scene.add(cable);
const kinds=['car','moto','boat','drone','helo','plane','glider','parachute'];let vehicle,kind='car',speed=0,steer=0,art=.0;const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.55,metalness:.15});
function wheel(x,z){const p=new THREE.Group();p.name='WheelPivot';const w=new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.25,.8,20),M(0x17191b));w.rotation.z=Math.PI/2;p.add(w);p.position.set(x,0,z);return p}function build(k){const g=new THREE.Group();g.name=`${k}_Rig`;const body=new THREE.Mesh(new THREE.BoxGeometry(k==='plane'||k==='glider'?8:5,1.5,k==='boat'?10:8),M(k==='boat'?0xf2eee3:0xd9433b));body.position.y=2;body.name='Body';g.add(body);if(k==='car'||k==='moto'){const xs=k==='moto'?[0]:[-2.2,2.2];for(const x of xs)for(const z of[-2.5,2.5])g.add(wheel(x,z));const wipe=new THREE.Group();wipe.name='WiperPivot';const blade=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,2),M(0x111111));blade.position.z=1;wipe.add(blade);wipe.position.set(0,3,-1);g.add(wipe)}if(k==='boat'){const mast=new THREE.Group();mast.name='SailPivot';mast.add(new THREE.Mesh(new THREE.BoxGeometry(.15,9,.15),M(0x553b22)));const sail=new THREE.Mesh(new THREE.PlaneGeometry(5,7),new THREE.MeshStandardMaterial({color:0xf4ead4,side:THREE.DoubleSide}));sail.position.set(2.5,1,0);sail.rotation.y=Math.PI/2;mast.add(sail);mast.position.y=6;g.add(mast)}if(['drone','helo'].includes(k)){const rotor=new THREE.Group();rotor.name='RotorPivot';rotor.add(new THREE.Mesh(new THREE.BoxGeometry(k==='helo'?15:9,.12,.45),M(0x20252a)));rotor.position.y=4;g.add(rotor)}if(['plane','glider'].includes(k)){const wing=new THREE.Group();wing.name='WingRig';wing.add(new THREE.Mesh(new THREE.BoxGeometry(k==='glider'?28:20,.35,4),M(0xe8ecee)));wing.position.y=2.5;g.add(wing);const elevator=new THREE.Mesh(new THREE.BoxGeometry(7,.25,2),M(0xb9c4ca));elevator.position.set(0,3.2,4);elevator.name='ElevatorPivot';g.add(elevator)}if(k==='parachute'){body.scale.set(.4,1.6,.4);const canopy=new THREE.Mesh(new THREE.SphereGeometry(7,24,12,0,Math.PI*2,0,Math.PI/2),new THREE.MeshStandardMaterial({color:0xff8b36,side:THREE.DoubleSide}));canopy.name='CanopyDeploy';canopy.position.y=12;g.add(canopy)}g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});return g}
function spawn(k){kind=k;if(vehicle)scene.remove(vehicle);vehicle=build(k);vehicle.position.set(k==='boat'?72:0,k==='boat'?1:3,k==='boat'?45:70);if(['drone','helo','plane','glider','parachute'].includes(k))vehicle.position.y=k==='parachute'?65:18;scene.add(vehicle);speed=0;document.querySelectorAll('.types button').forEach(b=>b.classList.toggle('active',b.textContent===k))}const box=document.getElementById('types');for(const k of kinds){const b=document.createElement('button');b.textContent=k;b.onclick=()=>spawn(k);box.appendChild(b)}spawn(kind);document.getElementById('reset').onclick=()=>spawn(kind);document.getElementById('animate').onclick=()=>art=art?0:1;document.getElementById('export').onclick=()=>new GLTFExporter().parse(vehicle,b=>{const u=URL.createObjectURL(new Blob([b])),a=document.createElement('a');a.href=u;a.download=`mullm-${kind}-rig.glb`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)},console.error,{binary:true});
const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{const dt=Math.min(.04,clock.getDelta()),throttle=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);steer=THREE.MathUtils.lerp(steer,(keys.a||keys.arrowleft?1:0)-(keys.d||keys.arrowright?1:0),dt*5);speed=THREE.MathUtils.lerp(speed,throttle*(kind==='car'||kind==='moto'?38:kind==='boat'?16:30),dt*2);if(keys[' '])speed*=.92;vehicle.rotation.y+=steer*speed*dt*.012;vehicle.translateZ(-speed*dt);if(['drone','helo','plane','glider','parachute'].includes(kind))vehicle.position.y+=((keys.e?1:0)-(keys.q?1:0))*18*dt;if(kind==='boat')vehicle.position.y=1+Math.sin(performance.now()*.002+vehicle.position.x*.05)*.45;vehicle.traverse(o=>{if(o.name==='WheelPivot')o.children[0].rotation.x-=speed*dt;if(o.name==='RotorPivot')o.rotation.y+=dt*(8+Math.abs(speed));if(o.name==='WiperPivot')o.rotation.y=Math.sin(performance.now()*.007)*art;if(o.name==='CanopyDeploy')o.scale.y=THREE.MathUtils.lerp(o.scale.y,art?0.15:1,dt*4)});const pos=ocean.geometry.attributes.position,t=performance.now()*.001;for(let i=0;i<pos.count;i++)pos.setY(i,Math.sin(pos.getX(i)*.025+t)*.7+Math.cos(pos.getZ(i)*.018+t*.8)*.55);pos.needsUpdate=true;ocean.geometry.computeVertexNormals();orbit.target.lerp(vehicle.position,.04);orbit.update();document.getElementById('hud').textContent=`${kind.toUpperCase()}  ${speed.toFixed(1)} u/s\nwind 7kt · waves ${(1.2+Math.sin(t)*.2).toFixed(1)}m`;renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
